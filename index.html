function openCourtZoom(from) {
  const src = from && from.querySelector ? from.querySelector('svg') : null;
  if (!src) return;
  const r = src.getBoundingClientRect();
  closeCourtZoom(true);
  const layer = document.createElement('div');
  layer.id = 'court-zoom';
  layer.className = 'court-zoom';
  layer.setAttribute('data-action', 'close-court-zoom');
  layer.setAttribute('role', 'dialog');
  layer.setAttribute('aria-modal', 'true');
  layer.setAttribute('aria-label', 'Схема корта');
  layer.innerHTML = `<button type="button" class="court-zoom-close" data-action="close-court-zoom" aria-label="Закрыть">${icon('close', 20)}</button><div class="court-zoom-stage">${src.outerHTML}</div>`;
  document.body.appendChild(layer);
  document.body.classList.add('court-zoom-open');
  bindCourtZoomSwipe(layer);
  const dest = layer.querySelector('.court-zoom-stage svg');
  if (reduceMotion()) { layer.classList.add('is-in'); return; }
  requestAnimationFrame(() => {
    if (!dest || !dest.isConnected) { layer.classList.add('is-in'); return; }
    const d = dest.getBoundingClientRect();
    const tx = (r.left + r.width / 2) - (d.left + d.width / 2);
    const ty = (r.top + r.height / 2) - (d.top + d.height / 2);
    const sx = r.width / (d.width || 1);
    const sy = r.height / (d.height || 1);
    layer.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: FOLD_EASE, fill: 'forwards' });
    dest.animate(
      [{ transform: 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ',' + sy + ')', opacity: .9 }, { transform: 'none', opacity: 1 }],
      { duration: FOLD_OPEN_MS, easing: FOLD_EASE, fill: 'forwards' }

    layer.classList.add('is-in');
  });
}
function closeCourtZoom(instant) {
  const layer = document.getElementById('court-zoom');
  if (!layer) { document.body.classList.remove('court-zoom-open'); return; }
  const finish = () => { if (layer.parentNode) layer.remove(); document.body.classList.remove('court-zoom-open'); };
  if (instant || reduceMotion()) { finish(); return; }
  const stage = layer.querySelector('.court-zoom-stage');
  const opts = { duration: FOLD_CLOSE_MS, easing: FOLD_EASE, fill: 'forwards' };
  layer.animate([{ opacity: 1 }, { opacity: 0 }], opts);
  if (stage) stage.animate([{ transform: 'translateY(0px)', opacity: 1 }, { transform: 'translateY(28px)', opacity: 0 }], opts);
  setTimeout(finish, FOLD_CLOSE_MS + 20);
}
function bindCourtZoomSwipe(layer) {
  const stage = layer.querySelector('.court-zoom-stage');
  let y0 = 0, dy = 0, on = false;
  const start = (y) => { y0 = y; dy = 0; on = true; };
  const move = (y) => {
    if (!on || !stage) return;
    dy = y - y0;
    if (dy > 0) {
      stage.style.transform = 'translateY(' + dy + 'px)';
      layer.style.opacity = String(Math.max(.4, 1 - dy / 380));
    }
  };
  const end = () => {
    if (!on) return;
    on = false;
    if (dy > 90) { if (stage) stage.style.transform = ''; layer.style.opacity = ''; closeCourtZoom(); }
    else if (stage) {
      stage.animate([{ transform: 'translateY(' + Math.max(0, dy) + 'px)' }, { transform: 'none' }], { duration: 220, easing: FOLD_EASE });
      layer.animate([{ opacity: layer.style.opacity || 1 }, { opacity: 1 }], { duration: 220, easing: FOLD_EASE });
      stage.style.transform = '';
      layer.style.opacity = '';
    }
    dy = 0;
  };
  layer.addEventListener('touchstart', (e) => { if (e.touches[0]) start(e.touches[0].clientY); }, { passive: true });
  layer.addEventListener('touchmove', (e) => { if (e.touches[0]) move(e.touches[0].clientY); }, { passive: true });
  layer.addEventListener('touchend', end, { passive: true });
  layer.addEventListener('touchcancel', end, { passive: true });
}

  const done = () => { if (!previous) { setBackupMeta({ lastExportAt: nowISO(), dismissedAt: '', dismissedFresh: 0 }); refreshBackupRow(); } };

  const sections = (v, test) => dict(v, (items) => Array.isArray(items) && items.every(test));
  const exercise = (e) => record(e) && label(e.id) && label(e.title) &&
    (!('goals' in e) || ids(e.goals)) && (!('diagramShapes' in e) || Array.isArray(e.diagramShapes));
  const strings = (row, keys) => { for (const k of keys) optional(row, k, string); };
  check(record(obj));
  const wrapped = 'data' in obj || 'app' in obj || 'exportedAt' in obj;
  if (wrapped) check(obj.app === 'tennis-coach-v1' && [2, 3].includes(obj.version));
  const data = wrapped ? obj.data : obj;
  check(record(data));
  // Both the first published v2 export and the current format have these collections.
  for (const k of ['students', 'groups', 'plans', 'templates', 'customExercises', 'coaches']) {
    if (k === 'coaches' && !(k in data) && obj.version !== 3) continue;
    const rows = data[k];
    check(Array.isArray(rows) && rows.every((row) => record(row) && label(row.id)));
    check(new Set(rows.map((row) => row.id)).size === rows.length);
  }
  check(data.students.every((s) => label(s.name)));
  check(data.groups.every((g) => label(g.name) && ids(g.studentIds)));
  check((data.coaches || []).every((c) => label(c.name)));
  check(data.customExercises.every(exercise));
  check(dict(data.exerciseOverrides, (e) => record(e) && (!('goals' in e) || ids(e.goals))));
  check(dict(data.diagramOverrides, (shapes) => Array.isArray(shapes) && shapes.every(safeShape)));
  for (const t of data.templates) {
    check(label(t.title));
    optional(t, 'items', (v) => sections(v, label));
    optional(t, 'blocks', (v) => dict(v, Number.isFinite));
  }
  for (const p of data.plans) {
    check(label(p.date) && (p.sections ? sections(p.sections, exercise) : Array.isArray(p.items) && p.items.every(exercise)));
    for (const key of ['studentIds', 'groupIds', 'recordedStudentIds', 'actualStudentIds', 'plannedStudentIds']) optional(p, key, ids);
    optional(p, 'groupMembers', (v) => dict(v, ids));
    optional(p, 'studentNotes', (v) => dict(v, string));
    optional(p, 'names', (v) => dict(v, string));
    optional(p, 'coaches', (v) => Array.isArray(v) && v.every((c) => record(c) && label(c.id) && label(c.name)));
    optional(p, 'summary', (v) => v === null || dict(v, string));
    optional(p, 'status', (v) => ['done', 'planned'].includes(v));
    optional(p, 'attendanceInferred', (v) => typeof v === 'boolean');
    strings(p, ['goal', 'notes', 'date', 'studentId', 'groupId']);
  }
  const drafts = wrapped && obj.version === 3 ? obj.drafts : { plan: null, notes: {}, reports: {} };
  check(record(drafts) && (drafts.plan === null || record(drafts.plan)));
  check(dict(drafts.notes, record) && dict(drafts.reports, record));
  for (const row of [drafts.plan, ...Object.values(drafts.notes), ...Object.values(drafts.reports)]) {
    if (!row) continue;
    strings(row, ['id', 'date', 'goal', 'notes', 'success', 'difficulty', 'next']);
    optional(row, 'who', (v) => record(v) && ['coachIds', 'studentIds', 'groupIds'].every((k) => ids(v[k])));
    optional(row, 'actualStudentIds', ids);
    optional(row, 'studentNotes', (v) => dict(v, string));
    optional(row, 'sections', (v) => sections(v, label));
  }
  if (drafts.plan) check(sections(drafts.plan.sections, label));
  for (const row of Object.values(drafts.notes)) check(string(row.notes));
  for (const row of Object.values(drafts.reports)) check(string(row.success) && string(row.difficulty) && string(row.next));
  return { data: normalizeStore(data), drafts };
}

function importFromObject(obj) {
  const next = decodeBackup(obj);
  const oldPrefix = storagePrefix;
  const prefix = KEY + '_' + uid() + '/';
  const keys = [KEY, DRAFT_KEY, NOTE_KEY, REPORT_KEY, PREVIOUS_BACKUP];
  try {
    if ((localStorage.getItem(ACTIVE_DATA) || '') !== oldPrefix) throw new Error('stale');
    const previous = JSON.stringify(backupObject());
    localStorage.setItem(prefix + KEY, JSON.stringify(next.data));
    if (next.drafts.plan) localStorage.setItem(prefix + DRAFT_KEY, JSON.stringify(next.drafts.plan));
    localStorage.setItem(prefix + NOTE_KEY, JSON.stringify(next.drafts.notes));
    localStorage.setItem(prefix + REPORT_KEY, JSON.stringify(next.drafts.reports));
    localStorage.setItem(prefix + PREVIOUS_BACKUP, previous);
    // A single atomic write publishes all four records together.
    localStorage.setItem(ACTIVE_DATA, prefix);
  } catch (err) {
    try { for (const key of keys) localStorage.removeItem(prefix + key); } catch (cleanupError) {}
    throw new Error('storage');
  }
  storagePrefix = prefix;
  unsavedDrafts.clear();
  store = next.data;
  for (const key of keys) localStorage.removeItem(oldPrefix + key);
  mirrorLegacy(JSON.stringify(store));
  draft = defaultDraft();
  restoreDraft();
  closeModal();
  render();
  if (view === 'exercises') updateExerciseList();
}

function handleImportFile(file) {
  if (!file) return;
  if (!confirm('Заменить текущие данные копией из файла? Предыдущее состояние можно будет выгрузить здесь же.')) {
    el('import-file').value = '';
    return;

  const reader = new FileReader();
  reader.onerror = () => toast('Не удалось прочитать файл');
  reader.onload = () => {
    try {
      const obj = JSON.parse(String(reader.result || ''));
      importFromObject(obj);
      toast('Данные восстановлены из файла');
    } catch (e) {
      toast(e.message === 'storage' ? 'Не удалось сохранить копию в браузере. Текущие данные сохранены.' : 'Файл повреждён или это не копия Tennis Coach');
    }
  };
  reader.readAsText(file);
}

function progressionHTML(items) {
  const stages = items.map(stageOf).filter(Boolean);
  if (!stages.length) return '';
  const has = new Set(stages);
  const first = (k) => stages.indexOf(k);
  const steps = STAGES.map(([k, label]) => `<span class="stage-step ${has.has(k) ? 'on' : ''}">${h(label)}</span>`).join('<span class="stage-arrow">→</span>');
  let note;
  const missing = STAGES.filter(([k]) => !has.has(k)).map(([, l]) => '«' + l + '»');
  const ordered = STAGES.map(([k]) => first(k)).filter((i) => i >= 0).every((v, i, a) => i === 0 || v >= a[i - 1]);
  if (!missing.length && ordered) note = 'Есть переход от отработки к игре со счётом.';
  else if (!missing.length) note = 'Все этапы есть, но порядок другой: обычно сначала корзина, потом живой мяч, в конце игра со счётом.';
  else note = 'Нет этапа ' + missing.join(' и ') + (has.has('game') ? '.' : ' — можно добавить игру со счётом в игровую часть.');
  return `<div class="stage-line" aria-label="Этапы в плане">${steps}</div><p class="stage-note">${h(note)}</p>`;
}

/* Автоподбор упражнений под каркас: укладываемся в минуты блока, в основной части идём от корзины к живому мячу. */
function autoFill(tpl) {
  const kids = Boolean(tpl.kids);
  const all = allExercises();
  const used = new Set();
  const focus = draftFocusText();
  const prefStroke = suggestedStroke(focus);
  const prefGoals = suggestedGoal(focus);
  const adultBall = (e) => !['Разминка', 'Заминка', 'Дети'].includes(e.stroke);
  const fits = {
    warmup: (e) => kids ? e.stroke === 'Дети' && stageOf(e) !== 'game' && (e.goals || []).some((g) => g === 'Работа ног' || g === 'Реакция') : e.stroke === 'Разминка',
    main: (e) => (kids ? e.stroke === 'Дети' : adultBall(e)) && ['basket', 'live'].includes(stageOf(e)),
    points: (e) => (kids ? e.stroke === 'Дети' : adultBall(e)) && stageOf(e) === 'game',
    cooldown: (e) => e.stroke === 'Заминка' && (!kids || stageOf(e) !== 'basket')
  };
  let band = '';
  if (kids) {
    const ids = draftStudentIds();
    const ages = ids.map(getStudent).filter(Boolean).map((st) => parseInt(st.age, 10)).filter(Number.isFinite);
    const a = ages.length ? Math.min(...ages) : 0;
    band = a ? (a <= 7 ? '5–7' : a <= 10 ? '8–10' : '11–12') : '';
  }
  const score = (e) => (band && e.stroke === 'Дети' && String(e.brief || '').startsWith(band) ? 80 : 0) + (prefStroke && e.stroke === prefStroke ? 60 : 0) + prefGoals.filter((g) => (e.goals || []).includes(g)).length * 15 + (e.level === 'Любой' ? 4 : 0) + Math.random() * 25;
  const out = emptySections();
  for (const sec of sectionDefs) {
    const target = tpl.blocks[sec.id] || 0;
    if (!target) continue;
    const pool = all.filter((e) => fits[sec.id](e) && !used.has(e.id)).map((e) => [e, score(e)]).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
    const chosen = [];
    let total = 0;
    const take = (e) => { chosen.push(e); used.add(e.id); total += (+e.minutes || 0); };
    if (sec.id === 'main') {
      const b = pool.find((e) => stageOf(e) === 'basket' && (+e.minutes || 0) <= target);
      if (b) take(b);
      const l = pool.find((e) => stageOf(e) === 'live' && !used.has(e.id) && total + (+e.minutes || 0) <= target + 3);
      if (l) take(l);
    }
    for (const e of pool) {
      if (total >= target - 2) break;
      if (used.has(e.id)) continue;
      if (total + (+e.minutes || 0) <= target + 3) take(e);
    }
    if (!chosen.length && pool.length) take(pool.reduce((m, e) => (+e.minutes || 99) < (+m.minutes || 99) ? e : m, pool[0]));
    const order = { basket: 0, live: 1, game: 2, '': 3 };
    if (sec.id === 'main') chosen.sort((a, b) => order[stageOf(a)] - order[stageOf(b)]);
    out[sec.id] = chosen.map((e) => e.id);
  }
  return out;
}

function copyDraftSections(src) {
  return Object.fromEntries(sectionDefs.map((sec) => [sec.id, [ ...((src && src[sec.id]) || []) ]]));
}
function parseTemplateApplied(saved) {
  if (!saved || typeof saved !== 'object') return null;
  const out = {};
  let any = false;
  for (const sec of sectionDefs) {
    const ids = Array.isArray(saved[sec.id]) ? uniq(saved[sec.id].map(currentExId).filter(Boolean)) : [];
    out[sec.id] = ids;
    if (ids.length) any = true;
  }
  return any ? out : null;
}
function snapshotDraftPlan() {
  return {
    templateId: draft.templateId || '',
    sections: copyDraftSections(draft.sections),
    blockMinutes: draft.blockMinutes ? { ...draft.blockMinutes } : null,
    templateApplied: draft.templateApplied ? copyDraftSections(draft.templateApplied) : null,
    templateAppliedMinutes: draft.templateAppliedMinutes ? { ...draft.templateAppliedMinutes } : null
  };
}
function restoreDraftPlan(snap) {
  if (!snap) return;
  draft.templateId = snap.templateId || '';
  draft.sections = copyDraftSections(snap.sections);
  draft.blockMinutes = snap.blockMinutes ? { ...snap.blockMinutes } : null;
  draft.templateApplied = snap.templateApplied ? copyDraftSections(snap.templateApplied) : null;
  draft.templateAppliedMinutes = snap.templateAppliedMinutes ? { ...snap.templateAppliedMinutes } : null;
  for (const sec of sectionDefs) ui.folds['plan-sec-' + sec.id] = (draft.sections[sec.id] || []).length > 0;
  persistDraft();
  render();
}
function planDiffersFromApplied() {
  const applied = draft.templateApplied;
  if (!applied) return true;
  if (sectionDefs.some((sec) => JSON.stringify(draft.sections[sec.id] || []) !== JSON.stringify(applied[sec.id] || []))) return true;
  const a = draft.blockMinutes || {}, b = draft.templateAppliedMinutes || {};
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
  for (const k of keys) {
    if (Number(a[k] || 0) !== Number(b[k] || 0)) return true;
  }
  return false;
}
function unapplyTemplate() {
  const before = snapshotDraftPlan();
  const applied = draft.templateApplied || (draft.templateId ? copyDraftSections(draft.sections) : null);
  const changed = planDiffersFromApplied();
  let removed = 0;
  if (applied) {
    for (const sec of sectionDefs) {
      const drop = new Set(applied[sec.id] || []);
      const was = draft.sections[sec.id] || [];
      draft.sections[sec.id] = was.filter((x) => !drop.has(x));
      removed += was.length - draft.sections[sec.id].length;
    }
  }
  if (draft.blockMinutes) {
    for (const sec of sectionDefs) {
      if (!(draft.sections[sec.id] || []).length) delete draft.blockMinutes[sec.id];
    }
    if (!sectionDefs.some((sec) => draft.blockMinutes[sec.id] != null)) draft.blockMinutes = null;
  }
  draft.templateId = '';
  draft.templateApplied = null;
  draft.templateAppliedMinutes = null;
  persistDraft();
  render();
  if (removed || changed) {
    toast('Шаблон снят', {
      label: 'Вернуть',
      onClick: () => restoreDraftPlan(before)
    });
  } else {
    toast('Шаблон снят');
  }
}
function applyTemplate(id) {
  if (draft.templateId === id) { unapplyTemplate(); return; }
  const tpl = getTemplate(id);
  if (!tpl) { draft.templateId = ''; draft.templateApplied = null; draft.templateAppliedMinutes = null; draft.blockMinutes = null; render(); return; }
  if (draftIds().length && !confirm('Заменить упражнения в текущем плане упражнениями из шаблона?')) { render(); return; }
  draft.templateId = tpl.id;
  draft.blockMinutes = { ...tpl.blocks };
  if (isUserTemplate(tpl.id)) {
    draft.sections = Object.fromEntries(sectionDefs.map((sec) => [sec.id, uniq((tpl.items[sec.id] || []).map(currentExId).filter(Boolean))]));
  } else {
    draft.sections = autoFill(tpl);
  }
  draft.templateApplied = copyDraftSections(draft.sections);
  draft.templateAppliedMinutes = { ...(draft.blockMinutes || {}) };
  for (const sec of sectionDefs) ui.folds['plan-sec-' + sec.id] = (draft.sections[sec.id] || []).length > 0;
  picker.open = false;
  persistDraft();
  render();
  toast(isUserTemplate(tpl.id) ? 'План собран из шаблона' : 'Упражнения подобраны — их можно менять');
}

function saveTemplateFrom(sectionsIds, minutesOf, kids, defaultTitle) {
  if (!sectionDefs.some((sec) => (sectionsIds[sec.id] || []).length)) { toast('Добавьте хотя бы одно упражнение'); return; }
  const title = (prompt('Название шаблона', defaultTitle || 'Мой шаблон') || '').trim();
  if (!title) return;
  const blocks = {}, items = {};
  for (const sec of sectionDefs) { items[sec.id] = [...(sectionsIds[sec.id] || [])]; blocks[sec.id] = minutesOf(sec.id); }
  const t = normalizeTemplate({ id: 'tpl_' + uid(), title, kids, blocks, items, createdBy: store.coachId, createdAt: nowISO(), updatedAt: nowISO() });
  store.templates = [...(store.templates || []), t];
  persist();
  return t;
}

function saveDraftAsTemplate() {
  const sum = (k) => (draft.sections[k] || []).map(getEx).filter(Boolean).reduce((a, e) => a + (+e.minutes || 0), 0);
  const t = saveTemplateFrom(draft.sections, (k) => (draft.blockMinutes && draft.blockMinutes[k]) || sum(k), draftIsKids(), draft.goal ? draft.goal.slice(0, 60) : '');
  if (!t) return;
  draft.templateId = t.id;
  render();
  toast('Шаблон сохранён');
}

function savePlanAsTemplate(id) {
  const p = getPlan(id);
  if (!p) return;
  const ids = Object.fromEntries(sectionDefs.map((sec) => [sec.id, (p.sections[sec.id] || []).map((i) => currentExId(i.id)).filter(Boolean)]));
  const mins = (k) => (p.blockMinutes && p.blockMinutes[k]) || (p.sections[k] || []).reduce((a, i) => a + (+i.minutes || 0), 0);
  const t = targetOfPlan(p);
  const kidsPlan = t.members.length > 0 && t.members.every((s) => { const n = parseInt(s.age, 10); return Number.isFinite(n) && n <= 12; });
  if (saveTemplateFrom(ids, mins, kidsPlan, p.goal ? p.goal.slice(0, 60) : '')) { renderKeepScroll(); toast('Шаблон сохранён'); }
}

function deleteTemplate(id) {
  if (!isUserTemplate(id) || !confirm('Удалить этот шаблон? Сохранённые планы не изменятся.')) return;
  store.templates = store.templates.filter((t) => t.id !== id);
  if (draft.templateId === id) draft.templateId = '';
  persist();
  render();
  toast('Шаблон удалён');
}

function startPlanForStudent(id) {
  const s = getStudent(id);
  if (!s) return;
  draft = defaultDraft();
  draft.who = { coachIds: [], studentIds: [id], groupIds: [] };
  draft.goal = (s.priority || s.goals || '').trim();
  ui.folds['new-plan'] = true;
  persistDraft();
  navigate('training');
  toast('Выберите шаблон или добавьте упражнения');
}

function refreshOpenScheme() {
  const modal = el('overlay').querySelector('.modal');
  if (!modal) return;
  if (diagramEditor) return;
  if (schemeContext.source === 'plan' && schemeContext.planId) { openPlan(schemeContext.planId); return; }
  const editBtn = modal.querySelector('[data-action="edit-exercise"]');
  if (editBtn && editBtn.dataset.id) { animSkipIntro = editBtn.dataset.id; openExercise(editBtn.dataset.id, schemeContext); return; }
}

document.addEventListener('click', (event) => {
  const btn = event.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action, id = btn.dataset.id;
  if (a === 'close-overlay' && btn.classList.contains('veil') && event.target !== btn) return;
  if (PUSH_ACTIONS.has(a) && btn.closest('#overlay') && overlayTop()) { pushNextModal = true; setTimeout(() => { pushNextModal = false; }, 0); }
  switch (a) {
    case 'navigate': navigate(btn.dataset.view); break;
    case 'close-overlay': diagramEditor = null; discardNoteFormDraft(); closeModal('top'); break;
    case 'info': settings(); break;
    case 'backup-later': backupLater(); break;
    case 'att-add': attToggle(btn); break;
    case 'att-pick': attPick(btn); break;
    case 'toggle-fold': onToggleFold(btn); break;
    case 'detail-ex': schemeHand = 'auto'; schemeContext = { source: 'library' }; openExercise(id, schemeContext); break;
    case 'drill-anim': schemeHand = btn.dataset.hand === 'left' ? 'left' : 'auto'; schemeContext = { source: 'library' }; openExercise(id, schemeContext); break;
    case 'toggle-ex': toggleEx(id, btn.dataset.section || 'main'); break;
    case 'new-exercise': openExerciseForm(); break;
    case 'edit-exercise': openExerciseForm(id); break;
    case 'reset-exercise': resetExercise(id); break;
    case 'delete-exercise': deleteCustomExercise(id); break;
    case 'diagram-edit': openDiagramEditor(id); break;
    case 'diagram-tap': diagramTap(event); break;
    case 'diagram-tool': if (diagramEditor) { diagramEditor.tool = id; diagramEditor.pending = null; renderDiagramEditor(); } break;
    case 'diagram-undo': if (diagramEditor && diagramEditor.history.length) { diagramEditor.shapes = diagramEditor.history.pop(); diagramEditor.pending = null; renderDiagramEditor(); } break;
    case 'diagram-clear-zones': if (diagramEditor && diagramEditor.shapes.some((s) => s.kind === 'zone' || s.kind === 'target')) { editorUndoCheckpoint(); diagramEditor.shapes = diagramEditor.shapes.filter((s) => s.kind !== 'zone' && s.kind !== 'target'); diagramEditor.pending = null; renderDiagramEditor(); } break;
    case 'diagram-clear': if (diagramEditor) { editorUndoCheckpoint(); diagramEditor.shapes = []; diagramEditor.pending = null; renderDiagramEditor(); } break;
    case 'diagram-default': if (diagramEditor) { editorUndoCheckpoint(); const e = getEx(diagramEditor.id); diagramEditor.shapes = seedDiagramShapes(e); diagramEditor.pending = null; renderDiagramEditor(); } break;
    case 'diagram-save': finishDiagramEdit(true); break;
    case 'diagram-cancel': finishDiagramEdit(false); break;
    case 'scheme-hand': schemeHand = id; refreshOpenScheme(); break;
    case 'new-student': openStudentForm(); break;
    case 'student-detail': openStudent(id); break;
    case 'edit-student': openStudentForm(id); break;
    case 'delete-student': personDelete('s', id); break;
    case 'new-group': openGroupForm(); break;
    case 'group-detail': openGroup(id); break;
    case 'edit-group': openGroupForm(id); break;
    case 'delete-group': personDelete('g', id); break;
    case 'toggle-plan-picker': {
      const sec = btn.dataset.section || 'main';
      setPlanPicker(sec, !(picker.open && picker.section === sec));
      break;
    }
    case 'picker-show-more': {
      picker.more = true;
      const fold = document.querySelector('.fold[data-fold="picker-' + picker.section + '"]');
      const inner = fold && fold.querySelector(':scope > .fold-panel > .fold-inner');
      if (inner) inner.innerHTML = renderPlanPicker();
      else render();
      el('plan-ex-search') && el('plan-ex-search').focus();
      break;
    }
    case 'picker-show-less': {
      picker.more = false; picker.query = ''; picker.stroke = 'Автоподбор';
      const fold = document.querySelector('.fold[data-fold="picker-' + picker.section + '"]');
      const inner = fold && fold.querySelector(':scope > .fold-panel > .fold-inner');
      if (inner) inner.innerHTML = renderPlanPicker();
      else render();
      break;
    }
    case 'picker-toggle-ex': {
      pickerToggleEx(id, btn.dataset.section || picker.section || 'main');
      break;
    }
    case 'picker-preview': {
      const next = picker.previewId === id ? null : id;
      const prevId = picker.previewId;
      picker.previewId = next;
      const body = btn.closest('.plan-suggestion') || btn;
      document.querySelectorAll('[data-action="picker-preview"]').forEach((b) => b.setAttribute('aria-expanded', b.dataset.id === next ? 'true' : 'false'));
      if (prevId && prevId !== id) {
        const oldFold = document.querySelector('.fold[data-fold="picker-preview-' + prevId + '"]');
        if (oldFold) animateFold(oldFold, false);
      }
      const fold = document.querySelector('.fold[data-fold="picker-preview-' + id + '"]');
      if (fold) animateFold(fold, next === id);
      else renderKeepScroll();
      break;
    }
    case 'apply-template': {
      if (id) applyTemplate(id);
      break;
    }
    case 'scroll-report': {
      const form = document.getElementById('finish-plan-form');
      if (form) form.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
      const ta = form && form.querySelector('textarea[name="success"]');
      if (ta) setTimeout(() => { try { ta.focus(); } catch (err) {} }, reduceMotion() ? 0 : 280);
      break;
    }
    case 'toast-undo': {
      runToastUndo();
      break;
    }
    case 'picker-done': {
      if (picker.open) setPlanPicker(picker.section, false);
      break;
    }
    case 'save-plan': savePlan(); break;
    case 'save-template': saveDraftAsTemplate(); break;
    case 'plan-to-template': savePlanAsTemplate(id); break;
    case 'delete-template': deleteTemplate(id); break;
    case 'student-plan': startPlanForStudent(id); break;
    case 'report-reminder': openReportReminder(id); break;
    case 'note-ex-add': openNoteExPicker(); break;
    case 'note-ex-toggle': noteExToggle(btn); break;
    case 'note-ex-done': closeModal('top'); setTimeout(noteExReveal, 380); break;
    case 'note-ex-remove': noteExRemove(+btn.dataset.i); break;
    case 'lib-sections': openLibSections(); break;
    case 'lib-move': libMove(btn.dataset.key, +btn.dataset.dir); break;
    case 'lib-new': libNew(); break;
    case 'lib-rename': libRename(btn.dataset.key); break;
    case 'lib-delete': libDeleteAsk(btn.dataset.key); break;
    case 'lib-del-to': libDeleteTo(libDel, btn.dataset.to || ''); break;
    case 'lib-del-cancel': libDel = ''; libChanged(''); break;
    case 'hide-report-reminder': hideReportReminder(id); break;
    case 'new-note': openNoteForm(); break;
    case 'student-note': openNoteForm({ studentId: id }); break;
    case 'group-note': openNoteForm({ groupId: id }); break;
    case 'edit-note': openNoteForm({ id }); break;
    case 'swipe-repeat': { const r = btn.closest('.swipe-row'); if (r) swipeClose(r, false); copyPlan(id); break; }
    case 'swipe-delete': swipeDelete(id); break;
    case 'person-edit': { const r = btn.closest('.swipe-row'); if (r) swipeClose(r, false); if (btn.dataset.kind === 'g') openGroupForm(id); else openStudentForm(id); break; }
    case 'person-delete': personDelete(btn.dataset.kind, id); break;
    case 'who-toggle': whoToggle(btn.dataset.scope || 'plan', btn.dataset.kind || 's', id); break;
    case 'who-add-coach': whoAddCoach(btn.dataset.scope || 'plan'); break;
    case 'remove-coach': removeCoach(id); break;
    case 'edit-attendance': openAttendance(id); break;
    case 'edit-who': openWhoEditor(id); break;
    case 'who-edit-save': saveWhoEditor(id); break;
    case 'clear-plan':
      if (confirm('Очистить текущий план?')) {
        draft = defaultDraft();
        clearDraftStorage();
        render();
        toast('План очищен');
      }
      break;
    case 'view-plan': schemeHand = 'auto'; openPlan(id); break;
    case 'copy-plan': copyPlan(id); break;
    case 'nv-toggle': { const f = btn.closest('.nv-fold'); if (f) { const on = !f.classList.contains('is-open'); f.classList.toggle('is-open', on); btn.setAttribute('aria-expanded', on ? 'true' : 'false'); haptic(); } break; }
    case 'cal-prev': calGo(-1); break;
    case 'cal-next': calGo(1); break;
    case 'cal-today': { const now = dateISO().slice(0, 7); if (calMonth === now) { calSelectDay(dateISO()); break; } calGo(now > calMonth ? 1 : -1, null, now); break; }
    case 'cal-day': if (Date.now() - calSwipeAt < 400) break; haptic(); calSelectDay(btn.dataset.d); break;
    case 'anim-tap': break; // нажатие на маленькую анимацию — повтор, карточку не открываем
    case 'zoom-court': openCourtZoom(btn); break;
    case 'close-court-zoom':
      if (event.target.closest('.court-zoom-stage') && !event.target.closest('.court-zoom-close')) break;
      closeCourtZoom();
      break;
    case 'delete-plan':
      if (confirm('Удалить запись о тренировке?')) {
        store.plans = store.plans.filter((p) => p.id !== id);
        persist();
        clearReportDraft(id);
        clearNoteDraft(id);
        navigate('training');
        toast('Тренировка удалена');
      }
      break;
    case 'export-data': exportData(); break;
    case 'export-previous': exportData(true); break;
    case 'import-data': requestImport(); break;
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.classList && t.classList.contains('att-search')) { const box = t.closest('.att'); if (box) attResults(box); }
  if (t.id === 'sess-search') { sessQuery = t.value; updateSessList(); }
  if (t.id === 'note-ex-q') { noteExQ = t.value; const box = el('note-ex-list'); if (box) box.innerHTML = noteExListHTML(); }
  if (t.classList && t.classList.contains('ios-native')) iosRowSync(t);
  if (t.id === 'search') { q = t.value; updateExerciseList(); }
  if (t.id === 'plan-goal') { draft.goal = t.value; persistDraft(); refreshPicker(); }
  if (t.tagName === 'TEXTAREA' && t.classList.contains('textarea-auto')) { autosizeArea(t); kbKeepFieldVisible(); }
  if (t.id === 'plan-ex-search') { picker.query = t.value; refreshPicker(); }
  if (t.id === 'plan-notes') { draft.notes = t.value; persistDraft(); }
  if (t.closest && t.closest('#finish-plan-form') && (t.name === 'success' || t.name === 'difficulty' || t.name === 'next' || String(t.name || '').startsWith('snote:'))) {
    queueReportDraft(t.closest('#finish-plan-form'));
  }
  if (t.closest && t.closest('#note-form')) queueNoteDraft(t.closest('#note-form'));
});

document.addEventListener('change', (e) => {
  if (e.target && e.target.classList && e.target.classList.contains('ios-native')) iosRowSync(e.target);
  if (e.target && e.target.dataset && e.target.dataset.exSection) {
    const lib = libStore(), id = e.target.dataset.exSection;
    if (e.target.value) lib.place[id] = e.target.value; else delete lib.place[id];
    persist();
    if (el('exerciseList')) updateExerciseList();
    toast('Раздел упражнения изменён');
  }
  const t = e.target;
  if (t.id === 'import-file') { handleImportFile(t.files && t.files[0]); return; }
  if (t.name === 'attendance') { const chip = t.closest('.att-chip'); if (chip) { chip.classList.toggle('is-on', t.checked); haptic(); } }
  if (t.name === 'attendance' && t.closest('#note-form')) {
    noteSnotes = snotesFromForm(t.form, noteSnotes);
    el('note-snotes-wrap').innerHTML = snotesHTML('note', uniq([...whoGet('note').studentIds.filter(getStudent), ...checkedAttendance(new FormData(t.form))]), noteSnotes);
    queueNoteDraft(t.form);
  }
  if (t.name === 'attendance' && t.closest('#finish-plan-form')) {
    const form = t.form;
    queueReportDraft(form);
    const row = getReportDraft(form.elements.id.value);
    el('report-snotes').innerHTML = snotesHTML('report-' + form.elements.id.value, checkedAttendance(new FormData(form)), row?.studentNotes);
  }
  if (t.name === 'studentIds' && t.closest && t.closest('#group-form') && t.checked) haptic();
  switch (t.id) {
    case 'stroke': stroke = t.value; updateExerciseList(); break;
    case 'goal': goal = t.value; updateExerciseList(); break;
    case 'format': format = t.value; updateExerciseList(); break;
    case 'level': level = t.value; updateExerciseList(); break;
    case 'stage': stageF = t.value; updateExerciseList(); break;
    case 'plan-template': applyTemplate(t.value); break;
    case 'plan-ex-stroke': picker.stroke = t.value; refreshPicker(); break;
    case 'plan-date': draft.date = t.value; persistDraft(); break;
    case 'sess-filter': sessFilter = t.value || ''; updateSessList(); break;
    case 'cal-filter': calFilter = t.value || ''; updateSessCal(); break;
  }
  if (t.closest && t.closest('#note-form')) queueNoteDraft(t.closest('#note-form'));
});

document.addEventListener('submit', (e) => {
  const f = e.target;
  const id = f.getAttribute('id');
  if (!['exercise-form', 'student-form', 'group-form', 'finish-plan-form', 'attendance-form', 'note-form'].includes(id)) return;
  e.preventDefault();
  if (id === 'exercise-form') saveExerciseFromForm(f);
  if (id === 'student-form') saveStudentFromForm(f);
  if (id === 'group-form') saveGroupFromForm(f);
  if (id === 'attendance-form') saveAttendance(f);
  if (id === 'finish-plan-form') finishPlanFromForm(f);
  if (id === 'note-form') saveNoteFromForm(f);
});


document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('sess-card')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape') {
    if (peekState) { peekClose(); return; }
    if (document.getElementById('court-zoom')) { closeCourtZoom(); return; }
    if (el('overlay').innerHTML) { diagramEditor = null; discardNoteFormDraft(); closeModal('top'); }
    else if (picker.open) { setPlanPicker(picker.section, false); }
  }
});

restoreDraft();
render();
if (view === 'exercises') updateExerciseList();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?v=48').catch(() => {});
}

</script>
