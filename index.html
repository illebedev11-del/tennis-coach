/* Compact in-plan exercise picker: keeps approved Bordeaux / ivory styling. */
/* Compact exercise menu: anchored to +, no layout shift */
.plan-add-btn{min-width:43px;min-height:43px;padding:9px 11px;flex-shrink:0}
.plan-section,.section-card{position:relative;max-width:100%;min-width:0}
.plan-menu-anchor{position:static;display:inline-flex;flex-shrink:0}
.plan-picker{position:absolute;top:calc(100% + 7px);right:0;left:auto;max-width:100%;width:min(350px,100%);max-height:min(370px,54vh);overflow-y:auto;overscroll-behavior:contain;background:#FFFEFB;border:1px solid #DCCCD0;border-radius:13px;padding:5px 10px 8px;z-index:12;box-shadow:0 12px 32px rgba(61,41,45,.14)}
.plan-picker.above{top:auto;bottom:calc(100% + 7px)}
.plan-picker-label{font-size:11px;color:#827B77;font-weight:650;margin:9px 0 3px;padding:0 3px}
.plan-suggestion{width:100%;display:flex;gap:9px;align-items:center;text-align:left;padding:10px 4px;border:0;border-top:1px solid #EFE7E3;background:transparent;color:#713D4A;cursor:pointer;border-radius:5px}
.plan-suggestion:hover,.plan-suggestion:focus-visible{background:#F5EFF0}
.plan-suggestion:first-of-type{border-top:0}
.plan-suggestion-body{flex:1;min-width:0}
.plan-suggestion-title{color:#713D4A;font-weight:650;font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.plan-suggestion-sub{color:#827B77;font-size:11px;margin-top:4px;line-height:1.35}
.plan-suggestion-icon{color:#713D4A;flex-shrink:0}
.plan-picker-footer{width:100%;background:transparent;color:#713D4A;border:0;border-top:1px solid #E9DFDA;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 4px 6px;font-size:12px;font-weight:700;text-align:left;cursor:pointer}
.plan-picker-tools{padding:8px 2px;display:grid;gap:7px}
.plan-picker-tools .input,.plan-picker-tools .select{min-height:44px;font-size:16px}
.plan-picker-empty{font-size:12px;color:#827B77;padding:12px 4px}
@media(max-width:420px){.plan-picker{width:min(330px,100%);max-height:51vh}.plan-suggestion-title{font-size:12px}}

/* Рабочий редактор схем: всегда вторичен по отношению к карточке упражнения. */
.diagram-edit-layout{display:grid;grid-template-columns:minmax(190px,1fr) minmax(220px,1fr);gap:18px;align-items:start}
.diagram-editor-board{padding:14px;background:var(--sage-soft);border-radius:15px;display:grid;place-items:center;min-width:0}
.diagram-editor-board svg{display:block;max-width:100%;width:min(100%,255px);height:auto;touch-action:manipulation;cursor:crosshair;user-select:none;-webkit-user-select:none}
.diagram-editor-board svg .diagram-shape{pointer-events:none}
.diagram-tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:9px 0}
.diagram-tool{border:1px solid #DCCFD0;background:var(--paper);color:var(--wine);min-height:43px;border-radius:10px;font-size:12px;font-weight:650;padding:7px 9px;text-align:center;white-space:normal}
.diagram-tool.active{border-color:var(--wine);background:var(--wine);color:#FFFDF9}
.diagram-help{font-size:12px;line-height:1.55;color:var(--muted);padding:11px 12px;background:var(--paper);border-radius:11px;min-height:54px}
.diagram-editor-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);line-height:1.5}
.diagram-editor-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.diagram-action-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
@media(max-width:650px){.diagram-edit-layout{grid-template-columns:1fr}.diagram-editor-board svg{width:min(100%,235px)}.diagram-editor-actions>.button{flex:1}.diagram-editor-board{padding:7px}}
.drill-metric{background:var(--sage-soft);border-radius:11px;padding:12px 13px;margin-top:16px}.drill-metric .label{color:#587361}.drill-metric p{margin:7px 0 0;color:var(--graphite);line-height:1.5}.drill-more{margin-top:16px;border-top:1px solid var(--line);padding-top:13px}.drill-more summary{color:var(--wine);font-weight:650;cursor:pointer;list-style-position:inside}.drill-more[open] summary{margin-bottom:9px}
.plan-drill-summary{border-top:1px solid var(--line);padding:11px 0;font-size:13px}.plan-drill-summary summary{cursor:pointer;color:var(--wine);line-height:1.5}.plan-drill-summary summary b{font-weight:650}.plan-drill-summary p{margin:8px 0 0;line-height:1.55;color:var(--graphite)}

.badge-demo{display:inline-flex;align-items:center;background:var(--wine-soft);color:var(--wine);font-size:10px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.edited-mark{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--wine);background:var(--wine-soft);padding:2px 7px;border-radius:6px;vertical-align:middle}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.privacy-note{margin:0 0 18px}

.mini-delete:active{
  border:0;
  background:transparent;
  background-color:transparent;
  box-shadow:none;
  color:var(--wine);
}
.fold-meta{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px;white-space:nowrap}
.modal .detail-section{border:0;background:var(--inset);border-radius:var(--radius)}
.modal .detail-section.highlight{border:0;background:var(--wine-soft)}
.modal .detail-section.highlight h4{color:var(--wine-chip)}
.stage-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:14px 0 4px;font-size:12px;color:var(--muted)}
.stage-step{opacity:.55}
.stage-step.on{opacity:1;color:var(--wine-chip);font-weight:650}
.stage-arrow{opacity:.45}
.stage-note{font-size:12px;color:var(--muted);line-height:1.5;margin:2px 0 0}
.stage-mark{color:var(--wine-chip)}
.student-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.timeline{position:relative;margin:0;padding:0}
.timeline .history-entry{position:relative;padding:12px 0 12px 18px;border-top:0}
.timeline .history-entry::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:var(--line)}
.timeline .history-entry::after{content:"";position:absolute;left:0;top:17px;width:9px;height:9px;border-radius:50%;background:var(--wine-soft);box-shadow:0 0 0 1px var(--wine-line)}
.timeline .history-entry.done::after{background:var(--wine)}
.timeline .history-entry:first-child::before{top:17px}
.timeline .history-entry:last-child::before{bottom:auto;height:17px}
.timeline .history-entry:only-child::before{display:none}
.report-line{margin:6px 0 0;font-size:12px;line-height:1.5}
.report-line span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650;margin-bottom:1px}
.tpl-row{display:flex;gap:8px;align-items:flex-end;margin-top:14px}
.tpl-row .field{flex:1}
[hidden]{display:none!important}
.pre-line{white-space:pre-line}.drill-source{margin:18px 0 0;font-size:11px;line-height:1.5;color:var(--muted);opacity:.85}
</style>
</head>

,"harder":"Задать цель 8 из 10 в каждой серии.","diagram":"serve","setup":"Подача с задней линии, одна сторона корта на серию. Целевые зоны не обязательны: задача — попадать в правильный квадрат.","metric":"Результат трёх серий по 10: __/10, __/10, __/10. Отдельно отметить двойные ошибки.","errors":"Нестабильный подброс; попытка добавить скорость при потере вращения.","equipment":"30 мячей или корзина."},{"id":"sv02","title":"Подача по направлениям","stroke":"Подача","goals":["Точность","Контроль"],"format":"С корзиной","level":"Средний","minutes":12,"brief":"Подачи в Т и широко с чередованием задач.","steps":"Перед каждой подачей выбирать целевое направление: в Т или широко. Сделать 20 попыток.","cue":"Повторяемый подброс, одинаковая подготовка к разным целям.","easier":"Отрабатывать одно направление за серию.","harder":"Менять направление по сигналу.","diagram":"serveZones","setup":"Отметить два целевых сектора в правильном квадрате подачи: широко и в Т.","metric":"Попадания отдельно в Т и широко: __/10 и __/10.","errors":"Изменение подброса при смене цели; прицеливание в самую линию.","equipment":"Мячи; 4 маркера для секторов."},{"id":"sv03","title":"Первая подача — сила и контроль","stroke":"Подача","goals":["Сила","Точность"],"format":"Самостоятельно","level":"Продвинутый","minutes":15,"brief":"Баланс скорости и процента попаданий.","steps":"Сделать серии по 10 первых подач, фиксируя процент попаданий и ощущение скорости.","cue":"Сила не должна разрушать биомеханику подачи.","easier":"Работать на комфортной скорости.","harder":"Повысить темп, сохраняя целевой процент попаданий.","diagram":"serveWide","setup":"Подача с задней линии без заданной маленькой зоны; цель — сохранить процент при управляемой скорости.","metric":"Количество первых подач в поле из каждой серии по 10; сравнить результаты между сериями.","errors":"Форсирование плечом; нестабильный подброс.","equipment":"Мячи."},{"id":"rt01","title":"Приём второй подачи","stroke":"Приём","goals":["Точность","Тактика"],"format":"С тренером","level":"Средний","minutes":15,"brief":"Раннее чтение подачи и надёжный глубокий ответ.","steps":"Тренер подаёт вторые подачи; игрок направляет приём в крупную центральную зону.","cue":"Сплит-степ, короткая подготовка, направление первого шага.","easier":"Начать с предсказуемых направлений.","harder":"Чередовать два направления подачи.","diagram":"return","setup":"Тренер подаёт со стандартной позиции; принимающий за задней линией. Отмечена широкая безопасная зона для глубокого приёма.","metric":"Глубокие приёмы в отмеченную область из 10 попыток.","errors":"Поздний сплит-степ; слишком широкий замах.","equipment":"Мячи; маркеры глубины."},{"id":"rt02","title":"Приём с коротким замахом","stroke":"Приём","goals":["Реакция","Контроль"],"format":"С тренером","level":"Продвинутый","minutes":12,"brief":"Стабильный контакт на быстрых подачах.","steps":"Игрок укорачивает замах и направляет мяч глубоко по центру, не пытаясь сразу атаковать.","cue":"Ранняя подготовка, компактный контакт.","easier":"Работать с умеренной скоростью подачи.","harder":"Повышать темп и менять сторону.","diagram":"returnFast","setup":"Подача тренера с постепенным увеличением скорости; маленькая цель не нужна.","metric":"Количество надёжных приёмов в корт из 10 на каждой скорости.","errors":"Полный замах на быстрой подаче; позднее чтение направления.","equipment":"Мячи."},{"id":"vl01","title":"Удары с лёта по зонам","stroke":"Игра с лёта","goals":["Точность","Контроль"],"format":"С корзиной","level":"Начальный","minutes":12,"brief":"Направление мяча без широкого замаха.","steps":"Игрок у сетки чередует правую и левую целевые зоны на противоположной половине.","cue":"Устойчивое положение ракетки, шаг навстречу мячу.","easier":"Работать на небольшом расстоянии от сетки.","harder":"Добавить серию с движением вперёд.","diagram":"volley","setup":"Игрок у сетки, тренер с корзиной на противоположной половине. Две области для направления воллея.","metric":"Попадания в левую и правую области из 10 попыток в каждую.","errors":"Слишком длинный замах; отсутствие шага к мячу.","equipment":"Корзина мячей; маркеры зон."},{"id":"vl02","title":"Первый удар с лёта","stroke":"Игра с лёта","goals":["Реакция","Тактика"],"format":"С тренером","level":"Средний","minutes":12,"brief":"Контроль первого воллея после выхода к сетке.","steps":"Игрок начинает с середины корта, подходит к сетке и направляет первый воллей глубоко.","cue":"Подход со сплит-степом, низкое положение, выбор зоны.","easier":"Давать удобный мяч на первый воллей.","harder":"Добавить пассинг от соперника.","diagram":"approach","setup":"Игрок выходит с середины корта; тренер/партнёр напротив. Без зоны, если не задана точность.","metric":"Первый воллей в корт с сохранением баланса из 10 попыток.","errors":"Подход вплотную к сетке без сплит-степа; остановка на прямых ногах.","equipment":"Мячи."},{"id":"sm01","title":"Смэш после отхода назад","stroke":"Смэш","goals":["Работа ног","Точность"],"format":"С корзиной","level":"Средний","minutes":12,"brief":"Правильная работа ног под свечой.","steps":"Тренер набрасывает свечи с постепенным увеличением глубины. Игрок выходит под мяч и направляет смэш в большую зону.","cue":"Разворот плеч, приставные шаги, безопасная дистанция.","easier":"Сократить глубину свечей.","harder":"Добавить вторую свечу подряд.","diagram":"smash","setup":"Игрок у сетки с возможностью безопасно отойти назад; тренер набрасывает свечи. Задана широкая область направления смэша.","metric":"Смэши с контролем баланса и попаданием в область из 10 попыток.","errors":"Отход назад спиной к сетке; удар в неустойчивом положении.","equipment":"Корзина мячей; 2 маркера."},{"id":"ft01","title":"Первый шаг к широкому мячу","stroke":"Передвижение","goals":["Работа ног","Реакция"],"format":"С корзиной","level":"Любой","minutes":10,"brief":"Быстрая реакция и возврат к центру.","steps":"Тренер направляет мячи в две стороны. Игрок выполняет стартовый шаг, удар и восстановление.","cue":"Сплит-степ перед ударом тренера и контроль центра тяжести.","easier":"Замедлить подачу и сократить дистанцию.","harder":"Добавить третий вариант по короткому мячу.","diagram":"footwork","setup":"Игрок за задней линией, тренер подаёт влево или вправо без предварительного сигнала.","metric":"Удары с своевременным первым шагом и возвратом в позицию из 12 попыток.","errors":"Ожидание на прямых ногах; старт после отскока мяча.","equipment":"Корзина мячей."},{"id":"ft02","title":"Короткий мяч и возврат","stroke":"Передвижение","goals":["Работа ног","Контроль"],"format":"С корзиной","level":"Средний","minutes":12,"brief":"Переход вперёд и контролируемое возвращение.","steps":"После глубокого мяча игрок атакует короткий и занимает правильную позицию для следующего удара.","cue":"Шаги под мяч, контроль торможения.","easier":"Упростить последовательность до двух мячей.","harder":"Добавить решение: остаться у сетки или вернуться.","diagram":"shortBall","setup":"Игрок у задней линии, тренер чередует глубокий и короткий наброс.","metric":"Удачные подходы к короткому мячу и контролируемое последующее действие из 10 розыгрышей.","errors":"Выход к короткому мячу без торможения; неверный выбор остаться или вернуться.","equipment":"Мячи."},{"id":"tx01","title":"Кросс — кросс — линия","stroke":"Тактика","goals":["Тактика","Контроль"],"format":"С партнёром","level":"Средний","minutes":15,"brief":"Выстроить атаку через изменение направления.","steps":"Два стабильных кросса, затем перевод по линии при подходящем мяче. Повторить 8–10 розыгрышей.","cue":"Терпение, качество подготовительных ударов.","easier":"Тренер заранее подаёт удобный мяч для перевода.","harder":"Разрешить перевод только после глубокого удара.","diagram":"line","setup":"Два игрока за задними линиями, без зон: тренируем последовательность и выбор момента.","metric":"Осмысленные переводы по линии из 10 розыгрышей после двух кроссов.","errors":"Перевод по линии при плохом балансе; игнорирование качества второго кросса.","equipment":"Мячи; партнёр."},{"id":"tx02","title":"Игра в глубину по центру","stroke":"Тактика","goals":["Стабильность","Тактика"],"format":"Игровое","level":"Любой","minutes":15,"brief":"Снижать риск и удерживать нейтральный розыгрыш.","steps":"Розыгрыш на счёт: дополнительное очко за серию из 6 глубоких мячей в центральный коридор.","cue":"Выбор безопасного направления и высоты.","easier":"Увеличить ширину коридора.","harder":"Сузить коридор или увеличить длину серии.","diagram":"center","setup":"Отметить безопасный центральный коридор за линией подачи.","metric":"Число серий по 6 глубоких ударов в коридор за 10 минут.","errors":"Прицеливание в линии; излишняя скорость нейтрального мяча.","equipment":"Мячи; маркеры коридора."},{"id":"tx03","title":"Укороченный после глубины","stroke":"Тактика","goals":["Тактика","Точность"],"format":"С партнёром","level":"Продвинутый","minutes":15,"brief":"Создать пространство коротким ударом после глубокого.","steps":"Два глубоких удара с последующим укороченным на подходящем мяче.","cue":"Маскировка намерения и выбор момента.","easier":"Выполнять короткий удар с наброса.","harder":"Играть очко после укороченного.","diagram":"drop","setup":"Два игрока за задней линией; после глубоких мячей один выполняет укороченный. Зону не добавляем, если точное попадание не задано.","metric":"Укороченные, после которых соперник не успевает комфортно атаковать, из 10 попыток.","errors":"Укороченный при невыгодной позиции; заранее читаемая подготовка.","equipment":"Мячи."},{"id":"tx04","title":"Свеча над игроком у сетки","stroke":"Тактика","goals":["Точность","Тактика"],"format":"С тренером","level":"Средний","minutes":12,"brief":"Выбрать правильную траекторию защитной свечи.","steps":"Тренер занимает позицию у сетки. Игрок выполняет свечу в глубину с запасом по высоте.","cue":"Не форсировать из неустойчивого положения.","easier":"Увеличить целевую зону.","harder":"Тренер меняет позицию у сетки.","diagram":"lob","setup":"Тренер у сетки, ученик за задней линией; без фиксированной зоны, если задача — выбрать высоту и глубину свечи.","metric":"Свечи, перелетевшие соперника и приземлившиеся в корте, из 10 попыток.","errors":"Недостаточная высота над игроком у сетки; плоский удар в спешке.","equipment":"Мячи."},{"id":"fh07","title":"20 форхендов кроссом в зону","stroke":"Форхенд","goals":["Стабильность","Точность"],"format":"С партнёром","level":"Средний","minutes":15,"brief":"20 форхендов кроссом в заранее отмеченный квадрат: стабильность плюс точность.","steps":"Начать розыгрыш удобным мячом. Засчитывать только форхенды, попавшие в выделенную область. Цель — серия из 20 засчитанных попаданий без ошибки; после промаха начать новую попытку.","cue":"Играть с запасом от границ квадрата и сетки, держать устойчивый ритм.","easier":"Сначала 10 подряд или увеличить квадрат.","harder":"Уменьшить квадрат или добавить контроль темпа.","diagram":"crossMirror","zoneMode":"on","setup":"Два игрока на диагонали за задними линиями; на противоположной половине выделен один достаточно крупный квадрат.","metric":"Максимальное число подряд засчитанных попаданий в квадрат; рабочая цель — 20.","errors":"Попытка целиться в край зоны; увеличение силы вместо точности.","equipment":"Мячи; партнёр; плоские маркеры зоны."},{"id":"wu01","title":"Динамическая разминка","stroke":"Разминка","goals":["Работа ног","Реакция"],"format":"Самостоятельно","level":"Любой","minutes":8,"diagram":"dynamicWarmup","zoneMode":"off","brief":"Подготовить тело к занятию: плавные перемещения, смена направления и работа рук без гонки за темпом.","setup":"Свободное пространство за задней линией или вдоль боковой. Без корзин и целевых зон. Мячи не обязательны.","steps":"Начать с лёгкого шага по периметру корта 1–2 круга. Затем серии: боковые приставные шаги, выпады с поворотом плеч, имитация удара без мяча, короткие ускорения на 4–6 метров и спокойный возврат. Каждое движение 30–45 секунд, без резкого старта. Закончить лёгким встряхиванием рук и ног.","metric":"Игрок двигается свободно, дыхание ровное, нет скованности в плечах и бёдрах перед первой работой с мячом.","cue":"Держать колени мягкими, смотреть вперёд, не торопить амплитуду в первой минуте.","errors":"Сразу ускоряться как на челноке; начинать с растяжки стоя на прямых ногах; забывать про руку и плечо.","easier":"Уменьшить амплитуду и убрать ускорения, оставить только шаг, приставные и имитацию удара.","harder":"Добавить смену направления по сигналу тренера и лёгкую работу с двумя мячами у корпуса.","equipment":"Без инвентаря; по желанию — два мяча."},{"id":"wu02","title":"Мини-теннис с линии подачи","stroke":"Разминка","goals":["Контроль","Реакция"],"format":"С партнёром","level":"Любой","minutes":10,"diagram":"miniTennis","zoneMode":"on","brief":"Короткий розыгрыш с линии подачи: почувствовать контакт и контроль, не набирая полную силу.","setup":"Оба игрока стоят у своих линий подачи. Игра только в квадраты подачи. Сетку не обходить, целевых конусов не ставить, если игрокам и так ясно поле.","steps":"Ввести мяч мягкой подачей с руки. Играть короткими ударами в пределах квадратов подачи, чередуя форхенд и бэкхенд. Держать серию 8–12 ударов, затем сменить того, кто вводит мяч. Сделать 4–6 серий, постепенно чуть увеличивая длину мяча, но не выходя за линию подачи.","metric":"Несколько спокойных серий подряд без спешки; мяч перелетает сетку с запасом и остаётся в квадратах.","cue":"Короткий замах, встреча мяча впереди, мягкие ноги. Не «поддевать» и не ускорять рано.","errors":"Слишком широкий замах; отход назад к задней линии; удар вниз в сетку из-за жёсткой кисти.","easier":"Разрешить играть во всю переднюю половину корта и замедлить темп.","harder":"Играть только в один квадрат или вводить мяч с отскока ниже.","equipment":"Мячи; партнёр."},{"id":"wu03","title":"Волей в волей у сетки","stroke":"Разминка","goals":["Контроль","Реакция"],"format":"С партнёром","level":"Любой","minutes":8,"diagram":"volleyToVolley","zoneMode":"off","brief":"Короткая серия ударов с лёта у сетки, чтобы включить руки, стопы и чувство дистанции.","setup":"Оба игрока в 2–3 метрах от сетки, чуть шире центральной линии. Без зон. Мяч вводят коротким набросом.","steps":"Начать медленным обменом по центру. Держать мяч в воздухе сериями по 8–10 ударов. Затем чуть смещаться влево и вправо, сохраняя контакт впереди себя. Если мяч падает — спокойно начать новую серию. 4–5 серий достаточно.","metric":"Серии идут без напряжения, игроки успевают к мячу и не отходят далеко от сетки.","cue":"Короткий удар от плеча, кисть стабильна, шаг к мячу небольшой и своевременный.","errors":"Широкий замах как с задней линии; стоять на прямых ногах; пятиться от сетки после каждого удара.","easier":"Разрешить один отскок или играть ближе, почти «ловя» мяч.","harder":"Чередовать направление — чуть левее и правее — или ускорить темп на последней серии.","equipment":"Мячи; партнёр или тренер."},{"id":"wu04","title":"Совместный розыгрыш с задней линии","stroke":"Разминка","goals":["Стабильность","Контроль"],"format":"С партнёром","level":"Любой","minutes":10,"diagram":"center","zoneMode":"off","brief":"Спокойный розыгрыш с задних линий: ввести ритм и длину мяча, не превращая разминку в борьбу.","setup":"Игроки примерно в метре за задними линиями, ближе к центру. Без конусов и узких целей — задача в ритме и контроле.","steps":"Ввести мяч удобной подачей с руки. Играть в середину корта или мягким кроссом, наращивая серию: 8, 12, затем 16 ударов. Темп средний, запас над сеткой обязателен. При ошибке начать отсчёт заново без комментариев о счёте. 5–6 попыток.","metric":"Появляется устойчивая серия в комфортном темпе; мяч регулярно долетает за линию подачи.","cue":"Ранняя подготовка, спокойный ритм ног, не спешить с ускорением третьего-четвёртого мяча.","errors":"Сразу бить сильно; стоять внутри корта слишком близко к задней линии; обрывать серию, чтобы «проверить» удар.","easier":"Играть только в большую центральную зону и начать с серий по 6 ударов.","harder":"После устойчивой серии добавить function normalizePlan(p) {
  if (!p || typeof p !== 'object') return null;
  let sections = emptySections();

    for (const key of Object.keys(sections)) {
      sections[key] = Array.isArray(p.sections[key]) ? p.sections[key] : [];
    }
  } else if (Array.isArray(p.items)) {
    sections.main = p.items;
  }
  const summary = p.summary && typeof p.summary === 'object'
    ? { success: String(p.summary.success || ''), difficulty: String(p.summary.difficulty || ''), next: String(p.summary.next || '') }
    : null;
  return {
    id: p.id || ('p_' + uid()),
    targetType: p.targetType === 'group' || p.groupId ? 'group' : 'student',
    studentId: p.studentId || '',
    groupId: p.groupId || '',
    studentName: p.studentName || '',
    groupName: p.groupName || '',
    date: p.date || dateISO(),
    goal: p.goal || '',
    notes: p.notes || '',
    status: p.status === 'done' ? 'done' : 'planned',
    sections,
    summary,
    templateId: String(p.templateId || ''),
    blockMinutes: p.blockMinutes && typeof p.blockMinutes === 'object' ? p.blockMinutes : null,
    createdBy: String(p.createdBy || ''),
    createdAt: p.createdAt || (p.date ? p.date + 'T12:00:00.000Z' : nowISO()),
    updatedAt: p.updatedAt || p.createdAt || (p.date ? p.date + 'T12:00:00.000Z' : nowISO())
  };
}

function refreshDemoSeed(data) {

      s.name = src.name;

      s.hand = src.hand;
      s.strengths = src.strengths;
      s.weaknesses = src.weaknesses;
      s.priority = src.priority;
    }
    if (s.id === 'demo2' && (s.age === '16' || Number(s.age) < 18)) {
      s.age = seedMap.demo2 ? seedMap.demo2.age : '34';

/* Переход на новую библиотеку: правки старых встроенных упражнений сохраняются как «свои», старые типы переименовываются. */
function migrateLibrary(customExercises, exerciseOverrides, diagramOverrides) {
  const legacyById = Object.fromEntries(LEGACY_SEED.map((e) => [e.id, e]));
  const customIds = new Set(customExercises.map((e) => e.id));
  for (const id of uniq([...Object.keys(exerciseOverrides), ...Object.keys(diagramOverrides)])) {
    if (seedById[id] || !legacyById[id]) continue;
    const ov = exerciseOverrides[id] && typeof exerciseOverrides[id] === 'object' ? exerciseOverrides[id] : null;
    if (!customIds.has(id) && (ov || Array.isArray(diagramOverrides[id]))) {
      customExercises.push({ ...legacyById[id], ...(ov || {}), id });
      customIds.add(id);
    }
    delete exerciseOverrides[id];
  }
  for (const e of customExercises) if (STROKE_MIGRATION[e.stroke]) e.stroke = STROKE_MIGRATION[e.stroke];
  for (const ov of Object.values(exerciseOverrides)) if (ov && STROKE_MIGRATION[ov.stroke]) ov.stroke = STROKE_MIGRATION[ov.stroke];
}

function normalizeTemplate(t) {
  if (!t || typeof t !== 'object' || !String(t.title || '').trim()) return null;
  const blocks = {}, items = {};
  for (const sec of sectionDefs) {
    blocks[sec.id] = Math.max(0, Number(t.blocks && t.blocks[sec.id]) || 0);
    items[sec.id] = Array.isArray(t.items && t.items[sec.id]) ? t.items[sec.id].map(String) : [];
  }
  return { id: t.id || ('tpl_' + uid()), title: String(t.title).trim(), kids: Boolean(t.kids), blocks, items, createdBy: String(t.createdBy || ''), createdAt: t.createdAt || nowISO(), updatedAt: t.updatedAt || t.createdAt || nowISO() };
}

function normalizeStore(raw) {
  const base = defaultStore();
  if (!raw || typeof raw !== 'object') return base;
  const templates = (Array.isArray(raw.templates) ? raw.templates : []).map(normalizeTemplate).filter(Boolean);
  const coachId = typeof raw.coachId === 'string' && raw.coachId ? raw.coachId : base.coachId;
  const students = (Array.isArray(raw.students) ? raw.students : []).map(normalizeStudent).filter(Boolean);
  const groups = (Array.isArray(raw.groups) ? raw.groups : []).map(normalizeGroup).filter(Boolean);
  const customExercises = (Array.isArray(raw.customExercises) ? raw.customExercises : []).filter((e) => e && e.id && e.title);
  const plans = (Array.isArray(raw.plans) ? raw.plans : []).map(normalizePlan).filter(Boolean);
  const exerciseOverrides = (raw.exerciseOverrides && typeof raw.exerciseOverrides === 'object' && !Array.isArray(raw.exerciseOverrides))
    ? raw.exerciseOverrides : {};
  const diagramOverrides = (raw.diagramOverrides && typeof raw.diagramOverrides === 'object' && !Array.isArray(raw.diagramOverrides))
    ? raw.diagramOverrides : {};
  migrateLibrary(customExercises, exerciseOverrides, diagramOverrides);
  return refreshDemoSeed({ version: 2, coachId, customExercises, exerciseOverrides, students, groups, plans, templates, diagramOverrides });
}

let storageAvailable = true;
function readLocal(key) {
  try {
    const data = localStorage.getItem(key);
    if (!data) return null;
    return JSON.parse(data);
  } catch (e) {
    storageAvailable = false;
    return null;
  }
}

function loadStore() {
  const current = readLocal(KEY);
  if (current && typeof current === 'object') return normalizeStore(current);
  const legacy = readLocal(OLD_KEY);
  if (legacy && typeof legacy === 'object') return normalizeStore(legacy);
  return defaultStore();
}

let store = loadStore();
function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(store));
    storageAvailable = true;
  } catch (e) {
    storageAvailable = false;
    toast('Хранилище браузера недоступно: изменения только в текущей вкладке.');
  }
}

  const s = getStudent(p.studentId);
  return { type: 'student', name: s ? displayName(s) : (p.studentName || 'Ученик'), student: s, members: s ? [s] : [] };
}

function handForMembers(members) {
  if (members.length && members.every((s) => s.hand === 'left')) return 'left';
  return 'right';
}

function contextHand() {
  if (schemeHand === 'left' || schemeHand === 'right') return schemeHand;
  if (schemeContext.source === 'plan') return handForMembers(targetOfPlan(getPlan(schemeContext.planId)).members);
  if (schemeContext.source === 'student') {
    const s = getStudent(schemeContext.studentId);
    return s && s.hand === 'left' ? 'left' : 'right';
  }
  return 'right';
}

function getPlan(id) { return store.plans.find((p) => p.id === id) || null; }

function plansForStudent(id) {
  return store.plans.filter((p) => {
    if (p.studentId === id && p.targetType !== 'group') return true;
    if (p.targetType === 'group' || p.groupId) {
      const g = getGroup(p.groupId);
      return g && g.studentIds.includes(id);
    }
    return false;
  }).sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
}

function doneCountForStudent(id) {
  return plansForStudent(id).filter((p) => p.status === 'done').length;
}

function draftIds(section) {
  if (section) return draft.sections[section] || [];

function exerciseNeedsZone(e) {
  return e.zoneMode === 'on' || (e.zoneMode !== 'off' && explicitlyZonedDrills.has(e.id));
}

function templateShapes(key, withZones = true) {
  const d = diagramTemplates[key] || diagramTemplates.cross, r = [];
  for (const type of ['player', 'coach']) if (d[type]) r.push({ kind: type, x: d[type][0], y: d[type][1] });
  for (const kind of ['shot', 'move']) for (const a of d[kind] || []) r.push({ kind, x: a[0], y: a[1], x2: a[2], y2: a[3] });
  if (withZones) for (const a of d.zones || []) r.push({ kind: 'zone', x: a[0], y: a[1], x2: a[0] + a[2], y2: a[1] + a[3] });
  return r;
}

const safeShape = (s) => s && ['player', 'coach', 'shot', 'move', 'zone', 'target'].includes(s.kind)
  && [s.x, s.y, ...(['shot', 'move', 'zone', 'target'].includes(s.kind) ? [s.x2, s.y2] : [])].every(Number.isFinite);

function getCanonicalShapes(e) {
  const o = e && store.diagramOverrides[e.id];
  if (Array.isArray(o)) return o.filter(safeShape).slice(0, 65);
  if (Array.isArray(e && e.diagramShapes)) return e.diagramShapes.filter(safeShape).slice(0, 65);
  return templateShapes(e ? e.diagram : 'cross', e ? exerciseNeedsZone(e) : true);
}

function getDiagramShapes(e, mirror = false) {
  const shapes = getCanonicalShapes(e);
  return mirror ? mirrorShapes(shapes) : shapes;
}

function drawDiagramShapes(shapes, uid) {
  const zones = shapes.filter((s) => s.kind === 'zone').map((s) => `<rect class="diagram-shape" x="${X(Math.min(s.x, s.x2))}" y="${Y(Math.min(s.y, s.y2))}" width="${Math.abs(s.x2 - s.x) * CO.s}" height="${Math.abs(s.y2 - s.y) * CO.s}" rx="3" fill="#F2E7BD" fill-opacity=".76" stroke="#FFF0BC" stroke-width="1.2"/>`).join('')
    + shapes.filter((s) => s.kind === 'target').map((s) => `<circle class="diagram-shape" cx="${X(s.x)}" cy="${Y(s.y)}" r="${Math.min(3, Math.hypot(s.x2 - s.x, s.y2 - s.y)) * CO.s}" fill="#F2E7BD" fill-opacity=".76" stroke="#FFF0BC" stroke-width="1.2"/>`).join('');
  const arrows = shapes.filter((s) => s.kind === 'shot' || s.kind === 'move').map((s) => {
    const isShot = s.kind === 'shot';
    return `<path class="diagram-shape" d="M${X(s.x)} ${Y(s.y)} L${X(s.x2)} ${Y(s.y2)}" fill="none" stroke="${isShot ? '#713D4A' : '#344F43'}" stroke-width="${isShot ? 3.4 : 2.8}" stroke-dasharray="${isShot ? '7 4' : '2 6'}" stroke-linecap="round" marker-end="url(#${isShot ? 'arrow' : 'moveArrow'}-${uid})"/>`;
  }).join('');
  const people = shapes.filter((s) => s.kind === 'player' || s.kind === 'coach').map((s) => `<g class="diagram-shape">${marker(s.x, s.y, s.kind === 'player' ? 'И' : 'Т', s.kind === 'coach')}</g>`).join('');
  return zones + arrows + people;
}

function handSwitchHTML() {
  const current = contextHand();
  const autoHint = (() => {
    if (schemeContext.source === 'plan') {
      const t = targetOfPlan(getPlan(schemeContext.planId));
      if (t.type === 'group') {
        const lefts = t.members.filter((s) => s.hand === 'left').length;
        const rights = t.members.length - lefts;
        if (lefts && rights) return 'В группе есть и правши, и левши — по умолчанию схема для правши.';
        if (lefts && !rights) return 'Вся группа играет левой — схема отражена автоматически.';
        return 'Группа играет правой.';
      }
      if (t.student) return t.student.hand === 'left'
        ? `${displayName(t.student)} играет левой — схема отражена автоматически.`
        : `${displayName(t.student)} играет правой.`;
    }
    if (schemeContext.source === 'student') {
      const s = getStudent(schemeContext.studentId);
      if (s) return s.hand === 'left'
        ? `${displayName(s)} играет левой — схема отражена автоматически.`
        : `${displayName(s)} играет правой.`;
    }
    return 'Исходные схемы нарисованы для правши. Для левши стороны форхенда и бэкхенда меняются местами.';
  })();
  return `<div class="hand-switch">

function diagramTap(event) {

  const at = point.matrixTransform(matrix.inverse());
  const t = diagramEditor.tool;
  const x = Number(clip((at.x - CO.x) / CO.s, t === 'zone' || t === 'target' ? 1.37 : -1.30, t === 'zone' || t === 'target' ? 9.60 : 12.27).toFixed(2));
  const y = Number(clip((at.y - CO.y) / CO.s, t === 'zone' || t === 'target' ? 0 : -1.65, t === 'zone' || t === 'target' ? COURT_L : 25.55).toFixed(2));
  if (t === 'erase') {
    const dist = (s) => {
      if (s.kind === 'zone') return x >= Math.min(s.x, s.x2) - .25 && x <= Math.max(s.x, s.x2) + .25 && y >= Math.min(s.y, s.y2) - .25 && y <= Math.max(s.y, s.y2) + .25 ? 0 : 99;
      if (s.kind === 'target') return Math.hypot(x - s.x, y - s.y) <= Math.min(3, Math.hypot(s.x2 - s.x, s.y2 - s.y)) + .20 ? 0 : 99;
      if (s.kind === 'player' || s.kind === 'coach') return Math.hypot(x - s.x, y - s.y);
      const vx = s.x2 - s.x, vy = s.y2 - s.y, u = clip(((x - s.x) * vx + (y - s.y) * vy) / (vx * vx + vy * vy || 1), 0, 1);
      return Math.hypot(x - (s.x + u * vx), y - (s.y + u * vy));
    };
    let best = -1, score = 1.05;
    diagramEditor.shapes.forEach((s, i) => { const d = dist(s); if (d < score) { best = i; score = d; } });
    if (best >= 0) { editorUndoCheckpoint(); diagramEditor.shapes.splice(best, 1); renderDiagramEditor(); }
    else toast('Коснитесь ближе к элементу');
    return;
  }
  if (diagramEditor.shapes.length >= 65) { toast('Для одной схемы достаточно 65 элементов'); return; }
  if (t === 'player' || t === 'coach') {
    editorUndoCheckpoint();
    diagramEditor.shapes.push({ kind: t, x, y });
    renderDiagramEditor();
    return;
  }
  if (!diagramEditor.pending) { diagramEditor.pending = { x, y }; renderDiagramEditor(); return; }
  const origin = diagramEditor.pending;
  diagramEditor.pending = null;
  if (Math.hypot(x - origin.x, y - origin.y) < .35) { toast('Укажите вторую точку чуть дальше'); renderDiagramEditor(); return; }
  editorUndoCheckpoint();
  diagramEditor.shapes.push({ kind: t, x: origin.x, y: origin.y, x2: x, y2: y });
  renderDiagramEditor();
}

function finishDiagramEdit(save) {
  if (!diagramEditor) return;
  const id = diagramEditor.id;
  if (save) {
    const e = getEx(id);
    const shapes = clone(diagramEditor.shapes);
    if (JSON.stringify(shapes) === JSON.stringify(templateShapes(e.diagram, exerciseNeedsZone(e)))) delete store.diagramOverrides[id];
    else store.diagramOverrides[id] = shapes;
    persist();
  }
  diagramEditor = null;
  openExercise(id);
  if (save) toast('Схема сохранена');
}


let ui = { folds: Object.create(null) };
const FOLD_MS = 220;
function reduceMotion() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function foldOpen(id, fallback) {
  return Object.prototype.hasOwnProperty.call(ui.folds, id) ? !!ui.folds[id] : !!fallback;
}
function foldMarkup(id, title, inner, opts) {
  opts = opts || {};
  const open = opts.open != null ? !!opts.open : foldOpen(id, false);
  const count = opts.count;
  const trailing = opts.trailing || '';
  return `<div class="fold ${open ? 'is-open' : ''}" data-fold="${h(id)}"><div class="fold-row"><button type="button" class="fold-head" data-action="toggle-fold" data-fold="${h(id)}" aria-expanded="${open}"><span class="fold-title">${title}</span>${count != null ? `<span class="fold-count">${h(String(count))}</span>` : ''}<span class="fold-chevron" aria-hidden="true">${icon('chevronDown', 18)}</span></button>${trailing}</div><div class="fold-panel"><div class="fold-inner">${inner}</div></div></div>`;
}
function animateFold(fold, open) {
  const panel = fold.querySelector(':scope > .fold-panel');
  const inner = panel && panel.querySelector(':scope > .fold-inner');
  const head = fold.querySelector(':scope > .fold-row > .fold-head');
  const id = fold.dataset.fold;
  if (!panel || !inner) return;
  if (panel._foldEnd) { panel.removeEventListener('transitionend', panel._foldEnd); panel._foldEnd = null; }
  fold.classList.toggle('is-open', open);
  if (head) head.setAttribute('aria-expanded', open ? 'true' : 'false');
  if (id) ui.folds[id] = open;
  if (reduceMotion()) {
    panel.style.transition = 'none';
    panel.style.height = open ? 'auto' : '0px';
    panel.style.opacity = open ? '1' : '0';
    return;
  }
  if (open) {
    panel.style.overflow = 'hidden';
    panel.style.height = '0px';
    panel.style.opacity = '0';
    const hgt = inner.scrollHeight;
    panel.offsetHeight;
    panel.style.transition = `height ${FOLD_MS}ms ease-out, opacity ${FOLD_MS}ms ease-out`;
    panel.style.height = hgt + 'px';
    panel.style.opacity = '1';
    const end = (e) => {
      if (e && e.propertyName && e.propertyName !== 'height') return;
      panel.removeEventListener('transitionend', end);
      panel._foldEnd = null;
      if (fold.classList.contains('is-open')) { panel.style.height = 'auto'; panel.style.transition = ''; }
    };
    panel._foldEnd = end;
    panel.addEventListener('transitionend', end);
  } else {
    const hgt = panel.scrollHeight;
    panel.style.overflow = 'hidden';
    panel.style.height = hgt + 'px';
    panel.style.opacity = '1';
    panel.offsetHeight;
    panel.style.transition = `height ${FOLD_MS}ms ease-out, opacity ${FOLD_MS}ms ease-out`;
    panel.style.height = '0px';
    panel.style.opacity = '0';
    const end = (e) => {
      if (e && e.propertyName && e.propertyName !== 'height') return;
      panel.removeEventListener('transitionend', end);
      panel._foldEnd = null;

}
function onToggleFold(btn) {

function setPlanPicker(sec, open) {

function suggestedStroke(text) {
  const t = (text || '').toLowerCase();
  if (/дет|реб[её]н|малыш|красн\S* мяч|оранжев|зел[её]н\S* мяч/.test(t)) return 'Дети';
  if (/размин/.test(t)) return 'Разминка';
  if (/замин|растяж|восстанов/.test(t)) return 'Заминка';
  if (/пар(?:н|а|ы)|дабл|double/.test(t)) return 'Парная игра';
  if (/при[её]м|return/.test(t)) return 'Приём подачи';
  if (/подач|serve/.test(t)) return 'Подача';
  if (/подход|выход к сетке|обвод|переход/.test(t)) return 'Переходная игра';
  if (/волле|воллей|с л[её]та|у сетки|см[эе]ш/.test(t)) return 'Игра у сетки';
  if (/защит|контратак|свеч/.test(t)) return 'Защита и контратака';
  if (/форхенд|бэкхенд|бекхенд|forehand|backhand|с отскока|задн(?:яя|ей) лини/.test(t)) return 'Удары с отскока';
  if (/передвижен|ног|footwork/.test(t)) return 'Работа ног';
  if (/тактик|розыгрыш|игров/.test(t)) return 'Тактика и розыгрыши';
  return '';
}

function suggestedGoal(text) {
  const t = (text || '').toLowerCase();
  const patterns = [[/стабил/, 'Стабильность'], [/точн/, 'Точность'], [/контрол/, 'Контроль'], [/глубин/, 'Глубина'], [/сил|мощн/, 'Сила'], [/вращен/, 'Вращение'], [/реакц/, 'Реакция'], [/ног|передвижен/, 'Работа ног'], [/тактик/, 'Тактика']];
  return patterns.filter(([pattern]) => pattern.test(t)).map(([, label]) => label);
}

function draftIsKids() {
  const ids = draft.targetType === 'group' ? ((getGroup(draft.targetId) || {}).studentIds || []) : [draft.targetId];
  const ages = ids.map(getStudent).filter(Boolean).map((st) => parseInt(st.age, 10)).filter(Number.isFinite);
  return ages.length > 0 && ages.every((n) => n <= 12);
}

function rankedPickerExercises() {
  const kids = draftIsKids();
  const preferred = suggestedStroke(draft.goal) || (kids ? 'Дети' : '');
  const relatedGoals = suggestedGoal(draft.goal);
  const term = picker.query.toLowerCase().trim();
  const already = new Set(draft.sections[picker.section] || []);
  return allExercises().filter((e) =>
    (picker.stroke === 'Автоподбор' || picker.stroke === 'Все типы' || picker.stroke === e.stroke)
    && (!term || (e.title + ' ' + e.stroke + ' ' + e.brief + ' ' + (e.goals || []).join(' ')).toLowerCase().includes(term))
    && !already.has(e.id)
  ).sort((a, b) => {
    const score = (e) => (picker.section === 'warmup' && e.stroke === 'Разминка' ? 200 : 0) + (picker.section === 'cooldown' && e.stroke === 'Заминка' ? 200 : 0) + (picker.section === 'points' && stageOf(e) === 'game' ? 150 : 0) + (picker.section === 'main' && stageOf(e) !== 'game' ? 20 : 0) + (!['warmup', 'cooldown'].includes(picker.section) && ['Разминка', 'Заминка'].includes(e.stroke) ? -50 : 0) + (e.stroke === 'Дети' && preferred !== 'Дети' ? -120 : 0) + (preferred && e.stroke === preferred ? 100 : 0) + relatedGoals.filter((g) => (e.goals || []).includes(g)).length * 12;
    return score(b) - score(a) || a.title.localeCompare(b.title, 'ru');
  });
}

  const n = el('plan-picker-results');
  if (n) n.innerHTML = pickerResultHTML();
  const label = el('plan-ex-menu') && el('plan-ex-menu').querySelector('.plan-picker-label');
  if (label) {
    const recommended = suggestedStroke(draft.goal);
    label.textContent = picker.section === 'warmup' ? 'Сначала упражнения для разминки' : picker.section === 'cooldown' ? 'Сначала упражнения для заминки' : recommended ? 'Подходят к цели: ' + recommended.toLowerCase() : 'Предлагаемые упражнения';
  }
}

function currentTargetHint() {
  if (draft.targetType === 'group') {
    const g = getGroup(draft.targetId);
    if (!g) return '';
    const members = g.studentIds.map(getStudent).filter(Boolean);
    const lefts = members.filter((s) => s.hand === 'left');
    const rights = members.filter((s) => s.hand !== 'left');
    if (lefts.length && rights.length) return 'В группе есть правши и левши. На схеме можно переключить вариант для левши.';
    if (lefts.length) return 'Вся группа играет левой: схемы на занятии отразятся автоматически.';
    return '';
  }
  const s = getStudent(draft.targetId);
  if (s && s.hand === 'left') return `${s.name} играет левой: схемы на занятии отразятся автоматически.`;
  return '';
}

function planSectionBlock(sec) {
  const ids = draft.sections[sec.id] || [];
  const items = ids.map(getEx).filter(Boolean);
  const pickerOpen = picker.open && picker.section === sec.id;
  const pickerFold = `<div class="fold fold-nested ${pickerOpen ? 'is-open' : ''}" data-fold="picker-${sec.id}"><div class="fold-panel"><div class="fold-inner">${pickerOpen ? renderPlanPicker() : ''}</div></div></div>`;
  const list = items.length
    ? items.map((e, i) => `<div class="plan-item"><span class="count-dot">${i + 1}</span><div class="plan-text"><b>${h(e.title)}</b><small>${h(e.minutes)} мин · ${h((e.goals || [])[0] || e.stroke)}</small></div><button class="mini-delete" data-action="toggle-ex" data-id="${h(e.id)}" data-section="${sec.id}" title="Убрать из раздела">${icon('close', 18)}</button></div>`).join('')
    : '<p class="empty-inline">Пока пусто</p>';
  const trailing = `<button type="button" class="plan-add-btn" data-action="toggle-plan-picker" data-section="${sec.id}" aria-expanded="${pickerOpen}" aria-label="${pickerOpen ? 'Закрыть выбор упражнений' : 'Добавить упражнение в раздел «' + h(sec.title) + '»'}">${icon(pickerOpen ? 'close' : 'plus', 20)}</button>`;
  const open = foldOpen('plan-sec-' + sec.id, items.length > 0 || pickerOpen);
  const sum = items.reduce((a, e) => a + (+e.minutes || 0), 0);
  const target = draft.blockMinutes && draft.blockMinutes[sec.id];
  const meta = target ? `${sum} из ${target} мин` : sum ? `${sum} мин` : '';
  return foldMarkup('plan-sec-' + sec.id, h(sec.title) + (meta ? `<span class="fold-meta">${meta}</span>` : ''), pickerFold + list, { count: items.length, trailing, open });
}

function targetOptions() {
  const stud = store.students.map((s) => `<option value="s:${h(s.id)}" ${draft.targetType === 'student' && draft.targetId === s.id ? 'selected' : ''}>${h(displayName(s))}</option>`).join('');
  const groups = store.groups.map((g) => `<option value="g:${h(g.id)}" ${draft.targetType === 'group' && draft.targetId === g.id ? 'selected' : ''}>${h(displayName(g))}</option>`).join('');
  if (!stud && !groups) return '<option value="">Сначала добавьте ученика или группу</option>';
  return `${stud ? `<optgroup label="Ученики">${stud}</optgroup>` : ''}${groups ? `<optgroup label="Группы">${groups}</optgroup>` : ''}`;
}

function planMinutes(p) {
  return sectionDefs.reduce((sum, sec) => sum + (p.sections[sec.id] || []).reduce((a, i) => a + (+i.minutes || 0), 0), 0);
}

function renderTraining() {
  const sorted = [...store.plans].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const hint = currentTargetHint();

  const formInner = `<div class="form-grid"><div class="field"><label class="label" for="plan-target">Для кого</label><select class="input" id="plan-target">${targetOptions()}</select></div><div class="field"><label class="label" for="plan-date">Дата</label><input class="input" id="plan-date" type="date" value="${h(draft.date)}"></div><div class="field field-wide"><label class="label" for="plan-goal">Главная задача</label><input class="input" id="plan-goal" placeholder="Например: стабильность бэкхенда" value="${h(draft.goal)}"></div></div>
    ${hint ? `<p class="small-note" style="margin:10px 0 0">${h(hint)}</p>` : ''}
    <div class="tpl-row"><div class="field"><label class="label" for="plan-template">Шаблон</label><select class="input" id="plan-template">${templateOptions()}</select></div>${isUserTemplate(draft.templateId) ? `<button class="button small quiet" data-action="delete-template" data-id="${h(draft.templateId)}" aria-label="Удалить шаблон">${icon('trash', 16)}</button>` : ''}</div>
    <div class="spacer"></div>
    ${sectionDefs.map(planSectionBlock).join('')}
    ${progressionHTML(['main', 'points'].flatMap((k) => (draft.sections[k] || []).map(getEx).filter(Boolean)))}
    <div class="field" style="margin-top:12px"><label class="label" for="plan-notes">Комментарий</label><textarea class="textarea" id="plan-notes" placeholder="Что важно учесть на занятии">${h(draft.notes)}</textarea></div>
    <div class="form-actions"><button class="button" data-action="save-plan">${icon('check', 16)} Сохранить план</button><button class="button secondary" data-action="save-template">Сохранить как шаблон</button><button class="button secondary" data-action="clear-plan">Очистить</button></div>`;
  const savedInner = sorted.length ? sorted.map((p) => {
    const tgt = targetOfPlan(p);

function historyBlock(list) {
  if (!list.length) return '<p class="small-note">Тренировок пока нет.</p>';
  return `<div class="timeline">${list.map((p) => {
    const t = targetOfPlan(p);
    const done = p.status === 'done';
    const sm = p.summary || {};
    const groupNote = t.type === 'group' ? `<p class="caption">В группе «${h(t.name)}»</p>` : '';
    const report = done
      ? [['Получилось', sm.success], ['Не получилось', sm.difficulty], ['Дальше', sm.next]].filter((x) => x[1]).map((x) => `<p class="report-line"><span>${x[0]}</span>${h(x[1])}</p>`).join('') || '<p class="report-line fade">Отчёт без текста</p>'
      : '<p class="report-line fade">Занятие запланировано, отчёта пока нет</p>';
    return `<div class="history-entry ${done ? 'done' : ''}"><div class="split-action"><b>${h(dateRU(p.date))}</b><span class="tag ${done ? '' : 'wine'}">${done ? 'Проведено' : 'План'}</span></div>${groupNote}<p>${h(p.goal || 'Без темы')}</p>${report}<button class="view-nav" data-action="view-plan" data-id="${h(p.id)}" style="margin-top:8px">Открыть занятие</button></div>`;
  }).join('')}</div>`;
}

      <label class="field field-wide"><span class="label">Название группы</span><input class="input" name="name" required maxlength="100" placeholder="Например: Вечерняя группа" value="${h(g && g.name || '')}"></label>

}

function openGroup(id) {
  const g = getGroup(id);
  if (!g) return;
  const members = g.studentIds.map(getStudent).filter(Boolean);
  const history = store.plans.filter((p) => p.groupId === id).sort((a, b) => b.date.localeCompare(a.date));
  openModal(`${modalHead('Группа', g.name)}
    <div class="split-action"><div class="chip-row">${demoBadge(g)}<span class="pill">${members.length} ${plural(members.length, 'ученик', 'ученика', 'учеников')}</span></div><button class="button small secondary" data-action="edit-group" data-id="${h(id)}">${icon('edit', 14)} Изменить</button></div>
    <div class="detail-section"><h4>Участники</h4>${members.length ? members.map((s) => `<p>${h(displayName(s))} · ${handLabel(s.hand)}${s.priority ? ' · ' + h(s.priority) : ''}</p>`).join('') : '<p>Пока никого нет</p>'}</div>
    ${foldMarkup('ghistory-' + id, 'История', history.length ? historyBlock(history) : '<p class="empty-inline">Занятий пока нет.</p>', { count: history.length, open: foldOpen('ghistory-' + id, history.length > 0) })}
    <div class="detail-bottom"><button class="button secondary small" data-action="delete-group" data-id="${h(id)}">Удалить группу</button></div>`);

function planItemDetails(item, n, mirror) {
  const shapes = Array.isArray(item.diagramShapes) ? item.diagramShapes.filter(safeShape) : getCanonicalShapes(item);
  return `<details class="plan-drill-summary"><summary><b>${n}. ${h(item.title)}</b> · ${h(item.minutes)} мин</summary>
    <div class="plan-drill-body"><div class="plan-drill-court">${courtSVG(item.diagram, shapes, false, mirror)}</div>
    <div>${item.brief ? `<p>${h(item.brief)}</p>` : ''}${item.setup ? `<p><b>Подготовка:</b> ${h(item.setup)}</p>` : ''}${item.steps ? `<p class="pre-line"><b>Выполнение:</b>\n${h(item.steps)}</p>` : ''}${item.metric ? `<p><b>Признак качества:</b> ${h(item.metric)}</p>` : ''}</div></div>
  </details>`;
}

function openPlan(id) {
  const p = getPlan(id);
  if (!p) return;
  schemeContext = { source: 'plan', planId: id };
  const t = targetOfPlan(p);
  const mirror = contextHand() === 'left';
  const minutes = planMinutes(p);
  const sectionsHtml = sectionDefs.map((sec) => {
    const items = p.sections[sec.id] || [];
    const inner = items.length ? items.map((item, i) => planItemDetails(item, i + 1, mirror)).join('') : '<p class="empty-inline">Пусто</p>';
    return foldMarkup('plan-view-' + p.id + '-' + sec.id, h(sec.title), inner, { count: items.length, open: foldOpen('plan-view-' + p.id + '-' + sec.id, items.length > 0) });
  }).join('');
  openModal(`${modalHead('Тренировка · ' + dateRU(p.date), t.name)}
    <div class="split-action"><div class="chip-row"><span class="pill">${p.status === 'done' ? 'Завершено' : 'План'}</span>${t.type === 'group' ? '<span class="tag wine">группа</span>' : ''}<span class="small-note">${minutes} мин</span></div></div>
    <div class="detail-section"><h4>Тема занятия</h4><p>${h(p.goal || 'Не указана')}</p></div>
    ${handSwitchHTML()}
    ${sectionsHtml}
    ${progressionHTML(['main', 'points'].flatMap((k) => p.sections[k] || []))}
    ${p.notes ? `<div class="detail-section"><h4>Комментарий</h4><p>${h(p.notes)}</p></div>` : ''}
    ${p.status === 'done'
      ? `<div class="detail-section highlight"><h4>Что получилось</h4><p>${h((p.summary && p.summary.success) || 'Не заполнено')}</p></div><div class="detail-section"><h4>Что не получилось</h4><p>${h((p.summary && p.summary.difficulty) || 'Не заполнено')}</p></div><div class="detail-section"><h4>Что дальше</h4><p>${h((p.summary && p.summary.next) || 'Не заполнено')}</p></div>`
      : `<form id="finish-plan-form" style="margin-top:18px" class="form-grid"><input type="hidden" name="id" value="${h(id)}"><div class="field field-wide"><span class="label">Отчёт после занятия</span><span class="small-note">Только текст, без оценок.</span></div>
          <label class="field field-wide"><span class="label">Что получилось</span><textarea class="textarea" name="success" placeholder="Что удалось хорошо">${h((p.summary && p.summary.success) || '')}</textarea></label>
          <label class="field field-wide"><span class="label">Что не получилось</span><textarea class="textarea" name="difficulty" placeholder="Какие сложности возникли">${h((p.summary && p.summary.difficulty) || '')}</textarea></label>
          <label class="field field-wide"><span class="label">Что дальше</span><textarea class="textarea" name="next" placeholder="Что продолжить или изменить">${h((p.summary && p.summary.next) || '')}</textarea></label>
          <div class="field-wide form-actions"><button class="button" type="submit">${icon('check', 16)} Сохранить отчёт</button></div></form>`}
    <div class="detail-bottom"><button class="button secondary small" data-action="copy-plan" data-id="${h(id)}">Повторить план</button><button class="button secondary small" data-action="plan-to-template" data-id="${h(id)}">Сохранить как шаблон</button><button class="button secondary small" data-action="delete-plan" data-id="${h(id)}">Удалить тренировку</button></div>`);
}

function settings() {
  openModal(`${modalHead('Данные и доступ', 'Резервная копия')}
    <p class="detail-copy">Веб-версия 1 без сервера. Правки, ученики, группы, планы, отчёты и шаблоны хранятся <b>только в этом браузере</b>.</p>
    ${storageAvailable ? '' : '<p class="small-note">Откройте в Safari, чтобы данные сохранялись.</p>'}
    <div class="notice" style="margin-top:13px">Общего доступа для нескольких тренеров нет. Перед сменой телефона или очисткой браузера выгрузите копию.</div>
    <div class="detail-bottom">
      <button class="button secondary" data-action="export-data">${icon('download', 16)} Выгрузить копию</button>
      <button class="button secondary" data-action="import-data">${icon('upload', 16)} Восстановить из файла</button>
    </div>
    <div style="margin-top:15px"><span class="small-note">Восстановление полностью заменит текущие данные в этом браузере. Встроенную библиотеку упражнений это не удалит, но ваши правки и схемы будут взяты из файла.</span></div>`);
}


function navigate(next) {
  view = next;
  picker.open = false;
  closeModal();
  render();
  if (view === 'exercises') updateExerciseList();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function toggleEx(id, section) {
  const locations = sectionDefs.filter((s) => (draft.sections[s.id] || []).includes(id)).map((s) => s.id);
  if (locations.length) {
    const targets = section && locations.includes(section) ? [section] : locations;
    for (const sec of targets) draft.sections[sec] = (draft.sections[sec] || []).filter((x) => x !== id);
    toast('Упражнение убрано из плана');
  } else {
    const sec = section || 'main';
    if (!draft.sections[sec]) draft.sections[sec] = [];
    draft.sections[sec] = uniq([...draft.sections[sec], id]);
    const title = sectionDefs.find((s) => s.id === sec);
    toast('Добавлено в раздел «' + (title ? title.title : sec) + '»');
  }
  if (el('overlay').innerHTML) closeModal();
  render();
  if (view === 'exercises') updateExerciseList();
}

function snapshotExercise(e) {
  return {
    id: e.id,
    title: e.title,
    minutes: e.minutes,
    brief: e.brief,
    steps: e.steps,
    setup: e.setup || '',
    metric: e.metric || '',
    cue: e.cue || '',
    errors: e.errors || '',
    easier: e.easier || '',
    harder: e.harder || '',
    equipment: e.equipment || '',
    players: e.players || '',
    source: e.source || '',
    diagram: e.diagram,
    diagramShapes: clone(getCanonicalShapes(e)),
    goals: [...(e.goals || [])],
    stroke: e.stroke || '',
    format: e.format || '',
    stage: stageOf(e)
  };
}

function savePlan() {
  const isGroup = draft.targetType === 'group';
  const target = isGroup ? getGroup(draft.targetId) : getStudent(draft.targetId);
  if (!target) { toast(isGroup ? 'Сначала выберите группу' : 'Сначала добавьте ученика или группу'); return; }
  const hasItems = sectionDefs.some((s) => (draft.sections[s.id] || []).some((id) => getEx(id)));
  if (!hasItems) { toast('Добавьте хотя бы одно упражнение'); return; }
  const sections = emptySections();
  for (const s of sectionDefs) {
    sections[s.id] = (draft.sections[s.id] || []).map(getEx).filter(Boolean).map(snapshotExercise);
  }
  store.plans.push({
    id: 'p_' + uid(),
    targetType: isGroup ? 'group' : 'student',
    studentId: isGroup ? '' : target.id,
    groupId: isGroup ? target.id : '',
    studentName: isGroup ? '' : target.name,
    groupName: isGroup ? target.name : '',
    date: draft.date || dateISO(),
    goal: draft.goal.trim(),
    notes: draft.notes.trim(),
    status: 'planned',
    sections,
    summary: null,
    templateId: draft.templateId || '',
    blockMinutes: draft.blockMinutes ? { ...draft.blockMinutes } : null,
    createdBy: store.coachId,
    createdAt: nowISO(),
    updatedAt: nowISO()
  });
  persist();
  const keepId = target.id;
  draft = defaultDraft();
  draft.targetType = isGroup ? 'group' : 'student';
  draft.targetId = keepId;
  ui.folds['new-plan'] = false;
  ui.folds['saved-plans'] = true;
  render();
  toast('План сохранён');
}

function currentExId(id) {
  if (getEx(id)) return id;
  const mapped = LEGACY_TO_NEW[id];
  return mapped && getEx(mapped) ? mapped : '';
}

function copyPlan(id) {
  const p = getPlan(id);
  if (!p) return;
  const isGroup = p.targetType === 'group' || Boolean(p.groupId);
  const targetStillThere = isGroup ? getGroup(p.groupId) : getStudent(p.studentId);
  draft = {
    targetType: isGroup ? 'group' : 'student',
    targetId: targetStillThere ? (isGroup ? p.groupId : p.studentId) : (store.students[0] && store.students[0].id) || (store.groups[0] && store.groups[0].id) || '',
    date: dateISO(),
    goal: p.goal || '',
    notes: p.notes || '',
    templateId: '',
    blockMinutes: p.blockMinutes ? { ...p.blockMinutes } : null,
    sections: Object.fromEntries(sectionDefs.map((sec) => [sec.id, uniq(((p.sections && p.sections[sec.id]) || []).map((i) => currentExId(i.id)).filter(Boolean))]))
  };
  ui.folds['new-plan'] = true;
  navigate('training');
  toast('План скопирован. Можно сохранить как новое занятие.');
}

function backupObject() {
  return { exportedAt: new Date().toISOString(), app: 'tennis-coach-v1', version: 2, data: store };
}

async function exportData() {
  const json = JSON.stringify(backupObject(), null, 2);
  const file = new File([json], 'tennis-coach-kopiya.json', { type: 'application/json' });
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Tennis Coach — копия' }); toast('Копия подготовлена'); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tennis-coach-kopiya.json';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Резервная копия подготовлена');
}

function looksLikeBackup(obj) {
  if (!obj || typeof obj !== 'object') return false;
  const data = obj.data && typeof obj.data === 'object' ? obj.data : obj;
  return Array.isArray(data.students) || Array.isArray(data.plans) || Array.isArray(data.customExercises) || Array.isArray(data.groups) || Array.isArray(data.templates);
}

function importFromObject(obj) {
  const data = obj.data && typeof obj.data === 'object' && (obj.app || obj.version || obj.exportedAt) ? obj.data : obj;
  if (!looksLikeBackup(obj)) throw new Error('format');
  store = normalizeStore(data);
  persist();
  draft = defaultDraft();
  if (store.students[0]) { draft.targetType = 'student'; draft.targetId = store.students[0].id; }
  else if (store.groups[0]) { draft.targetType = 'group'; draft.targetId = store.groups[0].id; }
  else draft.targetId = '';
  navigate(view || 'training');
}

function requestImport() {
  const input = el('import-file');
  if (!input) return;
  input.value = '';
  input.click();
}

function handleImportFile(file) {
  if (!file) return;
  if (!confirm('Заменить текущие данные копией из файла? Это нельзя отменить, если у вас нет другой копии.')) {
    el('import-file').value = '';
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => toast('Не удалось прочитать файл');
  reader.onload = () => {
    try {
      const obj = JSON.parse(String(reader.result || ''));
      if (!looksLikeBackup(obj)) { toast('Это не похоже на копию Tennis Coach'); return; }
      importFromObject(obj);
      toast('Данные восстановлены из файла');
    } catch (e) {
      toast('Файл повреждён или это не копия Tennis Coach');
    }
  };
  reader.readAsText(file);
}

function resetExercise(id) {
  if (!isBuiltin(id)) return;
  if (!confirm('Вернуть исходный текст этого упражнения? Ваши правки описания будут удалены. Настроенную схему тоже вернём к исходной.')) return;
  delete store.exerciseOverrides[id];
  delete store.diagramOverrides[id];
  persist();
  if (view === 'exercises') { render(); updateExerciseList(); }
  openExercise(id, schemeContext);
  toast('Вернули исходный текст и схему');
}

function deleteCustomExercise(id) {
  if (isBuiltin(id)) return;
  if (!confirm('Удалить это упражнение из библиотеки? В уже сохранённых планах оно останется.')) return;
  store.customExercises = store.customExercises.filter((e) => e.id !== id);
  delete store.diagramOverrides[id];
  for (const s of sectionDefs) draft.sections[s.id] = (draft.sections[s.id] || []).filter((x) => x !== id);
  persist();
  navigate('exercises');
  toast('Упражнение удалено');
}

function saveExerciseFromForm(form) {
  const d = new FormData(form);
  const existingId = String(d.get('id') || '');
  const chosenGoals = d.getAll('goals').map(String).filter(Boolean);
  const item = {
    id: existingId || ('user_' + uid()),
    title: String(d.get('title') || '').trim(),
    stroke: String(d.get('stroke') || 'Удары с отскока'),
    goals: chosenGoals.length ? uniq(chosenGoals) : ['Стабильность'],
    format: String(d.get('format') || 'С тренером'),
    stage: ['basket', 'live', 'game'].includes(String(d.get('stage'))) ? String(d.get('stage')) : '',
    level: String(d.get('level') || 'Любой'),
    minutes: Math.min(240, Math.max(1, Number(d.get('minutes')) || 15)),
    brief: String(d.get('brief') || '').trim(),
    setup: String(d.get('setup') || '').trim(),
    steps: String(d.get('steps') || '').trim(),
    cue: String(d.get('cue') || '').trim(),
    errors: String(d.get('errors') || '').trim(),
    easier: String(d.get('easier') || '').trim(),
    harder: String(d.get('harder') || '').trim(),
    equipment: String(d.get('equipment') || '').trim(),
    metric: String(d.get('metric') || '').trim(),
    players: String(d.get('players') || '').trim(),
    source: String(d.get('source') || '').trim(),
    diagram: String(d.get('diagram') || 'crossMirror'),
    zoneMode: String(d.get('zoneMode') || 'auto')
  };
  if (!item.title || !item.brief) { toast('Добавьте название и краткое описание'); return; }
  if (isBuiltin(item.id)) {
    const base = seedById[item.id];
    const ov = {};
    for (const key of [...EXERCISE_TEXT_FIELDS, 'stroke', 'format', 'stage', 'level', 'minutes', 'diagram', 'zoneMode']) {
      const baseVal = key === 'zoneMode' ? (base.zoneMode || 'auto') : base[key];
      if (JSON.stringify(item[key] ?? '') !== JSON.stringify(baseVal ?? '')) ov[key] = item[key];
    }
    if (JSON.stringify(item.goals) !== JSON.stringify(base.goals)) ov.goals = item.goals;
    if (Object.keys(ov).length) store.exerciseOverrides[item.id] = ov;
    else delete store.exerciseOverrides[item.id];
  } else {
    store.customExercises = store.customExercises.filter((x) => x.id !== item.id);
    store.customExercises.push(item);
  }
  persist();
  navigate('exercises');
  openExercise(item.id, { source: 'library' });
  toast('Упражнение сохранено');
}

function saveStudentFromForm(form) {
  const d = new FormData(form);
  const existing = getStudent(String(d.get('id') || ''));
  const student = {
    id: String(d.get('id') || '') || ('s_' + uid()),
    name: String(d.get('name') || '').trim(),
    age: String(d.get('age') || ''),
    level: String(d.get('level') || 'Средний'),

    strengths: String(d.get('strengths') || '').trim(),
    weaknesses: String(d.get('weaknesses') || '').trim(),
    priority: String(d.get('priority') || '').trim(),

    createdBy: existing ? existing.createdBy : store.coachId,

  openStudent(student.id);
