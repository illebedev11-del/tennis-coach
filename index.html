/* Compact in-plan exercise picker: keeps approved Bordeaux / ivory styling. */
/* Compact exercise menu: anchored to +, no layout shift */
.plan-add-btn{min-width:43px;min-height:43px;padding:9px 11px;flex-shrink:0}
.plan-section,.section-card{position:relative;max-width:100%;min-width:0}
.plan-menu-anchor{position:static;display:inline-flex;flex-shrink:0}
.plan-picker{position:absolute;top:calc(100% + 7px);right:0;left:auto;max-width:100%;width:min(350px,100%);max-height:min(370px,54vh);overflow-y:auto;overscroll-behavior:contain;background:#FFFEFB;border:1px solid #DCCCD0;border-radius:13px;padding:5px 10px 8px;z-index:12;box-shadow:0 12px 32px rgba(61,41,45,.14)}
.plan-picker.above{top:auto;bottom:calc(100% + 7px)}
.plan-picker-label{font-size:11px;color:#827B77;font-weight:650;margin:9px 0 3px;padding:0 3px}
.plan-suggestion{width:100%;display:flex;gap:9px;align-items:center;text-align:left;padding:10px 4px;border:0;border-top:1px solid #EFE7E3;background:transparent;color:#713D4A;cursor:pointer;border-radius:5px}
.plan-suggestion:hover,.plan-suggestion:focus-visible{background:#F5EFF0}
.plan-suggestion:first-of-type{border-top:0}
.plan-suggestion-body{flex:1;min-width:0}
.plan-suggestion-title{color:#713D4A;font-weight:650;font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.plan-suggestion-sub{color:#827B77;font-size:11px;margin-top:4px;line-height:1.35}
.plan-suggestion-icon{color:#713D4A;flex-shrink:0}
.plan-picker-footer{width:100%;background:transparent;color:#713D4A;border:0;border-top:1px solid #E9DFDA;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 4px 6px;font-size:12px;font-weight:700;text-align:left;cursor:pointer}
.plan-picker-tools{padding:8px 2px;display:grid;gap:7px}
.plan-picker-tools .input,.plan-picker-tools .select{min-height:44px;font-size:16px}
.plan-picker-empty{font-size:12px;color:#827B77;padding:12px 4px}
@media(max-width:420px){.plan-picker{width:min(330px,100%);max-height:51vh}.plan-suggestion-title{font-size:12px}}

/* Рабочий редактор схем: всегда вторичен по отношению к карточке упражнения. */
.diagram-edit-layout{display:grid;grid-template-columns:minmax(190px,1fr) minmax(220px,1fr);gap:18px;align-items:start}
.diagram-editor-board{padding:14px;background:var(--sage-soft);border-radius:15px;display:grid;place-items:center;min-width:0}
.diagram-editor-board svg{display:block;max-width:100%;width:min(100%,255px);height:auto;touch-action:manipulation;cursor:crosshair;user-select:none;-webkit-user-select:none}
.diagram-editor-board svg .diagram-shape{pointer-events:none}
.diagram-tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:9px 0}
.diagram-tool{border:1px solid #DCCFD0;background:var(--paper);color:var(--wine);min-height:43px;border-radius:10px;font-size:12px;font-weight:650;padding:7px 9px;text-align:center;white-space:normal}
.diagram-tool.active{border-color:var(--wine);background:var(--wine);color:#FFFDF9}
.diagram-help{font-size:12px;line-height:1.55;color:var(--muted);padding:11px 12px;background:var(--paper);border-radius:11px;min-height:54px}
.diagram-editor-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);line-height:1.5}
.diagram-editor-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.diagram-action-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}

/* v3: list spacing + multi-select picker + inline preview */

/* v4: smoother motion + on-court UX. One shared 240ms easing. */
:root{--motion:280ms;--motion-open:320ms;--motion-close:260ms;--ease:cubic-bezier(.32,.72,0,1)}
html,body{-webkit-tap-highlight-color:transparent}
button,a,input,select,textarea,label,.nav-item,.fold-head,.exercise-card,.student-card,.mini-list-card,.plan-suggestion-body,.plan-suggestion-toggle,.plan-add-btn,.tpl-chip,.mini-delete,.icon-button,.view-nav{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fold{overflow-anchor:none;position:relative}
.fold.is-animating{overflow:hidden!important}
.fold-panel{display:block!important;grid-template-rows:none!important;height:0!important;opacity:1;overflow:hidden;transition:none!important}
.fold.is-open>.fold-panel{height:auto!important;opacity:1}
.fold.is-animating>.fold-panel{height:var(--fold-h,auto)!important;transition:none!important}
.fold-panel>.fold-inner{min-height:0;overflow:hidden;contain:layout paint style}
.fold-chevron{transition:transform var(--motion) var(--ease)}
.fold{transition:border-color var(--motion) var(--ease)}
.main.view-enter{animation:viewIn var(--motion) var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.veil{opacity:0;backdrop-filter:none;-webkit-backdrop-filter:none;transition:opacity var(--motion) var(--ease)}
.veil.is-visible{opacity:1}
.modal{transform:translateY(12px);opacity:.97;transition:transform var(--motion) var(--ease),opacity var(--motion) var(--ease)}
.veil.is-visible .modal{transform:none;opacity:1}
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));transform:none;width:auto;max-width:360px;margin:0 auto;background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.4;z-index:80;text-align:center;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(20,12,12,.18);animation:toastIn var(--motion) var(--ease)}
.toast.has-action{pointer-events:auto}

@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.has-sticky-cta .toast{bottom:calc(156px + env(safe-area-inset-bottom))}
.button,.icon-button,.fold-head,.nav-item,.exercise-card,.student-card,.mini-list-card,.plan-suggestion-toggle,.plan-add-btn,.tpl-chip,.mini-delete,.plan-suggestion-body,.plan-picker-done,.plan-picker-footer{
  transition:transform 160ms var(--ease),background-color 160ms var(--ease),color 160ms var(--ease),filter 160ms var(--ease)}
.button:active,.icon-button:active,.exercise-card:active,.student-card:active,.mini-list-card:active,.tpl-chip:active,.fold-head:active,.nav-item:active,.plan-add-btn:active,.plan-suggestion-toggle:active,.mini-delete:active,.plan-suggestion-body:active,.plan-picker-done:active,.plan-picker-footer:active{transform:scale(.98)}
@media (hover:none){

  .button.positive:hover{filter:none}

  .plan-suggestion-body:hover{color:inherit}
  .fold-row .plan-add-btn:hover{background:transparent}

}
.fold,.section-head{margin-bottom:16px}
.spacer{height:16px}
.form-grid{gap:16px}
.plan-item,.plan-item:first-of-type{padding:12px 0}
button.mini-list-card,.mini-list-card{-webkit-appearance:none;appearance:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:transparent;background-color:transparent;padding:14px 0 16px;align-items:center;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
.fold button.mini-list-card,.fold .mini-list-card{border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;background:transparent}
.fold button.mini-list-card:last-child,.fold .mini-list-card:last-child,.mini-list-card:last-child{border-bottom:0}
button.mini-list-card:focus:not(:focus-visible){outline:none}
.mini-list-go{flex-shrink:0;align-self:center;font-size:13px;font-weight:650;color:var(--wine);min-height:44px;display:inline-flex;align-items:center;padding:0 4px}

.modal .form-actions{position:sticky;bottom:0;background:var(--paper);padding:12px 0 max(10px,env(safe-area-inset-bottom));z-index:2;margin-top:12px}

.empty-inline{padding:12px 2px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .button:active,.icon-button:active,.exercise-card:active,.student-card:active,.mini-list-card:active,.tpl-chip:active,.fold-head:active,.nav-item:active,.plan-add-btn:active,.plan-suggestion-toggle:active,.mini-delete:active,.plan-suggestion-body:active,.plan-picker-done:active,.plan-picker-footer:active{transform:none!important}

/* v5: compositor-first fold motion, iOS easing, no layout-on-every-frame */
#exerciseList,.main,html{overflow-anchor:none}
html,body,.main,.modal{-webkit-overflow-scrolling:touch}
.diagram-pending{background:var(--green-soft)}
.fold:not(.is-open):not(.is-animating)>.fold-panel>.fold-inner{content-visibility:hidden}
.fold-spacer{pointer-events:none;contain:strict;flex-shrink:0}

/* v6: large court, Повторить, report draft */
.court-zoom{position:fixed;inset:0;z-index:85;background:rgba(18,16,16,.94);display:flex;align-items:center;justify-content:center;padding:max(56px,calc(12px + env(safe-area-inset-top))) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));-webkit-tap-highlight-color:transparent}

.court-zoom-stage{width:min(100%,440px);height:min(calc(100dvh - 96px),860px);max-height:100%;background:var(--green-soft);border-radius:var(--radius-lg);padding:10px;display:flex;align-items:center;justify-content:center;box-shadow:none}
.court-zoom-stage svg{width:100%;height:100%;max-height:100%;display:block}
.court-zoom-close{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:44px;height:44px;border:0;border-radius:11px;background:var(--paper);color:var(--ink);display:grid;place-items:center;z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.diagram-thumb[data-action="zoom-court"],.picker-preview-court[data-action="zoom-court"],.plan-drill-court[data-action="zoom-court"],.court-zoom-src{cursor:zoom-in;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.picker-preview-court[data-action="drill-anim"],.plan-drill-court[data-action="drill-anim"]{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.court-zoom-src{border:0;background:transparent;padding:0;display:block;width:min(100%,250px);margin:0 auto}
.court-zoom-src svg{width:min(100%,250px);max-height:475px;display:block}
.repeat-btn{flex-shrink:0;min-height:44px;padding:8px 10px;border:0;background:transparent;color:var(--wine);font:inherit;font-size:13px;font-weight:650;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.mini-list-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.mini-list-main{-webkit-appearance:none;appearance:none;flex:1;min-width:0;min-height:44px;margin:0;padding:0;border:0;background:transparent;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center}
.mini-list-main .mini-list-copy{flex:1;min-width:0}
.history-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.draft-hint{display:block;font-size:12px;color:var(--muted);margin:8px 0 0;min-height:18px;line-height:18px;opacity:0;transition:opacity 280ms var(--ease,ease);text-align:center;pointer-events:none}
.draft-hint.is-on{opacity:1}
@media(prefers-reduced-motion:reduce){.draft-hint{transition:none}}

/* v7: auto-growing text fields, wrapping goals, clear selected template */
textarea.textarea-auto{
  min-height:48px;
  resize:none;
  overflow:hidden;
  overflow-x:hidden;
  overflow-y:hidden;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}
textarea.textarea-auto.textarea-auto-lg{min-height:96px}
.goal-text,.mini-list-copy p,.history-entry p,.student-card p{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
  overflow:visible;
  text-overflow:clip;
  max-width:100%;
  min-width:0;
}
.mini-list-copy,.mini-list-main{min-width:0;max-width:100%}
.tpl-chip.is-on{
  background:var(--wine);
  color:#FFFDF9;
}
@media(prefers-color-scheme:dark){
  .tpl-chip.is-on{background:var(--wine);color:#FFF8F4}
}

/* v12: even chips without leftover checkbox space; freeform session notes */
.goal-grid{align-items:center}
.goal-chip{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:0;
  flex:0 0 auto;
  width:auto;
  max-width:none;
  min-height:36px;
  padding:8px 14px;
  line-height:1.2;
  text-align:center;
  white-space:nowrap;
  overflow-wrap:normal;
  word-break:normal;
}
.goal-chip input{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  clip-path:inset(50%);
  border:0;
  opacity:0;
  pointer-events:none;
  appearance:none;
  -webkit-appearance:none;
}
.goal-chip span{
  display:block;
  white-space:nowrap;
  overflow-wrap:normal;
  word-break:normal;
  text-align:center;
  max-width:none;
}
.tpl-chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  width:auto;
  max-width:100%;
  text-align:center;
  white-space:nowrap;
  overflow-wrap:normal;
  word-break:normal;
  line-height:1.2;
}
.form-grid .goal-chip,
.field label.goal-chip,
.goal-fieldset .goal-chip,
.goal-chip{
  min-width:max-content;
  max-width:none;
  flex:0 0 auto;
}
.student-actions .button{flex:1 1 auto;min-width:auto}
.section-head .train-note-action{flex:0 0 auto;width:auto;max-width:100%}
.section-head .train-note-action .button{flex:0 0 auto;width:auto}

/* v13: several coaches and students in one session */
.who{display:flex;flex-direction:column;gap:8px;min-width:0}
.who .fold{margin:0}
.who-selected{display:flex;flex-wrap:wrap;gap:8px;min-width:0}

@keyframes whoIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}

.snote-list{display:flex;flex-direction:column;gap:12px}

.person-notes p{margin:0}.person-notes p+p{margin-top:8px}.person-notes b{color:var(--wine);font-weight:650}

/* v15: saved sessions by day, separate cards */
.sess-tools{display:flex;justify-content:flex-start;margin:0 0 6px}
.select.sess-filter{width:auto;max-width:100%;min-height:36px;padding:6px 34px 6px 12px;font-size:13px;border-radius:999px;background-position:right 12px center}
.sess-day{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px;font-size:13px;font-weight:650;color:var(--wine)}
.sess-list>.sess-day:first-child,.fold-inner>.sess-day:first-child,.sess-month .fold-inner>.sess-day:first-child{margin-top:4px}

.fold .fold .sess-card{background:var(--paper)}
.sess-card b{display:block;font-size:14px;line-height:1.35;color:var(--wine);font-weight:650}
.sess-text{margin:5px 0 0;font-size:13px;line-height:1.45;color:var(--graphite);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sess-who{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.4}
.sess-card .report-line{margin-top:6px}
.sess-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.sess-tags{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.sess-foot .repeat-btn{min-height:40px;padding:6px 0 6px 10px}

@media(prefers-reduced-motion:reduce){.sess-card{transition:none}.sess-card:active{transform:none}}

/* v16: examples in fields are real hints — they fade out as soon as the field is tapped */
input::placeholder,textarea::placeholder{transition:color .18s ease}
input:focus::placeholder,textarea:focus::placeholder{color:transparent}

/* v17: native-style tab bar — flush to the bottom, solid, background runs under the home indicator */
.nav{left:0;right:0;bottom:0;padding:0;background:var(--ivory);border-top:1px solid var(--line);box-shadow:none;pointer-events:auto;-webkit-backdrop-filter:none;backdrop-filter:none}
.nav-inner{max-width:1000px;margin:0 auto;border:0;border-radius:0;box-shadow:none;background:transparent;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.nav-item{padding:9px 4px 7px;gap:4px}

.att-chip:not(.is-on):not(:has(input:checked)){background:var(--stone);color:var(--ink)}
.att-chip.is-new{animation:whoIn .28s cubic-bezier(.32,.72,0,1)}
.who .att{margin-top:12px}
.who .att .who-group+.who-group{margin-top:10px}
.att-picker{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows 340ms cubic-bezier(.32,.72,0,1),opacity 200ms cubic-bezier(.4,0,.2,1)}
.att-picker.is-open{grid-template-rows:1fr;opacity:1}
.att-picker-inner{min-height:0;overflow:hidden}
.att-picker.is-open .att-picker-inner{padding-top:10px}
.att-picker:not(.is-open) .att-picker-inner{visibility:hidden;transition:visibility 0s 340ms}
.att-results{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.att-result{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:52px;padding:9px 14px;border:0;border-radius:14px;background:var(--surface-card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:transform 160ms cubic-bezier(.32,.72,0,1),opacity 160ms cubic-bezier(.4,0,.2,1)}
.att-result b{font-size:15px;font-weight:650}
.att-result small{font-size:12px;color:var(--muted)}
.att-result:active{transform:scale(.98);opacity:.85}
.att-none{margin:6px 2px 0}
.att-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;margin:4px 0 12px}
.att-fix{border:0;background:none;padding:6px 2px;margin:-6px 0;font:inherit;font-weight:600;color:var(--wine);cursor:pointer}
.att-fix:active{opacity:.55}
.backup-row{margin:0 0 14px}
.backup-last{font-size:13px;color:var(--muted)}
.backup-remind{margin-top:10px}
.backup-remind-inner{padding:14px 16px;border-radius:16px;background:var(--surface-card)}
.backup-remind p{margin:0;display:flex;flex-direction:column;gap:3px;font-size:14px;line-height:1.4}
.backup-remind p span{color:var(--muted);font-size:13px}
.backup-remind-actions{display:flex;gap:8px;margin-top:12px}
.backup-remind-actions .button{flex:1 1 0;min-width:0}
.top [data-action="info"]{position:relative}
.top [data-action="info"].has-dot::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--wine);box-shadow:0 0 0 2px var(--ivory);pointer-events:none}
.att-search{-webkit-appearance:none;appearance:none}
.att-search:focus::placeholder{color:var(--placeholder)}
.att-search::-webkit-search-decoration,.att-search::-webkit-search-cancel-button{-webkit-appearance:none}
.detail-bottom:has(> .button.small){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px}
.detail-bottom:has(> .button.small) > .button.small{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;justify-content:center}
.detail-bottom:has(> .button.small) > .button.small:only-child{grid-column:1/-1;justify-self:start}
@media(prefers-reduced-motion:reduce){.att-picker,.att-picker-inner,.att-result{transition:none}.att-chip.is-new{animation:none}}

/* v46.1: низ формы записи всегда на экране — добавить упражнение, отчёт и сохранение */
.modal.is-note{height:min(94dvh,920px);display:flex;flex-direction:column;overflow:hidden}
.modal.is-note .modal-inner{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#note-form{display:flex;flex-direction:column;flex:1;min-height:0;gap:0}
#note-form .note-scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-bottom:6px}
#note-form .note-foot{flex:0 0 auto;padding-top:10px;background:var(--paper)}
#note-form .note-foot .nex-add{margin-top:0}
#note-form .note-foot .form-actions{position:static;margin-top:10px;padding:0;background:transparent}
#note-form .note-foot .fold{margin:10px 0 0}
#note-form .textarea-auto-lg{min-height:64px}
html.kb-on .modal.is-note{display:block;height:auto;max-height:100%;overflow:auto}
html.kb-on .modal.is-note .modal-inner,html.kb-on #note-form{display:block;height:auto;overflow:visible}
html.kb-on #note-form .note-scroll{overflow:visible;display:grid}
/* v46: тосты по ширине и краям карточек */
.toast{left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));max-width:1012px;border-radius:var(--radius-lg)}
/* v46: окно не прокручивается целиком, когда едет с клавиатурой или за пальцем */
.veil{overflow:hidden;overflow:clip}
/* v46: подсветка найденного — в палитре */
.sess-card mark,.pick-row mark{background:var(--wine-soft);color:var(--wine-dark);border-radius:3px;padding:0;box-shadow:0 0 0 2px var(--wine-soft)}
/* v46: сводка ученика — воздух между частями */
.sum-block h4+p{margin-top:4px}
.sum-block p{margin:2px 0 0}
.sum-block .sum-h{margin-top:16px}
/* v46: напоминания карточками */
.report-reminders{margin:18px 0 14px}
.report-reminders>.swipe-row{border-radius:14px}
.report-reminders .sess-card{background:var(--paper);border-radius:14px;padding:13px 16px 12px;box-shadow:0 1px 0 rgba(60,40,30,.04)}
.report-reminders .sess-card b{display:block;color:var(--wine)}
.report-reminders .sess-card .sess-text{margin:3px 0 0;color:var(--muted)}
/* v46: строки «Дата / Время / Ученик» как в системных приложениях */
.ios-group{background:var(--inset);border-radius:var(--radius-lg);padding:2px 0;overflow:hidden}
.ios-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:0 16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ios-k{font-size:16px;color:var(--ink);font-weight:500}
.ios-v{font-size:16px;color:var(--muted);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ios-v.is-empty{color:#AAA29C}
.ios-row:active{background:rgba(113,61,74,.05)}
.ios-native{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;z-index:1}
.ios-group .fold{background:transparent!important;border:0!important;border-radius:0;margin:0!important;box-shadow:none!important}
.ios-group .fold>.fold-row>.fold-head{min-height:50px;padding:0 12px 0 16px;background:transparent}
.ios-group .fold-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:1;min-width:0;font-weight:400}
.ios-group .fold-chevron{color:var(--muted)}
.ios-group .fold-inner{padding:2px 16px 14px}
.ios-group .who .who-group{margin-top:6px}
/* v46: упражнения записи — одна карточка, свайп влево к следующей */
.nex{margin:0}
.nex-track{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;padding:0;touch-action:pan-x pan-y}
.nex-track::-webkit-scrollbar{display:none}
.nex-card{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;gap:14px;background:var(--inset);border-radius:var(--radius-lg);padding:12px;min-width:0}
.nex-card .diagram-thumb{flex:0 0 64px;width:64px;height:112px;border-radius:8px;overflow:hidden;margin:0}
.nex-card .diagram-thumb svg{width:100%;height:100%}
.nex-body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.nex-title{color:var(--wine);font-size:15px;line-height:1.3;font-weight:650}
.nex-body .detail-sub{font-size:12px;color:var(--muted)}
.nex-body .textarea-compact{margin-top:4px;background:var(--paper)}
.nex-remove{align-self:flex-end;border:0;background:transparent;color:var(--muted);font-size:13px;padding:6px 2px 0;min-height:32px}
.nex-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 0}
.nex-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nex-dots{display:flex;gap:6px}
.nex-dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.nex-dots i.is-on{background:var(--wine);transform:scale(1.15)}
.nex-add{display:flex;align-items:center;gap:8px;width:100%;min-height:50px;margin-top:10px;padding:0 16px;border:0;border-radius:var(--radius-lg);background:var(--inset);color:var(--wine);font-weight:650;font-size:15px;text-align:left}
.nex-add:active{background:var(--wine-soft)}
.textarea.textarea-compact{min-height:44px;padding:11px 13px;line-height:1.4;resize:none}
.report-compact{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.report-compact .field{gap:5px}
/* v46: выбор упражнений */
.pick-list{display:flex;flex-direction:column;gap:6px}
.pick-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:54px;padding:9px 14px;border:0;border-radius:12px;background:var(--inset);text-align:left;color:var(--ink)}
.pick-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.pick-text b{font-size:15px;font-weight:600;color:var(--ink)}
.pick-text small{font-size:12px;color:var(--muted)}
.pick-check{flex:0 0 24px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--paper);color:transparent;transition:background .15s,color .15s}
.pick-row.is-on .pick-check{background:var(--wine);color:#fff}
.pick-row.is-on b{color:var(--wine)}
.pick-search{margin:0 0 14px}
.pick-body .fold{margin:0 0 8px!important}
.pick-done{position:sticky;bottom:0;padding:14px 0 calc(4px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--paper) 30%)}
/* v46: разделы библиотеки */
.lsec-list{display:flex;flex-direction:column;gap:8px}
.lsec-row{display:flex;align-items:center;gap:10px;background:var(--inset);border-radius:12px;padding:10px 10px 10px 14px;min-height:56px}
.lsec-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lsec-text b{font-weight:600;color:var(--ink)}
.lsec-text small{font-size:12px;color:var(--muted)}
.lsec-tools{display:flex;gap:4px;align-items:center}
.lsec-tools .icon-button{width:36px;height:36px;border:0;background:transparent}
.lsec-tools .icon-button:disabled{opacity:.25}
.lsec-up svg{transform:rotate(180deg)}
.lsec-link{border:0;background:transparent;color:var(--wine);font-size:13px;font-weight:600;padding:6px 6px;min-height:36px}
.lsec-acts{display:flex;gap:14px;margin-top:2px}.lsec-acts .lsec-link{padding:4px 0;min-height:32px}
.lsec-q{margin:0 0 14px;line-height:1.5}
.lsec-to{width:100%;justify-content:flex-start}
.result-bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.result-bar .lsec-link{padding-right:0}
.ex-sec-field{margin:0 0 14px;max-width:340px}

/* v47: воздух между переключателем, фильтром, поиском и первой датой */
.sess-seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px;margin:2px 0 14px;background:var(--inset);border-radius:10px}
.sess-seg button{min-height:34px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:550;-webkit-tap-highlight-color:transparent;transition:background .2s,box-shadow .2s}
.sess-seg button.is-on{background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:650}
.sess-tools{margin:0 0 12px}
.sess-search{margin:0}
#sess-list>.sess-day:first-child{margin-top:20px}
#sess-list>.calm-empty:first-child,#sess-list>.empty-calm:first-child{margin-top:16px}
.sess-pane[hidden]{display:none}
/* v47: маленькие анимации вместо схем */
.court-anim.is-mini{width:100%;height:100%;aspect-ratio:auto;border-radius:inherit;margin:0}
.nex-card .diagram-thumb{background:#7A9180}
.exercise-card .diagram-thumb{min-height:150px}
.exercise-card .diagram-thumb .court-anim.is-mini{flex:none;width:70px;height:136px;border-radius:5px}
.pick-thumb{flex:0 0 28px;width:28px;height:54px;border-radius:5px;overflow:hidden;background:#7A9180}
.pick-row{justify-content:flex-start}
.pick-row .pick-text{flex:1;min-width:0}
.picker-preview-court{padding:0;width:96px;aspect-ratio:1697/3297;background:#7A9180}
.plan-drill-court{width:120px;aspect-ratio:1697/3297;border-radius:10px;overflow:hidden;background:#7A9180;justify-self:center}
.anim-hint{margin:10px auto 0;max-width:290px;font-size:12.5px;line-height:1.4;color:var(--muted);text-align:center}
/* v47: просмотр записи — отчёт одной строкой, упражнения каруселью */
.nv-ex{margin:0 0 14px}
.nv-h{margin:0 0 8px 2px;font-size:13px;font-weight:650;color:var(--muted);text-transform:none;letter-spacing:0}
.nv-ex-note{margin:2px 0 0;font-size:13.5px;line-height:1.4;color:var(--ink);white-space:pre-line}
.nv-ex-open{align-self:flex-start;margin-top:auto;border:0;background:transparent;color:var(--wine);font:inherit;font-size:13.5px;font-weight:600;padding:6px 0 0}
.nv-report{display:grid;gap:14px;padding:2px 0 4px}
.nv-rep h4{margin:0 0 4px;font-size:13px;font-weight:650;color:var(--muted)}
.nv-rep p{margin:0;line-height:1.45}
/* v47: календарь проведённых занятий */
.cal{padding:2px 0 4px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;padding:0 2px}
.cal-title{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.cal-title span{color:var(--wine)}
.cal-nav{display:flex;align-items:center;gap:2px}
.cal-arrow{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--wine);display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
.cal-arrow:not(.is-next) svg{transform:rotate(180deg)}
.cal-arrow:active{background:var(--inset)}
.cal-today{border:0;background:transparent;color:var(--wine);font:inherit;font-size:14px;font-weight:600;padding:8px 8px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);margin:0 0 4px;font-size:11px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.02em}
.cal-week .is-we{opacity:.7}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;touch-action:pan-y}
.cal-d{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:48px;padding:5px 0 4px;border:0;background:transparent;color:var(--ink);font:inherit;-webkit-tap-highlight-color:transparent}
.cal-n{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:17px;font-weight:450;font-variant-numeric:tabular-nums;transition:background .18s,color .18s}
.cal-d.is-today .cal-n{color:var(--wine);font-weight:650}
.cal-d.is-sel .cal-n{background:var(--ink);color:var(--paper);font-weight:650}
.cal-d.is-sel.is-today .cal-n{background:var(--wine);color:#fff}
.cal-dots{display:flex;gap:3px;height:6px}
.cal-dots i{width:6px;height:6px;border-radius:50%}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 4px 0;font-size:12px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:8px;height:8px;border-radius:50%}
.cal-day-h{margin:18px 2px 8px;font-size:13px;font-weight:650;color:var(--wine)}
.cal-list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.cal-item{min-width:0;display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 12px 10px 14px;border-radius:var(--radius-lg);background:var(--inset);cursor:pointer;-webkit-tap-highlight-color:transparent}
.cal-item:active{opacity:.75}
.cal-time{flex:0 0 46px;font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.15}
.cal-time.is-none{font-size:11px;font-weight:500;color:var(--muted)}
.cal-bar{flex:0 0 3px;align-self:stretch;border-radius:2px}
.cal-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cal-body b{font-size:15px;font-weight:650;color:var(--ink)}
.cal-body small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-chev{color:var(--muted);display:grid;place-items:center;opacity:.7}
.cal-empty{margin:4px 2px;color:var(--muted);font-size:14px}

/* v48: открытый отчёт не съедает форму: строки внизу прокручиваются сами, кнопки закреплены, листаемая часть всегда не меньше трети окна */
.modal.is-note #note-form .note-foot-rows{max-height:34dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.modal.is-note #note-form .note-foot-rows::-webkit-scrollbar{display:none}
.modal.is-note #note-form .note-scroll{min-height:min(240px,34dvh)}
.modal.is-note .modal-title{margin-bottom:10px}
html.kb-on .modal.is-note #note-form .note-foot-rows{max-height:none;overflow:visible}

/* v48: четыре вкладки; календарь — отдельный экран, месяц едет за пальцем */
.nav-inner{grid-template-columns:repeat(4,1fr)}
.nav-item{min-width:0}
.nav-item span:not(.nav-indicator){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-tools{margin:0 0 10px}
.cal-view{overflow:hidden;touch-action:pan-y;margin:0 -2px}
.cal-track{display:flex;width:300%;transform:translate3d(-33.3333%,0,0);will-change:transform}
.cal-pane{flex:0 0 33.3333%;min-width:0;padding:0 2px}
.cal-more{font-size:9px;line-height:6px;height:6px;font-weight:700;color:var(--muted);align-self:center;margin-left:1px}
.cal-dots{justify-content:center;min-width:0}
.cal-head .cal-today[hidden]{display:none}
.cal-d.is-blank{pointer-events:none}

/* v48: карточка проведённого занятия — как в системных приложениях iPhone */
.nv-top{margin-bottom:6px}
.nv-right{display:flex;align-items:center;gap:6px}
.nv-edit{border:0;background:transparent;color:var(--wine);font:inherit;font-size:16px;font-weight:600;min-height:44px;padding:0 10px;-webkit-tap-highlight-color:transparent}
.nv-edit:active{opacity:.5}
.nv-title{margin:2px 0 18px}
.nv-block{margin:0 0 18px}
.nv-h{display:block;margin:0 0 8px 2px;font:inherit;font-size:13px;font-weight:650;color:var(--muted);letter-spacing:0;text-transform:none}
.nv-h-btn{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:0 4px 0 2px;min-height:28px;-webkit-tap-highlight-color:transparent}
.nv-h-btn svg{transition:transform .35s cubic-bezier(.22,.84,.3,1)}
.nv-fold.is-open .nv-h-btn svg{transform:rotate(180deg)}
.nv-card{background:var(--inset);border-radius:var(--radius-lg);padding:13px 14px}
.nv-card p{margin:0;line-height:1.45}
.nv-card p+p{margin-top:8px}
.nv-fold-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s cubic-bezier(.22,.84,.3,1),opacity .3s;opacity:0}
.nv-fold.is-open .nv-fold-body{grid-template-rows:1fr;opacity:1}
.nv-fold-in{overflow:hidden;min-height:0}
.nv-fold:not(.is-open) .nv-fold-in{visibility:hidden;transition:visibility 0s .38s}
.nv-report{display:grid;gap:14px}
.nv-bottom{display:grid;gap:10px;margin:26px 0 0;padding-bottom:max(22px,env(safe-area-inset-bottom))}
.nv-bottom .button{min-height:50px;font-size:16px}
.button.nv-del{background:transparent;border-color:transparent;color:#C0392B;box-shadow:none;font-weight:600}
@media(prefers-color-scheme:dark){.button.nv-del{color:#FF7A6E}}
.nv-block .nex-card{background:var(--inset)}
@media(prefers-reduced-motion:reduce){.nv-fold-body,.nv-h-btn svg{transition:none}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="dim" class="dim" aria-hidden="true"></div><div id="overlay"></div><div id="under"></div><div id="leaving"></div>
<div id="toast"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden />
<script>
'use strict';
const seedExercises = [
 {
  "id": "rz01",
  "title": "Динамическая разминка",
  "stroke": "Разминка",
  "goals": [
   "Работа ног",
   "Реакция"
  ],
  "format": "Самостоятельно",
  "stage": "",
  "level": "Любой",

асть в саму заднюю линию.","equipment":"Корзина мячей; 2–4 плоских маркера."},{"id":"fh05","title":"Форхенд в движении","stroke":"Форхенд","goals":["Работа ног","Контроль"],"format":"С корзиной","level":"Средний","minutes":15,"brief":"Передвижение к широкому форхенду и восстановление позиции.","steps":"После сплит-степа сделать первый шаг к широкому мячу, выполнить контролируемый форхенд и вернуться в рабочую позицию. 3 серии по 6 мячей с паузой на восстановление.","cue":"Первый шаг в сторону мяча, устойчивый контакт, восстановление без скрещивания при потере равновесия.","easier":"Подавать мячи медленнее и менее широко.","harder":"Добавить непредсказуемое чередование широкого и центрального мяча.","diagram":"movement","setup":"Игрок начинает за задней линией; тренер с противоположной стороны подаёт мячи в форхендовую сторону. Без целевых зон.","metric":"Сколько из 18 мячей сыграно с сохранением баланса и возвращением в позицию до следующего наброса.","errors":"Поздний старт; после удара игрок остаётся на месте.","equipment":"Корзина мячей."},{"id":"fh06","title":"Форхенд с ускорением","stroke":"Форхенд","goals":["Сила","Контроль"],"format":"С корзиной","level":"Продвинутый","minutes":12,"brief":"Ускорение третьего форхенда при сохранении попадания в крупную игровую область.","steps":"Два нейтральных форхенда, третий — с ускорением в заданную область. Повторить 10 троек; скорость повышать лишь до уровня, где техника остаётся стабильной.","cue":"Ускорение за счёт последовательности движений и активного шага, без зажатой кисти.","easier":"Ускорять каждый четвёртый мяч и расширить зону.","harder":"После ускорения продолжать розыгрыш на счёт.","diagram":"attack","setup":"Игрок за задней линией. На стороне партнёра обозначить большую безопасную область для ускоряемого мяча.","metric":"Успешные третьи удары с ускорением и попаданием в область: __/10.","errors":"Преждевременное форсирование; потеря баланса при ускорении.","equipment":"Мячи; маркеры целевой области."},{"id":"bh01","title":"Бэкхенд кроссом — серия","stroke":"Бэкхенд","goals":["Стабильность","Глубина"],"format":"С партнёром","level":"Средний","minutes":15,"brief":"Бэкхендовая диагональ без зоны: цель — непрерывность розыгрыша.","steps":"Партнёр вводит мяч комфортно. Играть бэкхенд кроссом в спокойном темпе сериями на 8, 12 и 20 ударов. После ошибки обсуждать одну техническую причину.","cue":"Дистанция до мяча, стабильная точка контакта, своевременное восстановление.","easier":"Начать с 5–6 ударов в замедленном темпе.","harder":"Сохранить 20 ударов с небольшим повышением скорости.","diagram":"cross","setup":"Два игрока за задними линиями на бэкхендовой диагонали. Зоны на корте не рисуем.","metric":"Максимальная серия подряд без ошибки; отдельно отмечать устойчивость при изменении темпа.","errors":"Контакт слишком близко к корпусу; ускорение при потере равновесия.","equipment":"Мячи; партнёр."},{"id":"bh02","title":"Бэкхенд на глубину","stroke":"Бэкхенд","goals":["Глубина","Контроль"],"format":"С корзиной","level":"Начальный","minutes":12,"brief":"Бэкхенд в глубокую целевую область: измеряем длину мяча.","steps":"Сделать 2 серии по 10 ударов в целевую полосу за линией подачи. Считать только мячи, попавшие в отмеченную область.","cue":"Не менять баланс на попытку добавить глубину, держать запас над сеткой.","easier":"Расширить зону ближе к сетке.","harder":"Чередовать глубокую цель справа и слева по команде.","diagram":"deep","setup":"Тренер подаёт удобные мячи на бэкхенд; на противоположной половине отмечена глубокая область.","metric":"Попадания в глубокую зону в каждой серии: __/10 и __/10.","errors":"Работа одной рукой без движения корпуса; прицеливание в самую заднюю линию.","equipment":"Корзина мячей; маркеры глубины."},{"id":"bh03","title":"Бэкхенд под давлением","stroke":"Бэкхенд","goals":["Стабильность","Реакция"],"format":"С тренером","level":"Продвинутый","minutes":15,"brief":"Сохранять технику бэкхенда, когда темп наброса постепенно растёт.","steps":"Три блока по 8 мячей: комфортный, средний и повышенный темп. Между блоками фиксировать, на каком темпе участились ошибки и пропал баланс.","cue":"Ранняя подготовка, первый шаг к мячу, компактное восстановление после удара.","easier":"Уменьшить темп и подавать мячи на одну высоту.","harder":"Чередовать темп случайным образом.","diagram":"pressure","setup":"Тренер с корзиной, игрок в базовой позиции. Зоны не нужны — контроль качества удара и восстановления.","metric":"Успешные контролируемые удары из 8 на каждом темпе; указать первый темп, где техника заметно ухудшается.","errors":"Сокращение работы ног; попытка компенсировать поздний контакт кистью.","equipment":"Корзина мячей."},{"id":"bh04","title":"Бэкхенд по линии","stroke":"Бэкхенд","goals":["Точность","Тактика"],"format":"С партнёром","level":"Средний","minutes":12,"brief":"Перевод бэкхендом по линии на подходящем мяче после диагонального обмена.","steps":"Играть бэкхенд кроссом минимум 2 удара. На комфортном мяче выполнить перевод по линии; после перевода продолжить розыгрыш свободно. Провести 10 попыток.","cue":"Решение раньше контакта; переводить из устойчивой позиции.","easier":"Партнёр заранее даёт удобный мяч для перевода.","harder":"Партнёр варьирует глубину и скорость, игрок самостоятельно выбирает перевод.","diagram":"line","setup":"Два партнёра за задней линией, на бэкхендовой диагонали. Без зоны: важен момент перевода.","metric":"Количество осмысленных и успешных переводов по линии из 10.","errors":"Менять направление под давлением; оставаться на месте после перевода.","equipment":"Мячи; партнёр."},{"id":"sv01","title":"Вторая подача — серия","stroke":"Подача","goals":["Стабильность","Вращение"],"format":"Самостоятельно","level":"Средний","minutes":15,"brief":"Стабильное попадание с запасом над сеткой.","steps":"Выполнить 3 серии по 10 вторых подач. Записать число попаданий в нужный квадрат.","cue":"Ритм, подброс, вращение и спокойное завершение движения.","easier":"Снизить скорость, сосредоточиться на ритме.","harder":"Задать цель 8 из 10 в каждой серии.","diagram":"serve","setup":"Подача с задней линии, одна сторона корта на серию. Целевые зоны не обязательны: задача — попадать в правильный квадрат.","metric":"Результат трёх серий по 10: __/10, __/10, __/10. Отдельно отметить двойные ошибки.","errors":"Нестабильный подброс; попытка добавить скорость при потере вращения.","equipment":"30 мячей или корзина."},{"id":"sv02","title":"Подача по направлениям","stroke":"Подача","goals":["Точность","Контроль"],"format":"С корзиной","level":"Средний","minutes":12,"brief":"Подачи в Т и широко с чередованием задач.","steps":"Перед каждой подачей выбирать целевое направление: в Т или широко. Сделать 20 попыток.","cue":"Повторяемый подброс, одинаковая подготовка к разным целям.","easier":"Отрабатывать одно направление за серию.","harder":"Менять направление по сигналу.","diagram":"serveZones","setup":"Отметить два целевых сектора в правильном квадрате подачи: широко и в Т.","metric":"Попадания отдельно в Т и широко: __/10 и __/10.","errors":"Изменение подброса при смене цели; прицеливание в самую линию.","equipment":"Мячи; 4 маркера для секторов."},{"id":"sv03","title":"Первая подача — сила и контроль","stroke":"Подача","goals":["Сила","Точность"],"format":"Самостоятельно","level":"Продвинутый","minutes":15,"brief":"Баланс скорости и процента попаданий.","steps":"Сделать серии по 10 первых подач, фиксируя процент попаданий и ощущение скорости.","cue":"Сила не должна разрушать биомеханику подачи.","easier":"Работать на комфортной скорости.","harder":"Повысить темп, сохраняя целевой процент попаданий.","diagram":"serveWide","setup":"Подача с задней линии без заданной маленькой зоны; цель — сохранить процент при управляемой скорости.","metric":"Количество первых подач в поле из каждой серии по 10; сравнить результаты между сериями.","errors":"Форсирование плечом; нестабильный подброс.","equipment":"Мячи."},{"id":"rt01","title":"Приём второй подачи","stroke":"Приём","goals":["Точность","Тактика"],"format":"С тренером","level":"Средний","minutes":15,"brief":"Раннее чтение подачи и надёжный глубокий ответ.","steps":"Тренер подаёт вторые подачи; игрок направляет приём в крупную центральную зону.","cue":"Сплит-степ, короткая подготовка, направление первого шага.","easier":"Начать с предсказуемых направлений.","harder":"Чередовать два направления подачи.","diagram":"return","setup":"Тренер подаёт со стандартной позиции; принимающий за задней линией. Отмечена широкая безопасная зона для глубокого приёма.","metric":"Глубокие приёмы в отмеченную область из 10 попыток.","errors":"Поздний сплит-степ; слишком широкий замах.","equipment":"Мячи; маркеры глубины."},{"id":"rt02","title":"Приём с коротким замахом","stroke":"Приём","goals":["Реакция","Контроль"],"format":"С тренером","level":"Продвинутый","minutes":12,"brief":"Стабильный контакт на быстрых подачах.","steps":"Игрок укорачивает замах и направляет мяч глубоко по центру, не пытаясь сразу атаковать.","cue":"Ранняя подготовка, компактный контакт.","easier":"Работать с умеренной скоростью подачи.","harder":"Повышать темп и менять сторону.","diagram":"returnFast","setup":"Подача тренера с постепенным увеличением скорости; маленькая цель не нужна.","metric":"Количество надёжных приёмов в корт из 10 на каждой скорости.","errors":"Полный замах на быстрой подаче; позднее чтение направления.","equipment":"Мячи."},{"id":"vl01","title":"Удары с лёта по зонам","stroke":"Игра с лёта","goals":["Точность","Контроль"],"format":"С корзиной","level":"Начальный","minutes":12,"brief":"Направление мяча без широкого замаха.","steps":"Игрок у сетки чередует правую и левую целевые зоны на противоположной половине.","cue":"Устойчивое положение ракетки, шаг навстречу мячу.","easier":"Работать на небольшом расстоянии от сетки.","harder":"Добавить серию с движением вперёд.","diagram":"volley","setup":"Игрок у сетки, тренер с корзиной на противоположной половине. Две области для направления воллея.","metric":"Попадания в левую и правую области из 10 попыток в каждую.","errors":"Слишком длинный замах; отсутствие шага к мячу.","equipment":"Корзина мячей; маркеры зон."},{"id":"vl02","title":"Первый удар с лёта","stroke":"Игра с лёта","goals":["Реакция","Тактика"],"format":"С тренером","level":"Средний","minutes":12,"brief":"Контроль первого воллея после выхода к сетке.","steps":"Игрок начинает с середины корта, подходит к сетке и направляет первый воллей глубоко.","cue":"Подход со сплит-степом, низкое положение, выбор зоны.","easier":"Давать удобный мяч на первый воллей.","harder":"Добавить пассинг от соперника.","diagram":"approach","setup":"Игрок выходит с середины корта; тренер/партнёр напротив. Без зоны, если не задана точность.","metric":"Первый воллей в корт с сохранением баланса из 10 попыток.","errors":"Подход вплотную к сетке без сплит-степа; остановка на прямых ногах.","equipment":"Мячи."},{"id":"sm01","title":"Смэш после отхода назад","stroke":"Смэш","goals":["Работа ног","Точность"],"format":"С корзиной","level":"Средний","minutes":12,"brief":"Правильная работа ног под свечой.","steps":"Тренер набрасывает свечи с постепенным увеличением глубины. Игрок выходит под мяч и направляет смэш в большую зону.","cue":"Разворот плеч, приставные шаги, безопасная дистанция.","easier":"Сократить глубину свечей.","harder":"Добавить вторую свечу подряд.","diagram":"smash","setup":"Игрок у сетки с возможностью безопасно отойти назад; тренер набрасывает свечи. Задана широкая область направления смэша.","metric":"Смэши с контролем баланса и попаданием в область из 10 попыток.","errors":"Отход назад спиной к сетке; удар в неустойчивом положении.","equipment":"Корзина мячей; 2 маркера."},{"id":"ft01","title":"Первый шаг к широкому мячу","stroke":"Передвижение","goals":["Работа ног","Реакция"],"format":"С корзиной","level":"Любой","minutes":10,"brief":"Быстрая реакция и возврат к центру.","steps":"Тренер направляет мячи в две стороны. Игрок выполняет стартовый шаг, удар и восстановление.","cue":"Сплит-степ перед ударом тренера и контроль центра тяжести.","easier":"Замедлить подачу и сократить дистанцию.","harder":"Добавить третий вариант по короткому мячу.","diagram":"footwork","setup":"Игрок за задней линией, тренер подаёт влево или вправо без предварительного сигнала.","metric":"Удары с своевременным первым шагом и возвратом в позицию из 12 попыток.","errors":"Ожидание на прямых ногах; старт после отскока мяча.","equipment":"Корзина мячей."},{"id":"ft02","title":"Короткий мяч и возврат","stroke":"Передвижение","goals":["Работа ног","Контроль"],"format":"С корзиной","level":"Средний","minutes":12,"brief":"Переход вперёд и контролируемое возвращение.","steps":"После глубокого мяча игрок атакует короткий и занимает правильную позицию для следующего удара.","cue":"Шаги под мяч, контроль торможения.","easier":"Упростить последовательность до двух мячей.","harder":"Добавить решение: остаться у сетки или вернуться.","diagram":"shortBall","setup":"Игрок у задней линии, тренер чередует глубокий и короткий наброс.","metric":"Удачные подходы к короткому мячу и контролируемое последующее действие из 10 розыгрышей.","errors":"Выход к короткому мячу без торможения; неверный выбор остаться или вернуться.","equipment":"Мячи."},{"id":"tx01","title":"Кросс — кросс — линия","stroke":"Тактика","goals":["Тактика","Контроль"],"format":"С партнёром","level":"Средний","minutes":15,"brief":"Выстроить атаку через изменение направления.","steps":"Два стабильных кросса, затем перевод по линии при подходящем мяче. Повторить 8–10 розыгрышей.","cue":"Терпение, качество подготовительных ударов.","easier":"Тренер заранее подаёт удобный мяч для перевода.","harder":"Разрешить перевод только после глубокого удара.","diagram":"line","setup":"Два игрока за задними линиями, без зон: тренируем последовательность и выбор момента.","metric":"Осмысленные переводы по линии из 10 розыгрышей после двух кроссов.","errors":"Перевод по линии при плохом балансе; игнорирование качества второго кросса.","equipment":"Мячи; партнёр."},{"id":"tx02","title":"Игра в глубину по центру","stroke":"Тактика","goals":["Стабильность","Тактика"],"format":"Игровое","level":"Любой","minutes":15,"brief":"Снижать риск и удерживать нейтральный розыгрыш.","steps":"Розыгрыш на счёт: дополнительное очко за серию из 6 глубоких мячей в центральный коридор.","cue":"Выбор безопасного направления и высоты.","easier":"Увеличить ширину коридора.","harder":"Сузить коридор или увеличить длину серии.","diagram":"center","setup":"Отметить безопасный центральный коридор за линией подачи.","metric":"Число серий по 6 глубоких ударов в коридор за 10 минут.","errors":"Прицеливание в линии; излишняя скорость нейтрального мяча.","equipment":"Мячи; маркеры коридора."},{"id":"tx03","title":"Укороченный после глубины","stroke":"Тактика","goals":["Тактика","Точность"],"format":"С партнёром","level":"Продвинутый","minutes":15,"brief":"Создать пространство коротким ударом после глубокого.","steps":"Два глубоких удара с последующим укороченным на подходящем мяче.","cue":"Маскировка намерения и выбор момента.","easier":"Выполнять короткий удар с наброса.","harder":"Играть очко после укороченного.","diagram":"drop","setup":"Два игрока за задней линией; после глубоких мячей один выполняет укороченный. Зону не добавляем, если точное попадание не задано.","metric":"Укороченные, после которых соперник не успевает комфортно атаковать, из 10 попыток.","errors":"Укороченный при невыгодной позиции; заранее читаемая подготовка.","equipment":"Мячи."},{"id":"tx04","title":"Свеча над игроком у сетки","stroke":"Тактика","goals":["Точность","Тактика"],"format":"С тренером","level":"Средний","minutes":12,"brief":"Выбрать правильную траекторию защитной свечи.","steps":"Тренер занимает позицию у сетки. Игрок выполняет свечу в глубину с запасом по высоте.","cue":"Не форсировать из неустойчивого положения.","easier":"Увеличить целевую зону.","harder":"Тренер меняет позицию у сетки.","diagram":"lob","setup":"Тренер у сетки, ученик за задней линией; без фиксированной зоны, если задача — выбрать высоту и глубину свечи.","metric":"Свечи, перелетевшие соперника и приземлившиеся в корте, из 10 попыток.","errors":"Недостаточная высота над игроком у сетки; плоский удар в спешке.","equipment":"Мячи."},{"id":"fh07","title":"20 форхендов кроссом в зону","stroke":"Форхенд","goals":["Стабильность","Точность"],"format":"С партнёром","level":"Средний","minutes":15,"brief":"20 форхендов кроссом в заранее отмеченный квадрат: стабильность плюс точность.","steps":"Начать розыгрыш удобным мячом. Засчитывать только форхенды, попавшие в выделенную область. Цель — серия из 20 засчитанных попаданий без ошибки; после промаха начать новую попытку.","cue":"Играть с запасом от границ квадрата и сетки, держать устойчивый ритм.","easier":"Сначала 10 подряд или увеличить квадрат.","harder":"Уменьшить квадрат или добавить контроль темпа.","diagram":"crossMirror","zoneMode":"on","setup":"Два игрока на диагонали за задними линиями; на противоположной половине выделен один достаточно крупный квадрат.","metric":"Максимальное число подряд засчитанных попаданий в квадрат; рабочая цель — 20.","errors":"Попытка целиться в край зоны; увеличение силы вместо точности.","equipment":"Мячи; партнёр; плоские маркеры зоны."},{"id":"wu01","title":"Динамическая разминка","stroke":"Разминка","goals":["Работа ног","Реакция"],"format":"Самостоятельно","level":"Любой","minutes":8,"diagram":"dynamicWarmup","zoneMode":"off","brief":"Подготовить тело к занятию: плавные перемещения, смена направления и работа рук без гонки за темпом.","setup":"Свободное пространство за задней линией или вдоль боковой. Без корзин и целевых зон. Мячи не обязательны.","steps":"Начать с лёгкого шага по периметру корта 1–2 круга. Затем серии: боковые приставные шаги, выпады с поворотом плеч, имитация удара без мяча, короткие ускорения на 4–6 метров и спокойный возврат. Каждое движение 30–45 секунд, без резкого старта. Закончить лёгким встряхиванием рук и ног.","metric":"Игрок двигается свободно, дыхание ровное, нет скованности в плечах и бёдрах перед первой работой с мячом.","cue":"Держать колени мягкими, смотреть вперёд, не торопить амплитуду в первой минуте.","errors":"Сразу ускоряться как на челноке; начинать с растяжки стоя на прямых ногах; забывать про руку и плечо.","easier":"Уменьшить амплитуду и убрать ускорения, оставить только шаг, приставные и имитацию удара.","harder":"Добавить смену направления по сигналу тренера и лёгкую работу с двумя мячами у корпуса.","equipment":"Без инвентаря; по желанию — два мяча."},{"id":"wu02","title":"Мини-теннис с линии подачи","stroke":"Разминка","goals":["Контроль","Реакция"],"format":"С партнёром","level":"Любой","minutes":10,"diagram":"miniTennis","zoneMode":"on","brief":"Короткий розыгрыш с линии подачи: почувствовать контакт и контроль, не набирая полную силу.","setup":"Оба игрока стоят у своих линий подачи. Игра только в квадраты подачи. Сетку не обходить, целевых конусов не ставить, если игрокам и так ясно поле.","steps":"Ввести мяч мягкой подачей с руки. Играть короткими ударами в пределах квадратов подачи, чередуя форхенд и бэкхенд. Держать серию 8–12 ударов, затем сменить того, кто вводит мяч. Сделать 4–6 серий, постепенно чуть увеличивая длину мяча, но не выходя за линию подачи.","metric":"Несколько спокойных серий подряд без спешки; мяч перелетает сетку с запасом и остаётся в квадратах.","cue":"Короткий замах, встреча мяча впереди, мягкие ноги. Не «поддевать» и не ускорять рано.","errors":"Слишком широкий замах; отход назад к задней линии; удар вниз в сетку из-за жёсткой кисти.","easier":"Разрешить играть во всю переднюю половину корта и замедлить темп.","harder":"Играть только в один квадрат или вводить мяч с отскока ниже.","equipment":"Мячи; партнёр."},{"id":"wu03","title":"Волей в волей у сетки","stroke":"Разминка","goals":["Контроль","Реакция"],"format":"С партнёром","level":"Любой","minutes":8,"diagram":"volleyToVolley","zoneMode":"off","brief":"Короткая серия ударов с лёта у сетки, чтобы включить руки, стопы и чувство дистанции.","setup":"Оба игрока в 2–3 метрах от сетки, чуть шире центральной линии. Без зон. Мяч вводят коротким набросом.","steps":"Начать медленным обменом по центру. Держать мяч в воздухе сериями по 8–10 ударов. Затем чуть смещаться влево и вправо, сохраняя контакт впереди себя. Если мяч падает — спокойно начать новую серию. 4–5 серий достаточно.","metric":"Серии идут без напряжения, игроки успевают к мячу и не отходят далеко от сетки.","cue":"Короткий удар от плеча, кисть стабильна, шаг к мячу небольшой и своевременный.","errors":"Широкий замах как с задней линии; стоять на прямых ногах; пятиться от сетки после каждого удара.","easier":"Разрешить один отскок или играть ближе, почти «ловя» мяч.","harder":"Чередовать направление — чуть левее и правее — или ускорить темп на последней серии.","equipment":"Мячи; партнёр или тренер."},{"id":"wu04","title":"Совместный розыгрыш с задней линии","stroke":"Разминка","goals":["Стабильность","Контроль"],"format":"С партнёром","level":"Любой","minutes":10,"diagram":"center","zoneMode":"off","brief":"Спокойный розыгрыш с задних линий: ввести ритм и длину мяча, не превращая разминку в борьбу.","setup":"Игроки примерно в метре за задними линиями, ближе к центру. Без конусов и узких целей — задача в ритме и контроле.","steps":"Ввести мяч удобной подачей с руки. Играть в середину корта или мягким кроссом, наращивая серию: 8, 12, затем 16 ударов. Темп средний, запас над сеткой обязателен. При ошибке начать отсчёт заново без комментариев о счёте. 5–6 попыток.","metric":"Появляется устойчивая серия в комфортном темпе; мяч регулярно долетает за линию подачи.","cue":"Ранняя подготовка, спокойный ритм ног, не спешить с ускорением третьего-четвёртого мяча.","errors":"Сразу бить сильно; стоять внутри корта слишком близко к задней линии; обрывать серию, чтобы «проверить» удар.","easier":"Играть только в большую центральную зону и начать с серий по 6 ударов.","harder":"После устойчивой серии добавить лёгкую смену направления, не повышая силу.","equipment":"Мячи; партнёр."},{"id":"wu05","title":"Разминочные подачи","stroke":"Разминка","goals":["Стабильность","Вращение"],"format":"Самостоятельно","level":"Любой","minutes":8,"diagram":"serve","zoneMode":"off","brief":"Вывести подачу в рабочий ритм: сначала движение и попадание, затем привычные направления.","setup":"Корзина или несколько мячей у задней линии. Начинать с удобного квадрата. Целевые зоны на старте не нужны — достаточно самого квадрата подачи.","steps":"Сделать 6–8 подач только в движение, без установки на силу, с увеличенным запасом над сеткой. Затем 8–10 вторых подач с вращением в удобный квадрат. После этого по 3–4 подачи в Т и широко, всё ещё без максимальной скорости. Закончить 4 спокойными первыми подачами в выбранном направлении.","metric":"Движение свободно, мяч стабильно перелетает сетку; к концу блока игрок готов подавать в занятии, не «нащупывая» жест.","cue":"Сначала ритм подброса и проводки, потом направление. Не начинать с самой быстрой первой подачи.","errors":"Сразу подавать на силу; сбитый подброс; короткая проводка и удар «вниз» в сетку.","easier":"Подавать только вторые подачи и увеличить запас над сеткой.","harder":"Добавить чередование квадратов и по одной подаче в каждое направление, сохраняя тот же ритм.","equipment":"Корзина или 10–15 мячей."}];

const plural = (n, one, few, many) => {
  const abs = Math.abs(n) % 100, d = abs % 10;
  if (abs > 10 && abs < 20) return many;
  if (d === 1) return one;
  if (d >= 2 && d <= 4) return few;
  return many;

function migrateLibrary(customExercises, exerciseOverrides, diagramOverrides) {
  const legacyById = Object.fromEntries(LEGACY_SEED.map((e) => [e.id, e]));
  const customIds = new Set(customExercises.map((e) => e.id));

    const ov = exerciseOverrides[id] && typeof exerciseOverrides[id] === 'object' ? exerciseOverrides[id] : null;
    if (!customIds.has(id) && (ov || Array.isArray(diagramOverrides[id]))) {

function migrateGroupRosters(plans, groups, students) {
  const groupById = Object.fromEntries(groups.map((g) => [g.id, g]));
  const nameById = Object.fromEntries(students.map((st) => [st.id, st.name]));
  let changed = 0;
  for (const p of plans) {
    if (!p.groupIds.length) continue;
    let touched = false;
    for (const gid of p.groupIds) {
      if (Array.isArray(p.groupMembers[gid]) || !groupById[gid]) continue;
      p.groupMembers[gid] = [...groupById[gid].studentIds];
      touched = true;
    }
    if (p.status === 'done' && !Array.isArray(p.actualStudentIds) && p.groupIds.every((gid) => Array.isArray(p.groupMembers[gid]))) {
      if (p.kind === 'plan' && !Array.isArray(p.plannedStudentIds)) p.plannedStudentIds = selectedStudentIds(p);
      p.actualStudentIds = uniq([...p.studentIds, ...p.groupIds.flatMap((gid) => p.groupMembers[gid]), ...(p.recordedStudentIds || [])]);
      p.attendanceInferred = true;
      touched = true;
    }
    if (touched) {
      for (const id of [...selectedStudentIds(p), ...(p.actualStudentIds || [])]) if (!p.names[id] && nameById[id]) p.names[id] = nameById[id];

  }

/* Разметка ITF: 23,77 × 10,97 м, одиночные линии на 1,37 м внутри, линия подачи в 6,40 м от сетки. */
const CO = { x: 49.25, y: 64, s: 17 };
const X = (m) => CO.x + m * CO.s;
const Y = (m) => CO.y + m * CO.s;
const mirrorX = (x) => Number((COURT_W - x).toFixed(2));

function mirrorShapes(shapes) {
  return shapes.map((s) => {
    const n = { ...s, x: mirrorX(s.x) };
    if (Number.isFinite(s.x2)) n.x2 = mirrorX(s.x2);
    return n;
  });
}

function marker(x, y, symbol, coach = false) {
  const cx = X(x), cy = Y(y);
  return `<g class="person-marker" aria-label="${coach ? 'Тренер' : 'Игрок'}"><circle cx="${cx}" cy="${cy}" r="11" fill="${coach ? '#FFF6E8' : '#713D4A'}" stroke="${coach ? '#713D4A' : '#FFFBF4'}" stroke-width="1.7" shape-rendering="geometricPrecision"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" fill="${coach ? '#713D4A' : '#FFFFFF'}" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">${symbol}</text></g>`;
}

function exerciseNeedsZone(e) {
  return e.zoneMode === 'on' || (e.zoneMode !== 'off' && explicitlyZonedDrills.has(e.id));
}

function templateShapes(key, withZones = true) {
  const d = diagramTemplates[key] || diagramTemplates.cross, r = [];
  for (const type of ['player', 'coach']) if (d[type]) r.push({ kind: type, x: d[type][0], y: d[type][1] });
  for (const kind of ['shot', 'move']) for (const a of d[kind] || []) r.push({ kind, x: a[0], y: a[1], x2: a[2], y2: a[3] });
  if (withZones) for (const a of d.zones || []) r.push({ kind: 'zone', x: a[0], y: a[1], x2: a[0] + a[2], y2: a[1] + a[3] });
  return r;
}

const safeShape = (s) => s && ['player', 'coach', 'shot', 'move', 'zone', 'target'].includes(s.kind)
  && [s.x, s.y, ...(['shot', 'move', 'zone', 'target'].includes(s.kind) ? [s.x2, s.y2] : [])].every(Number.isFinite);

function getCanonicalShapes(e) {
  const o = e && store.diagramOverrides[e.id];
  if (Array.isArray(o)) return o.filter(safeShape).slice(0, 65);
  if (Array.isArray(e && e.diagramShapes)) return e.diagramShapes.filter(safeShape).slice(0, 65);
  return templateShapes(e ? e.diagram : 'cross', e ? exerciseNeedsZone(e) : true);
}

function getDiagramShapes(e, mirror = false) {
  const shapes = getCanonicalShapes(e);
  return mirror ? mirrorShapes(shapes) : shapes;
}

function drawDiagramShapes(shapes, uid) {
  const zones = shapes.filter((s) => s.kind === 'zone').map((s) => `<rect class="diagram-shape" x="${X(Math.min(s.x, s.x2))}" y="${Y(Math.min(s.y, s.y2))}" width="${Math.abs(s.x2 - s.x) * CO.s}" height="${Math.abs(s.y2 - s.y) * CO.s}" rx="3" fill="#F2E7BD" fill-opacity=".76" stroke="#FFF0BC" stroke-width="1.2"/>`).join('')
    + shapes.filter((s) => s.kind === 'target').map((s) => `<circle class="diagram-shape" cx="${X(s.x)}" cy="${Y(s.y)}" r="${Math.min(3, Math.hypot(s.x2 - s.x, s.y2 - s.y)) * CO.s}" fill="#F2E7BD" fill-opacity=".76" stroke="#FFF0BC" stroke-width="1.2"/>`).join('');
  const arrows = shapes.filter((s) => s.kind === 'shot' || s.kind === 'move').map((s) => {
    const isShot = s.kind === 'shot';
    return `<path class="diagram-shape" d="M${X(s.x)} ${Y(s.y)} L${X(s.x2)} ${Y(s.y2)}" fill="none" stroke="${isShot ? '#713D4A' : '#344F43'}" stroke-width="${isShot ? 3.4 : 2.8}" stroke-dasharray="${isShot ? '7 4' : '2 6'}" stroke-linecap="round" marker-end="url(#${isShot ? 'arrow' : 'moveArrow'}-${uid})"/>`;
  }).join('');
  const people = shapes.filter((s) => s.kind === 'player' || s.kind === 'coach').map((s) => `<g class="diagram-shape">${marker(s.x, s.y, s.kind === 'player' ? 'И' : 'Т', s.kind === 'coach')}</g>`).join('');
  return zones + arrows + people;
}

function courtKind(e) {
  if (e && (e.court === 'red' || e.court === 'orange' || e.court === 'full')) return e.court;
  if (!e) return 'full';
  const text = [e.title, e.brief, e.setup, e.stroke].join(' ').toLowerCase();
  if (/оранжев/.test(text)) return 'orange';
  if (/красн(?:ый|ого|ом) корт|красный мяч/.test(text)) return 'red';
  return 'full';
}

function seedDiagramShapes(e) {
  const seed = e && seedById[e.id];
  if (seed && Array.isArray(seed.diagramShapes) && seed.diagramShapes.length) {
    return clone(seed.diagramShapes.filter(safeShape).slice(0, 65));
  }
  return templateShapes(e ? e.diagram : 'cross', e ? exerciseNeedsZone(e) : true);
}

function handSwitchHTML() {
  const current = contextHand();
  const autoHint = (() => {
    if (schemeContext.source === 'plan') {
      const t = targetOfPlan(getPlan(schemeContext.planId));
      if (t.type === 'group' || t.members.length > 1) {
        const g = t.type === 'group';
        const lefts = t.members.filter((s) => s.hand === 'left').length;
        const rights = t.members.length - lefts;
        if (lefts && rights) return (g ? 'В группе' : 'Среди учеников') + ' есть и правши, и левши — по умолчанию схема для правши.';
        if (lefts && !rights) return (g ? 'Вся группа играет' : 'Все ученики играют') + ' левой — схема отражена автоматически.';
        return g ? 'Группа играет правой.' : 'Все ученики играют правой.';
      }
      if (!t.student && t.members.length === 1) t.student = t.members[0];
      if (t.student) return t.student.hand === 'left'
        ? `${displayName(t.student)} играет левой — схема отражена автоматически.`
        : `${displayName(t.student)} играет правой.`;
    }
    if (schemeContext.source === 'student') {
      const s = getStudent(schemeContext.studentId);
      if (s) return s.hand === 'left'
        ? `${displayName(s)} играет левой — схема отражена автоматически.`
        : `${displayName(s)} играет правой.`;
    }
    return 'Исходные схемы нарисованы для правши. Для левши стороны форхенда и бэкхенда меняются местами.';
  })();
  return `<div class="hand-switch">
    <span class="label">Показ</span>
    <div class="hand-switch-btns" role="group" aria-label="Для какой руки показать">
      <button type="button" class="hand-btn ${schemeHand === 'auto' ? 'active' : ''}" data-action="scheme-hand" data-id="auto">Авто</button>
      <button type="button" class="hand-btn ${current === 'right' && schemeHand !== 'auto' ? 'active' : ''} ${schemeHand === 'auto' && current === 'right' ? 'is-auto' : ''}" data-action="scheme-hand" data-id="right">Для правши</button>
      <button type="button" class="hand-btn ${current === 'left' && schemeHand !== 'auto' ? 'active' : ''} ${schemeHand === 'auto' && current === 'left' ? 'is-auto' : ''}" data-action="scheme-hand" data-id="left">Для левши</button>
    </div>
    <p class="small-note">${h(autoHint)}${current === 'left' ? ' Сейчас показан вариант для левши.' : ''}</p>
  </div>`;
}

function editorHelp() {

function openDiagramEditor(id) {
  const e = getEx(id);
  if (!e) return;
  diagramEditor = { id, tool: 'player', shapes: clone(getCanonicalShapes(e)), pending: null, history: [] };
  renderDiagramEditor();
}

function editorUndoCheckpoint() {
  diagramEditor.history.push(clone(diagramEditor.shapes));
  if (diagramEditor.history.length > 20) diagramEditor.history.shift();
}

function renderDiagramEditor() {
  if (!diagramEditor) return;
  const e = getEx(diagramEditor.id);
  if (!e) return;
  const svg = courtSVG(e.diagram, diagramEditor.shapes, true, false, courtKind(e));
  openModal(`${modalHead('Редактор схемы', e.title)}<div class="diagram-edit-layout"><div class="diagram-editor-board">${svg}</div><div><h3 class="content-heading">Элементы схемы</h3><div class="diagram-tool-grid">${diagramToolsMarkup()}</div><div class="diagram-help" id="editor-help">${editorHelp()}</div><div class="diagram-action-bar"><button class="button secondary small" data-action="diagram-undo" ${diagramEditor.history.length ? '' : 'disabled'}>Отменить</button><button class="button secondary small" data-action="diagram-clear-zones" ${diagramEditor.shapes.some((s) => s.kind === 'zone' || s.kind === 'target') ? '' : 'disabled'}>Убрать все зоны</button><button class="button secondary small" data-action="diagram-clear">Очистить</button><button class="button quiet small" data-action="diagram-default">Исходная схема</button></div><div class="diagram-editor-legend" style="margin-top:15px"><span style="color:var(--wine)">- - - Мяч</span><span style="color:#344F43">··· Движение</span><span style="color:#A08656">▧ Зона / мишень — по необходимости</span></div><p class="small-note" style="margin-top:10px">Схема сохраняется в исходном виде — для правши. Для ученика с левой рукой она отразится автоматически. Оригинальное упражнение можно вернуть кнопкой «Исходная схема».</p><div class="diagram-editor-actions form-actions"><button class="button" data-action="diagram-save">${icon('check', 16)} Сохранить схему</button><button class="button secondary" data-action="diagram-cancel">Отмена</button></div></div></div>`);
}

function diagramTap(event) {
  if (!diagramEditor) return;
  const svg = event.target.closest('svg[data-action="diagram-tap"]');
  if (!svg) return;
  const point = svg.createSVGPoint();
  point.x = event.clientX;
  point.y = event.clientY;
  const matrix = svg.getScreenCTM();
  if (!matrix) return;
  const at = point.matrixTransform(matrix.inverse());
  const t = diagramEditor.tool;
  const x = Number(clip((at.x - CO.x) / CO.s, t === 'zone' || t === 'target' ? 1.37 : -1.30, t === 'zone' || t === 'target' ? 9.60 : 12.27).toFixed(2));
  const y = Number(clip((at.y - CO.y) / CO.s, t === 'zone' || t === 'target' ? 0 : -1.65, t === 'zone' || t === 'target' ? COURT_L : 25.55).toFixed(2));
  if (t === 'erase') {
    const dist = (s) => {
      if (s.kind === 'zone') return x >= Math.min(s.x, s.x2) - .25 && x <= Math.max(s.x, s.x2) + .25 && y >= Math.min(s.y, s.y2) - .25 && y <= Math.max(s.y, s.y2) + .25 ? 0 : 99;
      if (s.kind === 'target') return Math.hypot(x - s.x, y - s.y) <= Math.min(3, Math.hypot(s.x2 - s.x, s.y2 - s.y)) + .20 ? 0 : 99;
      if (s.kind === 'player' || s.kind === 'coach') return Math.hypot(x - s.x, y - s.y);
      const vx = s.x2 - s.x, vy = s.y2 - s.y, u = clip(((x - s.x) * vx + (y - s.y) * vy) / (vx * vx + vy * vy || 1), 0, 1);
      return Math.hypot(x - (s.x + u * vx), y - (s.y + u * vy));
    };
    let best = -1, score = 1.05;
    diagramEditor.shapes.forEach((s, i) => { const d = dist(s); if (d < score) { best = i; score = d; } });
    if (best >= 0) { editorUndoCheckpoint(); diagramEditor.shapes.splice(best, 1); renderDiagramEditor(); }
    else toast('Коснитесь ближе к элементу');
    return;
  }
  if (diagramEditor.shapes.length >= 65) { toast('Для одной схемы достаточно 65 элементов'); return; }
  if (t === 'player' || t === 'coach') {
    editorUndoCheckpoint();
    diagramEditor.shapes.push({ kind: t, x, y });
    renderDiagramEditor();
    return;
  }
  if (!diagramEditor.pending) { diagramEditor.pending = { x, y }; renderDiagramEditor(); return; }
  const origin = diagramEditor.pending;
  diagramEditor.pending = null;
  if (Math.hypot(x - origin.x, y - origin.y) < .35) { toast('Укажите вторую точку чуть дальше'); renderDiagramEditor(); return; }
  editorUndoCheckpoint();
  diagramEditor.shapes.push({ kind: t, x: origin.x, y: origin.y, x2: x, y2: y });
  renderDiagramEditor();
}

function finishDiagramEdit(save) {
  if (!diagramEditor) return;

function suggestedStroke(text) {
  const t = (text || '').toLowerCase();
  if (/дет|реб[её]н|малыш|красн\S* мяч|оранжев|зел[её]н\S* мяч/.test(t)) return 'Дети';
  if (/размин/.test(t)) return 'Разминка';
  if (/замин|растяж|восстанов/.test(t)) return 'Заминка';
  if (/пар(?:н|а|ы)|дабл|double/.test(t)) return 'Парная игра';
  if (/при[её]м|return/.test(t)) return 'Приём подачи';
  if (/подач|serve/.test(t)) return 'Подача';
  if (/подход|выход к сетке|обвод|переход/.test(t)) return 'Переход в атаку';
  if (/волле|воллей|с л[её]та|у сетки|см[эе]ш/.test(t)) return 'Игра у сетки';
  if (/защит|контратак|свеч/.test(t)) return 'Защита и контратака';
  if (/форхенд|бэкхенд|бекхенд|forehand|backhand|с отскока|задн(?:яя|ей) лини/.test(t)) return 'Удары с отскока';
  if (/передвижен|ног|footwork/.test(t)) return 'Работа ног';
  if (/тактик|розыгрыш|игров/.test(t)) return 'Тактика и розыгрыши';
  return '';
}

function suggestedGoal(text) {
  const t = (text || '').toLowerCase();
  const patterns = [[/стабил/, 'Стабильность'], [/точн/, 'Точность'], [/контрол/, 'Контроль'], [/глубин/, 'Глубина'], [/сил|мощн/, 'Сила'], [/вращен/, 'Вращение'], [/реакц/, 'Реакция'], [/ног|передвижен/, 'Работа ног'], [/тактик/, 'Тактика']];
  return patterns.filter(([pattern]) => pattern.test(t)).map(([, label]) => label);
}

function draftStudentIds() { return whoAllStudentIds(liveWho(draft.who)); }
function draftIsKids() {
  const ids = draftStudentIds();
  const ages = ids.map(getStudent).filter(Boolean).map((st) => parseInt(st.age, 10)).filter(Number.isFinite);
  return ages.length > 0 && ages.every((n) => n <= 12);
}

function rankedPickerExercises() {
  const kids = draftIsKids();
  const preferred = suggestedStroke(draft.goal) || (kids ? 'Дети' : '');
  const relatedGoals = suggestedGoal(draft.goal);
  const term = picker.query.toLowerCase().trim();
  return allExercises().filter((e) =>
    (picker.stroke === 'Автоподбор' || picker.stroke === 'Все типы' || picker.stroke === e.stroke)
    && (!term || (e.title + ' ' + e.stroke + ' ' + e.brief + ' ' + (e.goals || []).join(' ')).toLowerCase().includes(term))
  ).sort((a, b) => {
    const score = (e) => (picker.section === 'warmup' && e.stroke === 'Разминка' ? 200 : 0) + (picker.section === 'cooldown' && e.stroke === 'Заминка' ? 200 : 0) + (picker.section === 'points' && stageOf(e) === 'game' ? 150 : 0) + (picker.section === 'main' && stageOf(e) !== 'game' ? 20 : 0) + (!['warmup', 'cooldown'].includes(picker.section) && ['Разминка', 'Заминка'].includes(e.stroke) ? -50 : 0) + (e.stroke === 'Дети' && preferred !== 'Дети' ? -120 : 0) + (preferred && e.stroke === preferred ? 100 : 0) + relatedGoals.filter((g) => (e.goals || []).includes(g)).length * 12;
    return score(b) - score(a) || a.title.localeCompare(b.title, 'ru');
  });
}

const NOTE_KEY = 'tennis_coach_note_draft_v1';
const NOTE_NEW = '__new';

function defaultNoteDraft() {
  return {
    id: '',
    who: emptyWho(),
    date: dateISO(),
    time: '',
    notes: '',
    success: '',
    difficulty: '',
    next: '',
    studentNotes: {},
    exercises: []
  };
}
function normNoteRow(row) {
  row = row && typeof row === 'object' ? row : {};
  const sn = {};
  if (row.studentNotes && typeof row.studentNotes === 'object') for (const k of Object.keys(row.studentNotes)) sn[k] = String(row.studentNotes[k] || '');
  return {
    id: String(row.id || ''),
    ...(Array.isArray(row.actualStudentIds) ? {actualStudentIds: [...row.actualStudentIds]} : {}),
    who: row.who ? cleanWho(row.who) : legacyWho(row.targetType, row.targetId),
    date: String(row.date || dateISO()),
    time: /^\d\d:\d\d$/.test(String(row.time || '')) ? String(row.time) : '',
    notes: String(row.notes || ''),
    success: String(row.success || ''),
    difficulty: String(row.difficulty || ''),
    next: String(row.next || ''),
    studentNotes: sn,
    exercises: (Array.isArray(row.exercises) ? row.exercises : []).filter((e) => e && typeof e === 'object' && e.id && e.title).map((e) => ({ ...e, note: String(e.note || '') }))
  };
}
// If a draft write fails, keep the latest fields available for export in this tab.
const unsavedDrafts = new Map();
function readDraftMap(key, strict = false) {
  if (unsavedDrafts.has(key)) return unsavedDrafts.get(key);
  try {
    const value = JSON.parse(localStorage.getItem(storagePrefix + key) || '{}');
    if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('draft');
    return value;
  } catch (err) {
    if (strict) throw err;
    return {};
  }
}
function writeDraftMap(key, value) {
  try {
    localStorage.setItem(storagePrefix + key, JSON.stringify(value));
    unsavedDrafts.delete(key);
    return true;
  } catch (err) {
    unsavedDrafts.set(key, value);
    toast('Черновик доступен только в этой вкладке. Выгрузите копию перед закрытием.');
    return false;
  }
}
function loadNoteDrafts() { return readDraftMap(NOTE_KEY); }
function readNoteDraft(key) {
  const row = loadNoteDrafts()[key || NOTE_NEW];
  return row && typeof row === 'object' ? row : null;
}
function saveNoteDraft(key, fields) {
  const all = loadNoteDrafts();
  const row = normNoteRow(fields);
  const empty = !row.notes.trim() && !row.success.trim() && !row.difficulty.trim() && !row.next.trim() && !Object.values(row.studentNotes).some((v) => v.trim()) && !row.exercises.length && !row.time;
  if (empty && !row.id && !whoCount(row.who) && row.date === dateISO()) delete all[key || NOTE_NEW];
  else all[key || NOTE_NEW] = { ...row, updatedAt: nowISO() };
  return writeDraftMap(NOTE_KEY, all);
}
function clearNoteDraft(key) {
  const all = loadNoteDrafts();
  if (!all[key || NOTE_NEW]) return;
  delete all[key || NOTE_NEW];
  return writeDraftMap(NOTE_KEY, all);
}
function noteFieldsFromForm(form) {
  if (!form) return defaultNoteDraft();
  noteSnotes = snotesFromForm(form, noteSnotes);
  return {
    id: String((form.elements.id && form.elements.id.value) || ''),
    who: whoGet('note'),
    ...(form.querySelector && form.querySelector('#note-attendance .att') ? {actualStudentIds: uniq([...whoGet('note').studentIds.filter(getStudent), ...checkedAttendance(new FormData(form))])} : {}),
    studentNotes: { ...noteSnotes },
    date: String((form.elements.date && form.elements.date.value) || dateISO()),
    time: String((form.elements.time && form.elements.time.value) || ''),
    exercises: syncNoteEx(form).map((x) => ({ ...x.item, note: x.note })),
    notes: String((form.elements.notes && form.elements.notes.value) || ''),
    success: String((form.elements.success && form.elements.success.value) || ''),
    difficulty: String((form.elements.difficulty && form.elements.difficulty.value) || ''),
    next: String((form.elements.next && form.elements.next.value) || '')
  };
}
function queueNoteDraft(form) {
  if (!form) return;
  const fields = noteFieldsFromForm(form);
  clearTimeout(queueNoteDraft.timer);
  if (!saveNoteDraft(fields.id || NOTE_NEW, fields)) return;
  queueNoteDraft.timer = setTimeout(() => {
    const hint = document.getElementById('note-draft-hint');
    if (!hint) return;
    hint.classList.add('is-on');
    clearTimeout(queueNoteDraft.hintTimer);
    queueNoteDraft.hintTimer = setTimeout(() => { hint.classList.remove('is-on'); }, 1600);
  }, 400);
}
function openNoteForm(opts) {
  opts = opts || {};
  if (!store.students.length && !store.groups.length) {
    toast('Сначала добавьте ученика или группу');
    return;
  }
  let data;
  whoExtraCoaches = [];
  if (opts.id) {
    const p = getPlan(opts.id);
    if (!p || !isNotePlan(p)) return;
    whoExtraCoaches = (p.coaches || []).map((c) => ({ ...c }));
    const saved = readNoteDraft(p.id);
    data = saved ? { ...normNoteRow(saved), id: p.id } : {
      id: p.id,
      who: whoOfPlan(p),
      date: p.date || dateISO(),
      time: p.time || '',
      exercises: planExercises(p),
      notes: p.notes || '',
      success: (p.summary && p.summary.success) || '',
      difficulty: (p.summary && p.summary.difficulty) || '',
      next: (p.summary && p.summary.next) || '',
      studentNotes: { ...(p.studentNotes || {}) }
    };
  } else {
    /* Новая запись всегда начинается с пустой формы. Незаконченный черновик (например, после перезагрузки)
       возвращается, только если форму открыли для того же ученика или группы. */
    const saved = opts.prefill ? null : readNoteDraft(NOTE_NEW);
    const row = saved ? normNoteRow(saved) : null;
