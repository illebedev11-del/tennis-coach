/* Compact in-plan exercise picker: keeps approved Bordeaux / ivory styling. */
/* Compact exercise menu: anchored to +, no layout shift */
.plan-add-btn{min-width:43px;min-height:43px;padding:9px 11px;flex-shrink:0}
.plan-section,.section-card{position:relative;max-width:100%;min-width:0}
.plan-menu-anchor{position:static;display:inline-flex;flex-shrink:0}
.plan-picker{position:absolute;top:calc(100% + 7px);right:0;left:auto;max-width:100%;width:min(350px,100%);max-height:min(370px,54vh);overflow-y:auto;overscroll-behavior:contain;background:#FFFEFB;border:1px solid #DCCCD0;border-radius:13px;padding:5px 10px 8px;z-index:12;box-shadow:0 12px 32px rgba(61,41,45,.14)}
.plan-picker.above{top:auto;bottom:calc(100% + 7px)}
.plan-picker-label{font-size:11px;color:#827B77;font-weight:650;margin:9px 0 3px;padding:0 3px}
.plan-suggestion{width:100%;display:flex;gap:9px;align-items:center;text-align:left;padding:10px 4px;border:0;border-top:1px solid #EFE7E3;background:transparent;color:#713D4A;cursor:pointer;border-radius:5px}
.plan-suggestion:hover,.plan-suggestion:focus-visible{background:#F5EFF0}
.plan-suggestion:first-of-type{border-top:0}
.plan-suggestion-body{flex:1;min-width:0}
.plan-suggestion-title{color:#713D4A;font-weight:650;font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.plan-suggestion-sub{color:#827B77;font-size:11px;margin-top:4px;line-height:1.35}
.plan-suggestion-icon{color:#713D4A;flex-shrink:0}
.plan-picker-footer{width:100%;background:transparent;color:#713D4A;border:0;border-top:1px solid #E9DFDA;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 4px 6px;font-size:12px;font-weight:700;text-align:left;cursor:pointer}
.plan-picker-tools{padding:8px 2px;display:grid;gap:7px}
.plan-picker-tools .input,.plan-picker-tools .select{min-height:44px;font-size:16px}
.plan-picker-empty{font-size:12px;color:#827B77;padding:12px 4px}
@media(max-width:420px){.plan-picker{width:min(330px,100%);max-height:51vh}.plan-suggestion-title{font-size:12px}}

/* Рабочий редактор схем: всегда вторичен по отношению к карточке упражнения. */
.diagram-edit-layout{display:grid;grid-template-columns:minmax(190px,1fr) minmax(220px,1fr);gap:18px;align-items:start}
.diagram-editor-board{padding:14px;background:var(--sage-soft);border-radius:15px;display:grid;place-items:center;min-width:0}
.diagram-editor-board svg{display:block;max-width:100%;width:min(100%,255px);height:auto;touch-action:manipulation;cursor:crosshair;user-select:none;-webkit-user-select:none}
.diagram-editor-board svg .diagram-shape{pointer-events:none}
.diagram-tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:9px 0}
.diagram-tool{border:1px solid #DCCFD0;background:var(--paper);color:var(--wine);min-height:43px;border-radius:10px;font-size:12px;font-weight:650;padding:7px 9px;text-align:center;white-space:normal}
.diagram-tool.active{border-color:var(--wine);background:var(--wine);color:#FFFDF9}
.diagram-help{font-size:12px;line-height:1.55;color:var(--muted);padding:11px 12px;background:var(--paper);border-radius:11px;min-height:54px}
.diagram-editor-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);line-height:1.5}
.diagram-editor-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.diagram-action-bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}

/* v4: smoother motion + on-court UX. One shared 240ms easing. */
:root{--motion:280ms;--motion-open:320ms;--motion-close:260ms;--ease:cubic-bezier(.32,.72,0,1)}
html,body{-webkit-tap-highlight-color:transparent}

.fold{overflow-anchor:none;position:relative}
.fold.is-animating{overflow:hidden!important}
.fold-panel{display:block!important;grid-template-rows:none!important;height:0!important;opacity:1;overflow:hidden;transition:none!important}
.fold.is-open>.fold-panel{height:auto!important;opacity:1}
.fold.is-animating>.fold-panel{height:var(--fold-h,auto)!important;transition:none!important}
.fold-panel>.fold-inner{min-height:0;overflow:hidden;contain:layout paint style}
.fold-chevron{transition:transform var(--motion) var(--ease)}
.fold{transition:border-color var(--motion) var(--ease)}
.main.view-enter{animation:viewIn var(--motion) var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.veil{opacity:0;backdrop-filter:none;-webkit-backdrop-filter:none;transition:opacity var(--motion) var(--ease)}
.veil.is-visible{opacity:1}
.modal{transform:translateY(12px);opacity:.97;transition:transform var(--motion) var(--ease),opacity var(--motion) var(--ease)}
.veil.is-visible .modal{transform:none;opacity:1}
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));transform:none;width:auto;max-width:360px;margin:0 auto;background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.4;z-index:80;text-align:center;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(20,12,12,.18);animation:toastIn var(--motion) var(--ease)}
.toast.has-action{pointer-events:auto}
.toast-undo{border:0;background:transparent;color:var(--wine-chip,#D4A0AA);font:inherit;font-weight:700;min-height:44px;padding:0 6px;cursor:pointer;flex-shrink:0}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.has-sticky-cta .toast{bottom:calc(156px + env(safe-area-inset-bottom))}
.button,.icon-button,.fold-head,.nav-item,.exercise-card,.student-card,.mini-list-card,.plan-suggestion-toggle,.plan-add-btn,.tpl-chip,.mini-delete,.plan-suggestion-body,.plan-picker-done,.plan-picker-footer{
  transition:transform 160ms var(--ease),background-color 160ms var(--ease),color 160ms var(--ease),filter 160ms var(--ease)}
.button:active,.icon-button:active,.exercise-card:active,.student-card:active,.mini-list-card:active,.tpl-chip:active,.fold-head:active,.nav-item:active,.plan-add-btn:active,.plan-suggestion-toggle:active,.mini-delete:active,.plan-suggestion-body:active,.plan-picker-done:active,.plan-picker-footer:active{transform:scale(.98)}
@media (hover:none){
  .button:hover{background:var(--wine);color:#fff}

  .plan-suggestion-body:hover{color:inherit}

}
.fold,.section-head{margin-bottom:16px}

.form-grid{gap:16px}
.plan-item,.plan-item:first-of-type{padding:12px 0}
button.mini-list-card,.mini-list-card{-webkit-appearance:none;appearance:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:transparent;background-color:transparent;padding:14px 0 16px;align-items:center;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
.fold button.mini-list-card,.fold .mini-list-card{border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;background:transparent}
.fold button.mini-list-card:last-child,.fold .mini-list-card:last-child,.mini-list-card:last-child{border-bottom:0}
button.mini-list-card:focus:not(:focus-visible){outline:none}
.mini-list-go{flex-shrink:0;align-self:center;font-size:13px;font-weight:650;color:var(--wine);min-height:44px;display:inline-flex;align-items:center;padding:0 4px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .button:active,.icon-button:active,.exercise-card:active,.student-card:active,.mini-list-card:active,.tpl-chip:active,.fold-head:active,.nav-item:active,.plan-add-btn:active,.plan-suggestion-toggle:active,.mini-delete:active,.plan-suggestion-body:active,.plan-picker-done:active,.plan-picker-footer:active{transform:none!important}

/* v5: compositor-first fold motion, iOS easing, no layout-on-every-frame */
#exerciseList,.main,html{overflow-anchor:none}
html,body,.main,.modal{-webkit-overflow-scrolling:touch}
.diagram-pending{background:var(--green-soft)}
.fold:not(.is-open):not(.is-animating)>.fold-panel>.fold-inner{content-visibility:hidden}
.fold-spacer{pointer-events:none;contain:strict;flex-shrink:0}

/* v6: large court, Повторить, report draft */
.court-zoom{position:fixed;inset:0;z-index:85;background:rgba(18,16,16,.94);display:flex;align-items:center;justify-content:center;padding:max(56px,calc(12px + env(safe-area-inset-top))) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));-webkit-tap-highlight-color:transparent}

.court-zoom-stage{width:min(100%,440px);height:min(calc(100dvh - 96px),860px);max-height:100%;background:var(--green-soft);border-radius:var(--radius-lg);padding:10px;display:flex;align-items:center;justify-content:center;box-shadow:none}
.court-zoom-stage svg{width:100%;height:100%;max-height:100%;display:block}
.court-zoom-close{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:44px;height:44px;border:0;border-radius:11px;background:var(--paper);color:var(--ink);display:grid;place-items:center;z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.diagram-thumb[data-action="zoom-court"],.picker-preview-court[data-action="zoom-court"],.plan-drill-court[data-action="zoom-court"],.court-zoom-src{cursor:zoom-in;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.court-zoom-src{border:0;background:transparent;padding:0;display:block;width:min(100%,250px);margin:0 auto}
.court-zoom-src svg{width:min(100%,250px);max-height:475px;display:block}
.repeat-btn{flex-shrink:0;min-height:44px;padding:8px 10px;border:0;background:transparent;color:var(--wine);font:inherit;font-size:13px;font-weight:650;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.mini-list-card{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.mini-list-main{-webkit-appearance:none;appearance:none;flex:1;min-width:0;min-height:44px;margin:0;padding:0;border:0;background:transparent;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center}
.mini-list-main .mini-list-copy{flex:1;min-width:0}
.history-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.draft-hint{display:block;font-size:12px;color:var(--muted);margin:8px 0 0;min-height:18px;line-height:18px;opacity:0;transition:opacity 280ms var(--ease,ease);text-align:center;pointer-events:none}
.draft-hint.is-on{opacity:1}
@media(prefers-reduced-motion:reduce){.draft-hint{transition:none}}

/* v7: auto-growing text fields, wrapping goals, clear selected template */
textarea.textarea-auto{
  min-height:48px;
  resize:none;
  overflow:hidden;
  overflow-x:hidden;
  overflow-y:hidden;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
}
textarea.textarea-auto.textarea-auto-lg{min-height:96px}
.goal-text,.mini-list-copy p,.history-entry p,.student-card p{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  word-break:break-word;
  overflow:visible;
  text-overflow:clip;
  max-width:100%;
  min-width:0;
}
.mini-list-copy,.mini-list-main{min-width:0;max-width:100%}
.tpl-chip.is-on{
  background:var(--wine);
  color:#FFFDF9;
}
@media(prefers-color-scheme:dark){
  .tpl-chip.is-on{background:var(--wine);color:#FFF8F4}
}

/* v12: even chips without leftover checkbox space; freeform session notes */
.goal-grid{align-items:center}
.goal-chip{
  position:relative;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:0;
  flex:0 0 auto;
  width:auto;
  max-width:none;
  min-height:36px;
  padding:8px 14px;
  line-height:1.2;
  text-align:center;
  white-space:nowrap;
  overflow-wrap:normal;
  word-break:normal;
}
.goal-chip input{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  clip-path:inset(50%);
  border:0;
  opacity:0;
  pointer-events:none;
  appearance:none;
  -webkit-appearance:none;
}
.goal-chip span{
  display:block;
  white-space:nowrap;
  overflow-wrap:normal;
  word-break:normal;
  text-align:center;
  max-width:none;
}
.tpl-chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  width:auto;
  max-width:100%;
  text-align:center;
  white-space:nowrap;
  overflow-wrap:normal;
  word-break:normal;
  line-height:1.2;
}
.form-grid .goal-chip,
.field label.goal-chip,
.goal-fieldset .goal-chip,
.goal-chip{
  min-width:max-content;

  flex:0 0 auto;
}
.student-actions .button{flex:1 1 auto;min-width:auto}
.section-head .train-note-action{flex:0 0 auto;width:auto;max-width:100%}
.section-head .train-note-action .button{flex:0 0 auto;width:auto}

/* v13: several coaches and students in one session */
.who{display:flex;flex-direction:column;gap:8px;min-width:0}
.who .fold{margin:0}
.who-selected{display:flex;flex-wrap:wrap;gap:8px;min-width:0}

.tpl-chip.who-add{background:var(--wine-soft);color:var(--wine)}

.snote-list{display:flex;flex-direction:column;gap:12px}

.person-notes p{margin:0}.person-notes p+p{margin-top:8px}.person-notes b{color:var(--wine);font-weight:650}

/* v15: saved sessions by day, separate cards */
.sess-tools{display:flex;justify-content:flex-start;margin:0 0 6px}
.select.sess-filter{width:auto;max-width:100%;min-height:36px;padding:6px 34px 6px 12px;font-size:13px;border-radius:999px;background-position:right 12px center}
.sess-day{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px;font-size:13px;font-weight:650;color:var(--wine)}
.sess-list>.sess-day:first-child,.fold-inner>.sess-day:first-child,.sess-month .fold-inner>.sess-day:first-child{margin-top:4px}

.sess-card{background:var(--ivory);border-radius:12px;padding:12px 14px 6px;margin:0 0 8px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .18s cubic-bezier(.32,.72,0,1),background-color .18s}

.fold .fold .sess-card{background:var(--paper)}
.sess-card b{display:block;font-size:14px;line-height:1.35;color:var(--wine);font-weight:650}
.sess-text{margin:5px 0 0;font-size:13px;line-height:1.45;color:var(--graphite);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sess-who{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.4}
.sess-card .report-line{margin-top:6px}
.sess-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}

@media(prefers-reduced-motion:reduce){.sess-card{transition:none}.sess-card:active{transform:none}}

/* v16: examples in fields are real hints — they fade out as soon as the field is tapped */
input::placeholder,textarea::placeholder{transition:color .18s ease}
input:focus::placeholder,textarea:focus::placeholder{color:transparent}

/* v17: native-style tab bar — flush to the bottom, solid, background runs under the home indicator */
.nav{left:0;right:0;bottom:0;padding:0;background:var(--ivory);border-top:1px solid var(--line);box-shadow:none;pointer-events:auto;-webkit-backdrop-filter:none;backdrop-filter:none}
.nav-inner{max-width:1000px;margin:0 auto;border:0;border-radius:0;box-shadow:none;background:transparent;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.nav-item{padding:9px 4px 7px;gap:4px}
.sticky-cta{bottom:calc(62px + env(safe-area-inset-bottom))}
.toast{bottom:calc(76px + env(safe-area-inset-bottom))}

асть в саму заднюю линию.","equipment":"Корзина мячей; 2–4 плоских маркера."},{"id":"fh05","title":"Форхенд в движении","stroke":"Форхенд","goals":["Работа ног","Контроль"],"format":"С корзиной","level":"Средний","minutes":15,"brief":"Передвижение к широкому форхенду и восстановление позиции.","steps":"После сплит-степа сделать первый шаг к широкому мячу, выполнить контролируемый форхенд и вернуться в рабочую позицию. 3 серии по 6 мячей с паузой на восстановление.","cue":"Первый шаг в сторону мяча, устойчивый контакт, восстановление без скрещивания при потере равновесия.","easier":"Подавать мячи медленнее и менее широко.","harder":"Добавить непредсказуемое чередование широкого и центрального мяча.","diagram":"movement","setup":"Игрок начинает за задней линией; тренер с противоположной стороны подаёт мячи в форхендовую сторону. Без целевых зон.","metric":"Сколько из 18 мячей сыграно с сохранением баланса и возвращением в позицию до следующего наброса.","errors":"Поздний старт; после удара игрок остаётся на месте.","equipment":"Корзина мячей."},{"id":"fh06","title":"Форхенд с ускорением","stroke":"Форхенд","goals":["Сила","Контроль"],"format":"С корзиной","level":"Продвинутый","minutes":12,"brief":"Ускорение третьего форхенда при сохранении попадания в крупную игровую область.","steps":"Два нейтральных форхенда, третий — с ускорением в заданную область. Повторить 10 троек; скорость повышать лишь до уровня, где техника остаётся стабильной.","cue":"Ускорение за счёт последовательности движений и активного шага, без зажатой кисти.","easier":"Ускорять каждый четвёртый мяч и расширить зону.","harder":"После ускорения продолжать розыгрыш на счёт.","diagram":"attack","setup":"Игрок за задней линией. На стороне партнёра обозначить большую безопасную область для ускоряемого мяча.","metric":"Успешные третьи удары с ускорением и попаданием в область: __/10.","errors":"Преждевременное форсирование; потеря баланса при ускорении.","equipment":"Мячи; маркеры целевой области."},{"id" теп перед ударом тренера и контроль центра тяжести.","easier":"Замедлить подачу и сократить дистанцию.","harder":"Добавить третий вариант по короткому мячу.","diagram":"footwork","setup":"Игрок за задней линией, тренер подаёт влево или вправо без предварительного сигнала.","metric":"Удары с своевременным первым шагом и возвратом в позицию из 12 попыток.","errors":"Ожидание на прямых ногах; старт после отскока мяча.","equipment":"Корзина мячей."},{"id":"ft02","title":"Короткий мяч и возврат","stroke":"Передвижение","goals":["Работа ног","Контроль"],"format":"С корзиной","level":"Средний","minutes":12,"brief":"Переход вперёд и контролируемое возвращение.","steps":"После глубокого мяча игрок атакует короткий и занимает правильную позицию для следующего удара.","cue":"Шаги под мяч, контроль торможения.","easier":"Упростить последовательность до двух мячей.","harder":"Добавить решение: остаться у сетки или вернуться.","diagram":"shortBall","setup":"Игрок у задней линии, тренер чередует глубокий и короткий наброс.","metric":"Удачные подходы к короткому мячу и контролируемое последующее действие из 10 розыгрышей.","errors":"Выход к короткому мячу без торможения; неверный выбор остаться или вернуться.","equipment":"Мячи."},{"id":"tx01","title":"Кросс — кросс — линия","stroke":"Тактика","goals":["Тактика","Контроль"],"format":"С партнёром","level":"Средний","minutes":15,"brief":"Выстроить атаку через изменение направления.","steps":"Два стабильных кросса, затем перевод по линии при подходящем мяче. Повторить 8–10 розыгрышей.","cue":"Терпение, качество подготовительных ударов.","easier":"Тренер заранее подаёт удобный мяч для перевода.","harder":"Разрешить перевод только после глубокого удара.","diagram":"line","setup":"Два игрока за задними линиями, без зон: тренируем последовательность и выбор момента.","metric":"Осмысленные переводы по линии из 10 розыгрышей после двух кроссов.","errors":"Перевод по линии при плохом балансе; игнорирование качества второго кросса.","equipment":"Мячи; партнёр."},{"id":"tx02","title":"Игра в глубину по центру","stroke":"Тактика","goals":["Стабильность","Тактика"],"format":"Игровое","level":"Любой","minutes":15,"brief":"Снижать риск и удерживать нейтральный розыгрыш.","steps":"Розыгрыш на счёт: дополнительное очко за серию из 6 глубоких мячей в центральный коридор.","cue":"Выбор безопасного направления и высоты.","easier":"Увеличить ширину коридора.","harder":"Сузить коридор или увеличить длину серии.","diagram":"center","setup":"Отметить безопасный центральный коридор за линией подачи.","metric":"Число серий по 6 глубоких ударов в коридор за 10 минут.","errors":"Прицеливание в линии; излишняя скорость нейтрального мяча.","equipment":"Мячи; маркеры коридора."},{"id":"tx03","title":"Укороченный после глубины","stroke":"Тактика","goals":["Тактика","Точность"],"format":"С партнёром","level":"Продвинутый","minutes":15,"brief":"Создать пространство коротким ударом после глубокого.","steps":"Два глубоких удара с последующим укороченным на подходящем мяче.","cue":"Маскировка намерения и выбор момента.","easier":"Выполнять короткий удар с наброса.","harder":"Играть очко после укороченного.","diagram":"drop","setup":"Два игрока за задней линией; после глубоких мячей один выполняет укороченный. Зону не добавляем, если точное попадание не задано.","metric":"Укороченные, после которых соперник не успевает комфортно атаковать, из 10 попыток.","errors":"Укороченный при невыгодной позиции; заранее читаемая подготовка.","equipment":"Мячи."},{"id":"tx04","title":"Свеча над игроком у сетки","stroke":"Тактика","goals":["Точность","Тактика"],"format":"С тренером","level":"Средний","minutes":12,"brief":"Выбрать правильную траекторию защитной свечи.","steps":"Тренер занимает позицию у сетки. Игрок выполняет свечу в глубину с запасом по высоте.","cue":"Не форсировать из неустойчивого положения.","easier":"Увеличить целевую зону.","harder":"Тренер меняет позицию у сетки.","diagram":"lob","setup":"Тренер у сетки, ученик за задней линией; без фиксированной зоны, если задача — выбрать высоту и глубину свечи.","metric":"Свечи, перелетевшие соперника и приземлившиеся в корте, из 10 попыток.","errors":"Недостаточная высота над игроком у сетки; плоский удар в спешке.","equipment":"Мячи."},{"id":"fh07","title":"20 форхендов кроссом в зону","stroke":"Форхенд","goals":["Стабильность","Точность"],"format":"С партнёром","level":"Средний","minutes":15,"brief":"20 форхендов кроссом в заранее отмеченный квадрат: стабильность плюс точность.","steps":"Начать розыгрыш удобным мячом. Засчитывать только форхенды, попавшие в выделенную область. Цель — серия из 20 засчитанных попаданий без ошибки; после промаха начать новую попытку.","cue":"Играть с запасом от границ квадрата и сетки, держать устойчивый ритм.","easier":"Сначала 10 подряд или увеличить квадрат.","harder":"Уменьшить квадрат или добавить контроль темпа.","diagram":"crossMirror","zoneMode":"on","setup":"Два игрока на диагонали за задними линиями; на противоположной половине выделен один достаточно крупный квадрат.","metric":"Максимальное число подряд засчитанных попаданий в квадрат; рабочая цель — 20.","errors":"Попытка целиться в край зоны; увеличение силы вместо точности.","equipment":"Мячи; партнёр; плоские маркеры зоны."},{"id":"wu01","title":"Динамическая разминка","stroke":"Разминка","goals":["Работа ног","Реакция"],"format":"Самостоятельно","level":"Любой","minutes":8,"diagram":"dynamicWarmup","zoneMode":"off","brief":"Подготовить тело к занятию: плавные перемещения, смена направления и работа рук без гонки за темпом.","setup":"Свободное пространство за задней линией или вдоль боковой. Без корзин и целевых зон. Мячи не обязательны.","steps":"Начать с лёгкого шага по периметру корта 1–2 круга. Затем серии: боковые приставные шаги, выпады с поворотом плеч, имитация удара без мяча, короткие ускорения на 4–6 метров и спокойный возврат. Каждое движение 30–45 секунд, без резкого старта. Закончить лёгким встряхиванием рук и ног.","metric":"Игрок двигается свободно, дыхание ровное, нет скованности в плечах и бёдрах перед первой работой с мячом.","cue":"Держать колени мягкими, смотреть вперёд, не торопить амплитуду в первой минуте.","errors":"Сразу ускоряться как на челноке; начинать с растяжки стоя на прямых ногах; забывать про руку и плечо.","easier":"Уменьшить амплитуду и убрать ускорения, оставить только шаг, приставные и имитацию удара.","harder":"Добавить смену направления по сигналу тренера и лёгкую работу с двумя мячами у корпуса.","equipment":"Без инвентаря; по желанию — два мяча."},{"id":"wu02","title":"Мини-теннис с линии подачи","stroke":"Разминка","goals":["Контроль","Реакция"],"format":"С партнёром","level":"Любой","minutes":10,"diagram":"miniTennis","zoneMode":"on","brief":"Короткий розыгрыш с линии подачи: почувствовать контакт и контроль, не набирая полную силу.","setup":"Оба игрока стоят у своих линий подачи. Игра только в квадраты подачи. Сетку не обходить, целевых конусов не ставить, если игрокам и так ясно поле.","steps":"Ввести мяч мягкой подачей с руки. Играть короткими ударами в пределах квадратов подачи, чередуя форхенд и бэкхенд. Держать серию 8–12 ударов, затем сменить того, кто вводит мяч. Сделать 4–6 серий, постепенно чуть увеличивая длину мяча, но не выходя за линию подачи.","metric":"Несколько спокойных серий подряд без спешки; мяч перелетает сетку с запасом и остаётся в квадратах.","cue":"Короткий замах, встреча мяча впереди, мягкие ноги. Не «поддевать» и не ускорять рано.","errors":"Слишком широкий замах; отход назад к задней линии; удар вниз в сетку из-за жёсткой кисти.","easier":"Разрешить играть во всю переднюю половину корта и замедлить темп.","harder":"Играть только в один квадрат или вводить мяч с отскока ниже.","equipment":"Мячи; партнёр."},{"id":"wu03","title":"Волей в волей у сетки","stroke":"Разминка","goals":["Контроль","Реакция"],"format":"С партнёром","level":"Любой","minutes":8,"diagram":"volleyToVolley","zoneMode":"off","brief":"Короткая серия ударов с лёта у сетки, чтобы включить руки, стопы и чувство дистанции.","setup":"Оба игрока в 2–3 метрах от сетки, чуть шире центральной линии. Без зон. Мяч вводят коротким набросом.","steps":"Начать медленным обменом по центру. Держать мяч в воздухе сериями по 8–10 ударов. Затем чуть смещаться влево и вправо, сохраняя контакт впереди себя. Если мяч падает — спокойно начать новую серию. 4–5 серий достаточно.","metric":"Серии идут без напряжения, игроки успевают к мячу и не отходят далеко от сетки.","cue":"Короткий удар от плеча, кисть стабильна, шаг к мячу небольшой и своевременный.","errors":"Широкий замах как с задней линии; стоять на прямых ногах; пятиться от сетки после каждого удара.","easier":"Разрешить один отскок или играть ближе, почти «ловя» мяч.","harder":"Чередовать направление — чуть левее и правее — или ускорить темп на последней серии.","equipment":"Мячи; партнёр или тренер."},{"id":"wu04","title":"Совместный розыгрыш с задней линии","stroke":"Разминка","goals":["Стабильность","Контроль"],"format":"С партнёром","level":"Любой","minutes":10,"diagram":"center","zoneMode":"off","brief":"Спокойный розыгрыш с задних линий: ввести ритм и длину мяча, не превращая разминку в борьбу.","setup":"Игроки примерно в метре за задними линиями, ближе к центру. Без конусов и узких целей — задача в ритме и контроле.","steps":"Ввести мяч удобной подачей с руки. Играть в середину корта или мягким кроссом, наращивая серию: 8, 12, затем 16 ударов. Темп средний, запас над сеткой обязателен. При ошибке начать отсчёт заново без комментариев о счёте. 5–6 попыток.","metric":"Появляется устойчивая серия в комфортном темпе; мяч регулярно долетает за линию подачи.","cue":"Ранняя подготовка, спокойный ритм ног, не спешить с ускорением третьего-четвёртого мяча.","errors":"Сразу бить сильно; стоять внутри корта слишком близко к задней линии; обрывать серию, чтобы «проверить» удар.","easier":"Играть только в большую центральную зону и начать с серий по 6 ударов.","harder":"После устойчивой серии добавить лёгкую смену направления, не повышая силу.","equipment":"Мячи; партнёр."},{"id":"wu05","title":"Разминочные подачи","stroke":"Разминка","goals":["Стабильность","Вращение"],"format":"Самостоятельно","level":"Любой","minutes":8,"diagram":"serve","zoneMode":"off","brief":"Вывести подачу в рабочий ритм: сначала движение и попадание, затем привычные направления.","setup":"Корзина или несколько мячей у задней линии. Начинать с удобного квадрата. Целевые зоны на старте не нужны — достаточно самого квадрата подачи.","steps":"Сделать 6–8 подач только в движение, без установки на силу, с увеличенным запасом над сеткой. Затем 8–10 вторых подач с вращением в удобный квадрат. После этого по 3–4 подачи в Т и широко, всё ещё без максимальной скорости. Закончить 4 спокойными первыми подачами в выбранном направлении.","metric":"Движение свободно, мяч стабильно перелетает сетку; к концу блока игрок готов подавать в занятии, не «нащупывая» жест.","cue":"Сначала ритм подброса и проводки, потом направление. Не начинать с самой быстрой первой подачи.","errors":"Сразу подавать на силу; сбитый подброс; короткая проводка и удар «вниз» в сетку.","easier":"Подавать только вторые подачи и увеличить запас над сеткой.","harder":"Добавить чередование квадратов и по одной подаче в каждое направление, сохраняя тот же ритм.","equipment":"Корзина или 10–15 мячей."}];

const plural = (n, one, few, many) => {
  const abs = Math.abs(n) % 100, d = abs % 10;
  if (abs > 10 && abs < 20) return many;
  if (d === 1) return one;
  if (d >= 2 && d <= 4) return few;
  return many;

/* Переход на новую библиотеку: правки старых встроенных упражнений сохраняются как «свои», старые типы переименовываются. */
function migrateLibrary(customExercises, exerciseOverrides, diagramOverrides) {
  const legacyById = Object.fromEntries(LEGACY_SEED.map((e) => [e.id, e]));
  const customIds = new Set(customExercises.map((e) => e.id));
  for (const id of uniq([...Object.keys(exerciseOverrides), ...Object.keys(diagramOverrides)])) {
    if (seedById[id] || !legacyById[id]) continue;
    const ov = exerciseOverrides[id] && typeof exerciseOverrides[id] === 'object' ? exerciseOverrides[id] : null;
    if (!customIds.has(id) && (ov || Array.isArray(diagramOverrides[id]))) {
      customExercises.push({ ...legacyById[id], ...(ov || {}), id });
      customIds.add(id);
    }
    delete exerciseOverrides[id];
  }
  for (const e of customExercises) if (STROKE_MIGRATION[e.stroke]) e.stroke = STROKE_MIGRATION[e.stroke];
  for (const ov of Object.values(exerciseOverrides)) if (ov && STROKE_MIGRATION[ov.stroke]) ov.stroke = STROKE_MIGRATION[ov.stroke];
}

function handSwitchHTML() {
  const current = contextHand();
  const autoHint = (() => {
    if (schemeContext.source === 'plan') {
      const t = targetOfPlan(getPlan(schemeContext.planId));
      if (t.type === 'group' || t.members.length > 1) {
        const g = t.type === 'group';
        const lefts = t.members.filter((s) => s.hand === 'left').length;
        const rights = t.members.length - lefts;
        if (lefts && rights) return (g ? 'В группе' : 'Среди учеников') + ' есть и правши, и левши — по умолчанию схема для правши.';

        return g ? 'Группа играет правой.' : 'Все ученики играют правой.';
      }
      if (!t.student && t.members.length === 1) t.student = t.members[0];
      if (t.student) return t.student.hand === 'left'

      if (s) return s.hand === 'left'

        : `${displayName(s)} играет правой.`;
    }

  })();

}

function diagramTap(event) {
  if (!diagramEditor) return;
  const svg = event.target.closest('svg[data-action="diagram-tap"]');
  if (!svg) return;
  const point = svg.createSVGPoint();
  point.x = event.clientX;
  point.y = event.clientY;
  const matrix = svg.getScreenCTM();
  if (!matrix) return;
  const at = point.matrixTransform(matrix.inverse());
  const t = diagramEditor.tool;
  const x = Number(clip((at.x - CO.x) / CO.s, t === 'zone' || t === 'target' ? 1.37 : -1.30, t === 'zone' || t === 'target' ? 9.60 : 12.27).toFixed(2));
  const y = Number(clip((at.y - CO.y) / CO.s, t === 'zone' || t === 'target' ? 0 : -1.65, t === 'zone' || t === 'target' ? COURT_L : 25.55).toFixed(2));
  if (t === 'erase') {
    const dist = (s) => {
      if (s.kind === 'zone') return x >= Math.min(s.x, s.x2) - .25 && x <= Math.max(s.x, s.x2) + .25 && y >= Math.min(s.y, s.y2) - .25 && y <= Math.max(s.y, s.y2) + .25 ? 0 : 99;
      if (s.kind === 'target') return Math.hypot(x - s.x, y - s.y) <= Math.min(3, Math.hypot(s.x2 - s.x, s.y2 - s.y)) + .20 ? 0 : 99;
      if (s.kind === 'player' || s.kind === 'coach') return Math.hypot(x - s.x, y - s.y);
      const vx = s.x2 - s.x, vy = s.y2 - s.y, u = clip(((x - s.x) * vx + (y - s.y) * vy) / (vx * vx + vy * vy || 1), 0, 1);
      return Math.hypot(x - (s.x + u * vx), y - (s.y + u * vy));
    };
    let best = -1, score = 1.05;
    diagramEditor.shapes.forEach((s, i) => { const d = dist(s); if (d < score) { best = i; score = d; } });
    if (best >= 0) { editorUndoCheckpoint(); diagramEditor.shapes.splice(best, 1); renderDiagramEditor(); }
    else toast('Коснитесь ближе к элементу');
    return;
  }
  if (diagramEditor.shapes.length >= 65) { toast('Для одной схемы достаточно 65 элементов'); return; }
  if (t === 'player' || t === 'coach') {
    editorUndoCheckpoint();
    diagramEditor.shapes.push({ kind: t, x, y });
    renderDiagramEditor();
    return;
  }
  if (!diagramEditor.pending) { diagramEditor.pending = { x, y }; renderDiagramEditor(); return; }
  const origin = diagramEditor.pending;
  diagramEditor.pending = null;
  if (Math.hypot(x - origin.x, y - origin.y) < .35) { toast('Укажите вторую точку чуть дальше'); renderDiagramEditor(); return; }
  editorUndoCheckpoint();
  diagramEditor.shapes.push({ kind: t, x: origin.x, y: origin.y, x2: x, y2: y });
  renderDiagramEditor();
}

function finishDiagramEdit(save) {
  if (!diagramEditor) return;
  const id = diagramEditor.id;
  if (save) {
    const e = getEx(id);
    const shapes = clone(diagramEditor.shapes);
    if (JSON.stringify(shapes) === JSON.stringify(seedDiagramShapes(e))) delete store.diagramOverrides[id];
    else store.diagramOverrides[id] = shapes;
    persist();
  }
  diagramEditor = null;
  openExercise(id);
  if (save) toast('Схема сохранена');
}

function autosizeArea(node) {
  if (!node || node.tagName !== 'TEXTAREA' || !node.classList.contains('textarea-auto')) return;
  const min = parseFloat(window.getComputedStyle(node).minHeight) || 48;
  const prev = node.getBoundingClientRect().height;
  node.style.height = 'auto';
  const next = Math.max(min, node.scrollHeight);
  if (reduceMotion() || prev < 8 || Math.abs(next - prev) < 1) {
    node.style.transition = '';
    node.style.height = next + 'px';
    return;
  }
  node.style.transition = 'none';
  node.style.height = prev + 'px';
  node.offsetHeight;
  node.style.transition = 'height 160ms ' + (typeof FOLD_EASE === 'string' ? FOLD_EASE : 'cubic-bezier(.32,.72,0,1)');
  node.style.height = next + 'px';
}
function autosizeAreas(root) {
  const scope = root && root.querySelectorAll ? root : document;
  scope.querySelectorAll('textarea.textarea-auto').forEach(autosizeArea);

function hydrateDiagrams(root) {
  const nodes = [...(root || document).querySelectorAll('.diagram-pending[data-diagram-id]')];
  let i = 0;
  const step = (deadline) => {
    const budget = (deadline && typeof deadline.timeRemaining === 'function')
      ? Math.max(1, Math.min(4, Math.floor((deadline.timeRemaining() || 8) / 4)))
      : 3;
    const end = Math.min(i + budget, nodes.length);
    for (; i < end; i += 1) {
      const node = nodes[i];
      if (!node.isConnected) continue;
      const e = getEx(node.getAttribute('data-diagram-id'));
      if (!e) continue;
      node.classList.remove('diagram-pending');
      node.removeAttribute('data-diagram-id');
      node.innerHTML = courtSVG(e.diagram, getCanonicalShapes(e), false, false, courtKind(e));
    }
    if (i < nodes.length) {
      if (typeof requestIdleCallback === 'function') requestIdleCallback(step, { timeout: 90 });
      else requestAnimationFrame(() => step());
    }
  };
  if (!nodes.length) return;
  if (typeof requestIdleCallback === 'function') requestIdleCallback(step, { timeout: 90 });
  else requestAnimationFrame(() => step());
}

function groupExercises(list) {
  const order = strokes.slice(1);
  const map = new Map();
  for (const cat of order) map.set(cat, []);
  for (const e of list) {
    const cat = order.includes(e.stroke) ? e.stroke : 'Другое';
    if (!map.has(cat)) map.set(cat, []);
    map.get(cat).push(e);
  }
  return [...map.entries()].filter(([, arr]) => arr.length);
}

function suggestedStroke(text) {
  const t = (text || '').toLowerCase();
  if (/дет|реб[её]н|малыш|красн\S* мяч|оранжев|зел[её]н\S* мяч/.test(t)) return 'Дети';
  if (/размин/.test(t)) return 'Разминка';
  if (/замин|растяж|восстанов/.test(t)) return 'Заминка';
  if (/пар(?:н|а|ы)|дабл|double/.test(t)) return 'Парная игра';
  if (/при[её]м|return/.test(t)) return 'Приём подачи';
  if (/подач|serve/.test(t)) return 'Подача';
  if (/подход|выход к сетке|обвод|переход/.test(t)) return 'Переходная игра';
  if (/волле|воллей|с л[её]та|у сетки|см[эе]ш/.test(t)) return 'Игра у сетки';
  if (/защит|контратак|свеч/.test(t)) return 'Защита и контратака';
  if (/форхенд|бэкхенд|бекхенд|forehand|backhand|с отскока|задн(?:яя|ей) лини/.test(t)) return 'Удары с отскока';
  if (/передвижен|ног|footwork/.test(t)) return 'Работа ног';
  if (/тактик|розыгрыш|игров/.test(t)) return 'Тактика и розыгрыши';
  return '';
}

function suggestedGoal(text) {
  const t = (text || '').toLowerCase();
  const patterns = [[/стабил/, 'Стабильность'], [/точн/, 'Точность'], [/контрол/, 'Контроль'], [/глубин/, 'Глубина'], [/сил|мощн/, 'Сила'], [/вращен/, 'Вращение'], [/реакц/, 'Реакция'], [/ног|передвижен/, 'Работа ног'], [/тактик/, 'Тактика']];
  return patterns.filter(([pattern]) => pattern.test(t)).map(([, label]) => label);
}

function draftStudentIds() { return whoAllStudentIds(liveWho(draft.who)); }
function draftIsKids() {
  const ids = draftStudentIds();
  const ages = ids.map(getStudent).filter(Boolean).map((st) => parseInt(st.age, 10)).filter(Number.isFinite);
  return ages.length > 0 && ages.every((n) => n <= 12);
}

function rankedPickerExercises() {
  const kids = draftIsKids();
  const preferred = suggestedStroke(draft.goal) || (kids ? 'Дети' : '');
  const relatedGoals = suggestedGoal(draft.goal);
  const term = picker.query.toLowerCase().trim();
  return allExercises().filter((e) =>
    (picker.stroke === 'Автоподбор' || picker.stroke === 'Все типы' || picker.stroke === e.stroke)
    && (!term || (e.title + ' ' + e.stroke + ' ' + e.brief + ' ' + (e.goals || []).join(' ')).toLowerCase().includes(term))
  ).sort((a, b) => {
    const score = (e) => (picker.section === 'warmup' && e.stroke === 'Разминка' ? 200 : 0) + (picker.section === 'cooldown' && e.stroke === 'Заминка' ? 200 : 0) + (picker.section === 'points' && stageOf(e) === 'game' ? 150 : 0) + (picker.section === 'main' && stageOf(e) !== 'game' ? 20 : 0) + (!['warmup', 'cooldown'].includes(picker.section) && ['Разминка', 'Заминка'].includes(e.stroke) ? -50 : 0) + (e.stroke === 'Дети' && preferred !== 'Дети' ? -120 : 0) + (preferred && e.stroke === preferred ? 100 : 0) + relatedGoals.filter((g) => (e.goals || []).includes(g)).length * 12;
    return score(b) - score(a) || a.title.localeCompare(b.title, 'ru');
  });
}

const MONTHS_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
let sessFilter = '';
function isoShift(iso, days) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + days);
  const m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + dd;
}
function dayLabelHTML(iso) {
  const today = dateISO();
  if (iso === today) return 'Сегодня';
  if (iso === isoShift(today, -1)) return 'Вчера';
  if (iso === isoShift(today, 1)) return 'Завтра';
  const d = new Date(iso + 'T12:00:00');
  if (Number.isNaN(+d)) return h(iso);
  const sameYear = iso.slice(0, 4) === today.slice(0, 4);
  const main = d.toLocaleDateString('ru-RU', sameYear ? { day: 'numeric', month: 'long' } : { day: 'numeric', month: 'long', year: 'numeric' });
  const wd = d.toLocaleDateString('ru-RU', { weekday: 'long' });

}

  const ov = el('overlay');
  const top = overlayTop();
  const unders = [...underBox().children];
  dimTo(true);
  if (!top) {
    ov.innerHTML = sheetMarkup(content);
    enterSheet(overlayTop());
  } else if (push && !pc) {
    pushSheet(top, content);
  } else if (pc && unders.length) {
    /* сохранили правку: обновлённое окно ждёт под текущим, текущее уезжает вниз */
    const next = unders[unders.length - 1];
    unders.slice(0, -1).forEach(sheetFadeAway);
    const inner = next.querySelector('.modal-inner');
    if (inner) inner.innerHTML = content;
    const m = next.querySelector('.modal');
    if (m) m.scrollTop = 0;
    next._snap = null;
    moveKeep(top, leavingBox());
    revealUnder(next);
    sheetLeave(top, 'save-pop');
  } else {
    swapSheet(top, content);
  }
  autosizeAreas(ov);
  afterModalOpen();
}
function closeModal(mode) {
  if (!overlayTop()) return;
  const all = mode !== 'top';
  if (pendingClose) { pendingClose.all = pendingClose.all || all; return; }
  pendingClose = { all };
  queueMicrotask(() => {
    const pc = pendingClose;
    pendingClose = null;
    if (pc) popSheets(pc.all);
  });
}

const NOTE_KEY = 'tennis_coach_note_draft_v1';
const NOTE_NEW = '__new';

function defaultNoteDraft() {
  return {
    id: '',
    who: emptyWho(),
    date: dateISO(),
    notes: '',
    success: '',
    difficulty: '',
    next: '',
    studentNotes: {}
  };
}
function normNoteRow(row) {
  row = row && typeof row === 'object' ? row : {};
  const sn = {};
  if (row.studentNotes && typeof row.studentNotes === 'object') for (const k of Object.keys(row.studentNotes)) sn[k] = String(row.studentNotes[k] || '');
  return {
    id: String(row.id || ''),
    who: row.who ? cleanWho(row.who) : legacyWho(row.targetType, row.targetId),
    date: String(row.date || dateISO()),
    notes: String(row.notes || ''),
    success: String(row.success || ''),
    difficulty: String(row.difficulty || ''),
    next: String(row.next || ''),
    studentNotes: sn
  };
}
function loadNoteDrafts() {
  try {
    const raw = JSON.parse(localStorage.getItem(NOTE_KEY) || '{}');
    return raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
  } catch (err) { return {}; }
}
function readNoteDraft(key) {
  const row = loadNoteDrafts()[key || NOTE_NEW];
  return row && typeof row === 'object' ? row : null;
}
function saveNoteDraft(key, fields) {
  const all = loadNoteDrafts();
  const row = normNoteRow(fields);
  const empty = !row.notes.trim() && !row.success.trim() && !row.difficulty.trim() && !row.next.trim() && !Object.values(row.studentNotes).some((v) => v.trim());
  if (empty && !row.id) delete all[key || NOTE_NEW];
  else all[key || NOTE_NEW] = { ...row, updatedAt: nowISO() };
  try { localStorage.setItem(NOTE_KEY, JSON.stringify(all)); } catch (err) {}
}
function clearNoteDraft(key) {
  const all = loadNoteDrafts();
  if (!all[key || NOTE_NEW]) return;
  delete all[key || NOTE_NEW];
  try { localStorage.setItem(NOTE_KEY, JSON.stringify(all)); } catch (err) {}
}
function noteFieldsFromForm(form) {

  return {
    id: String((form.elements.id && form.elements.id.value) || ''),
    who: whoGet('note'),
    studentNotes: { ...noteSnotes },
    date: String((form.elements.date && form.elements.date.value) || dateISO()),

  };
}
function queueNoteDraft(form) {
  if (!form) return;
  clearTimeout(queueNoteDraft.timer);
  queueNoteDraft.timer = setTimeout(() => {
    const fields = noteFieldsFromForm(form);
    saveNoteDraft(fields.id || NOTE_NEW, fields);
    const hint = document.getElementById('note-draft-hint');

    hint.classList.add('is-on');

    /* Новая запись всегда начинается с пустой формы. Незаконченный черновик (например, после перезагрузки)

    const saved = opts.prefill ? null : readNoteDraft(NOTE_NEW);

function navigate(next) {
  if (next === view && !el('overlay').innerHTML) return;
  viewScroll[view] = window.scrollY || document.documentElement.scrollTop || 0;
  view = next;
  picker.open = false;
  closeModal();
  render();
  if (view === 'exercises') updateExerciseList();
  const y = viewScroll[view] || 0;
  window.scrollTo({ top: y, behavior: 'instant' });
}

function toggleEx(id, section) {
  const locations = sectionDefs.filter((s) => (draft.sections[s.id] || []).includes(id)).map((s) => s.id);
  const snapshot = Object.fromEntries(sectionDefs.map((s) => [s.id, (draft.sections[s.id] || []).slice()]));
  if (locations.length) {
    const targets = section && locations.includes(section) ? [section] : locations;
    for (const sec of targets) draft.sections[sec] = (draft.sections[sec] || []).filter((x) => x !== id);
    persistDraft();
    toast('Упражнение убрано из плана', {
      label: 'Вернуть',
      onClick: () => {
        draft.sections = snapshot;
        persistDraft();
        if (view === 'training' && !el('overlay').innerHTML) {
          for (const s of sectionDefs) {
            updatePickerRowState(id, s.id, (draft.sections[s.id] || []).includes(id));
            updatePlanSectionList(s.id);
          }
        } else if (!(view === 'exercises' && !el('overlay').innerHTML && syncPlanButtons(id))) {
          render();
          if (view === 'exercises') updateExerciseList();
        }
      }
    });
  } else {
    const sec = section || 'main';
    if (!draft.sections[sec]) draft.sections[sec] = [];
    draft.sections[sec] = uniq([...draft.sections[sec], id]);
    haptic();
    persistDraft();
    const title = sectionDefs.find((s) => s.id === sec);
    toast('Добавлено в раздел «' + (title ? title.title : sec) + '»');
  }
  if (el('overlay').innerHTML) closeModal();
  if (view === 'training' && !el('overlay').innerHTML) {
    const secs = section ? [section] : sectionDefs.map((s) => s.id);
    for (const sec of secs) {
      updatePickerRowState(id, sec, (draft.sections[sec] || []).includes(id));
      updatePlanSectionList(sec);
    }
    return;
  }
  if (view === 'exercises' && !el('overlay').innerHTML && syncPlanButtons(id)) return;
  render();
  if (view === 'exercises') updateExerciseList();
}

function savePlan() {
  const who = liveWho(draft.who);
  if (!whoHasPlayers(who)) {
    toast(store.students.length || store.groups.length ? 'Отметьте, кто будет на занятии: хотя бы одного ученика' : 'Сначала добавьте ученика');

    const f = document.querySelector('.fold[data-fold="who-plan"]');
    if (f && !f.classList.contains('is-open')) animateFold(f, true);

    return;
  }

  if (!hasItems) { toast('Добавьте хотя бы одно упражнение'); return; }
  const sections = emptySections();
  for (const s of sectionDefs) {
    sections[s.id] = (draft.sections[s.id] || []).map(getEx).filter(Boolean).map(snapshotExercise);
  }
  store.plans.push({
    id: 'p_' + uid(),
    kind: 'plan',
    ...whoRecordFields(who),
    studentNotes: {},
    date: draft.date || dateISO(),
    goal: draft.goal.trim(),
    notes: draft.notes.trim(),
    status: 'planned',
    sections,
    summary: null,
    templateId: draft.templateId || '',
    blockMinutes: draft.blockMinutes ? { ...draft.blockMinutes } : null,
    createdBy: store.coachId,
    createdAt: nowISO(),
    updatedAt: nowISO()
  });

  draft = defaultDraft();
  clearDraftStorage();
  ui.folds['new-plan'] = false;
  ui.folds['saved-plans'] = true;
  freshPlanId = (store.plans[store.plans.length - 1] || {}).id || '';

  haptic();

function loadReportDrafts() {
  try {
    const raw = JSON.parse(localStorage.getItem(REPORT_KEY) || '{}');
    return raw && typeof raw === 'object' ? raw : {};
  } catch (err) { return {}; }
}
function getReportDraft(id) {
  if (!id) return null;
  const row = loadReportDrafts()[id];
  return row && typeof row === 'object' ? row : null;
}
function saveReportDraft(id, fields) {
  if (!id) return;
  const all = loadReportDrafts();
  const success = String((fields && fields.success) || '').trim();
  const difficulty = String((fields && fields.difficulty) || '').trim();
  const next = String((fields && fields.next) || '').trim();
  const studentNotes = {};
  const sn = (fields && fields.studentNotes) || {};
  for (const k of Object.keys(sn)) { const v = String(sn[k] || ''); if (v.trim()) studentNotes[k] = v; }
  if (!success && !difficulty && !next && !Object.keys(studentNotes).length) delete all[id];
  else all[id] = { success, difficulty, next, studentNotes, updatedAt: nowISO() };
  try { localStorage.setItem(REPORT_KEY, JSON.stringify(all)); } catch (err) {}
}
function clearReportDraft(id) {
  if (!id) return;
  const all = loadReportDrafts();
  if (!all[id]) return;
  delete all[id];
  try { localStorage.setItem(REPORT_KEY, JSON.stringify(all)); } catch (err) {}
}
function queueReportDraft(form) {
  const id = form && form.querySelector('[name="id"]') && form.querySelector('[name="id"]').value;
  if (!id) return;
  clearTimeout(queueReportDraft.timer);
  queueReportDraft.timer = setTimeout(() => {
    saveReportDraft(id, {
      success: (form.elements.success && form.elements.success.value) || '',
      difficulty: (form.elements.difficulty && form.elements.difficulty.value) || '',
      next: (form.elements.next && form.elements.next.value) || '',
      studentNotes: snotesFromForm(form)
    });
    const hint = document.getElementById('report-draft-hint');
    if (!hint) return;
    hint.classList.add('is-on');
    clearTimeout(queueReportDraft.hintTimer);
    queueReportDraft.hintTimer = setTimeout(() => { hint.classList.remove('is-on'); }, 1600);
  }, 400);
}
function openCourtZoom(from) {
  const src = from && from.querySelector ? from.querySelector('svg') : null;
  if (!src) return;
  const r = src.getBoundingClientRect();
  closeCourtZoom(true);
  const layer = document.createElement('div');
  layer.id = 'court-zoom';
  layer.className = 'court-zoom';
  layer.setAttribute('data-action', 'close-court-zoom');
  layer.setAttribute('role', 'dialog');
  layer.setAttribute('aria-modal', 'true');
  layer.setAttribute('aria-label', 'Схема корта');
  layer.innerHTML = `<button type="button" class="court-zoom-close" data-action="close-court-zoom" aria-label="Закрыть">${icon('close', 20)}</button><div class="court-zoom-stage">${src.outerHTML}</div>`;
  document.body.appendChild(layer);
  document.body.classList.add('court-zoom-open');
  bindCourtZoomSwipe(layer);
  const dest = layer.querySelector('.court-zoom-stage svg');
  if (reduceMotion()) { layer.classList.add('is-in'); return; }
  requestAnimationFrame(() => {
    if (!dest || !dest.isConnected) { layer.classList.add('is-in'); return; }
    const d = dest.getBoundingClientRect();
    const tx = (r.left + r.width / 2) - (d.left + d.width / 2);
    const ty = (r.top + r.height / 2) - (d.top + d.height / 2);
    const sx = r.width / (d.width || 1);
    const sy = r.height / (d.height || 1);
    layer.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: FOLD_EASE, fill: 'forwards' });
    dest.animate(
      [{ transform: 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ',' + sy + ')', opacity: .9 }, { transform: 'none', opacity: 1 }],
      { duration: FOLD_OPEN_MS, easing: FOLD_EASE, fill: 'forwards' }
    );
    layer.classList.add('is-in');
  });
}
function closeCourtZoom(instant) {
  const layer = document.getElementById('court-zoom');
  if (!layer) { document.body.classList.remove('court-zoom-open'); return; }
  const finish = () => { if (layer.parentNode) layer.remove(); document.body.classList.remove('court-zoom-open'); };
  if (instant || reduceMotion()) { finish(); return; }
  const stage = layer.querySelector('.court-zoom-stage');
  const opts = { duration: FOLD_CLOSE_MS, easing: FOLD_EASE, fill: 'forwards' };
  layer.animate([{ opacity: 1 }, { opacity: 0 }], opts);
  if (stage) stage.animate([{ transform: 'translateY(0px)', opacity: 1 }, { transform: 'translateY(28px)', opacity: 0 }], opts);
  setTimeout(finish, FOLD_CLOSE_MS + 20);
}
function bindCourtZoomSwipe(layer) {
  const stage = layer.querySelector('.court-zoom-stage');
  let y0 = 0, dy = 0, on = false;
  const start = (y) => { y0 = y; dy = 0; on = true; };
  const move = (y) => {
    if (!on || !stage) return;
    dy = y - y0;
    if (dy > 0) {
      stage.style.transform = 'translateY(' + dy + 'px)';
      layer.style.opacity = String(Math.max(.4, 1 - dy / 380));
    }
  };
  const end = () => {
    if (!on) return;
    on = false;
    if (dy > 90) { if (stage) stage.style.transform = ''; layer.style.opacity = ''; closeCourtZoom(); }
    else if (stage) {
      stage.animate([{ transform: 'translateY(' + Math.max(0, dy) + 'px)' }, { transform: 'none' }], { duration: 220, easing: FOLD_EASE });
      layer.animate([{ opacity: layer.style.opacity || 1 }, { opacity: 1 }], { duration: 220, easing: FOLD_EASE });
      stage.style.transform = '';
      layer.style.opacity = '';
    }
    dy = 0;
  };
  layer.addEventListener('touchstart', (e) => { if (e.touches[0]) start(e.touches[0].clientY); }, { passive: true });
  layer.addEventListener('touchmove', (e) => { if (e.touches[0]) move(e.touches[0].clientY); }, { passive: true });
  layer.addEventListener('touchend', end, { passive: true });
  layer.addEventListener('touchcancel', end, { passive: true });
}

  const p = getPlan(id);
  if (!p) return;
  if (isNotePlan(p)) {
    const prefill = {
      who: liveWho(whoOfPlan(p)),
      studentNotes: {},
      date: dateISO(),
      notes: p.notes || '',
      success: (p.summary && p.summary.success) || '',

  draft = {
    who: liveWho(whoOfPlan(p)),
    date: dateISO(),
    goal: p.goal || '',

function backupObject() {
  return { exportedAt: new Date().toISOString(), app: 'tennis-coach-v1', version: 2, data: store };
}

async function exportData() {
  const json = JSON.stringify(backupObject(), null, 2);
  const file = new File([json], 'tennis-coach-kopiya.json', { type: 'application/json' });
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Tennis Coach — копия' }); toast('Копия подготовлена'); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'tennis-coach-kopiya.json';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Резервная копия подготовлена');
}

function looksLikeBackup(obj) {
  if (!obj || typeof obj !== 'object') return false;
  const data = obj.data && typeof obj.data === 'object' ? obj.data : obj;
  return Array.isArray(data.students) || Array.isArray(data.plans) || Array.isArray(data.customExercises) || Array.isArray(data.groups) || Array.isArray(data.templates);
}

function importFromObject(obj) {
  const data = obj.data && typeof obj.data === 'object' && (obj.app || obj.version || obj.exportedAt) ? obj.data : obj;
  if (!looksLikeBackup(obj)) throw new Error('format');
  store = normalizeStore(data);
  persist();
  draft = defaultDraft();
  navigate(view || 'training');
}

function requestImport() {
  const input = el('import-file');
  if (!input) return;
  input.value = '';
  input.click();
}

function handleImportFile(file) {
  if (!file) return;
  if (!confirm('Заменить текущие данные копией из файла? Это нельзя отменить, если у вас нет другой копии.')) {
    el('import-file').value = '';
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => toast('Не удалось прочитать файл');
  reader.onload = () => {
    try {
      const obj = JSON.parse(String(reader.result || ''));
      if (!looksLikeBackup(obj)) { toast('Это не похоже на копию Tennis Coach'); return; }
      importFromObject(obj);
      toast('Данные восстановлены из файла');
    } catch (e) {
      toast('Файл повреждён или это не копия Tennis Coach');
    }
  };
  reader.readAsText(file);
}

function progressionHTML(items) {
  const stages = items.map(stageOf).filter(Boolean);
  if (!stages.length) return '';
  const has = new Set(stages);
  const first = (k) => stages.indexOf(k);
  const steps = STAGES.map(([k, label]) => `<span class="stage-step ${has.has(k) ? 'on' : ''}">${h(label)}</span>`).join('<span class="stage-arrow">→</span>');
  let note;
  const missing = STAGES.filter(([k]) => !has.has(k)).map(([, l]) => '«' + l + '»');
  const ordered = STAGES.map(([k]) => first(k)).filter((i) => i >= 0).every((v, i, a) => i === 0 || v >= a[i - 1]);
  if (!missing.length && ordered) note = 'Есть переход от отработки к игре со счётом.';
  else if (!missing.length) note = 'Все этапы есть, но порядок другой: обычно сначала корзина, потом живой мяч, в конце игра со счётом.';
  else note = 'Нет этапа ' + missing.join(' и ') + (has.has('game') ? '.' : ' — можно добавить игру со счётом в игровую часть.');
  return `<div class="stage-line" aria-label="Этапы в плане">${steps}</div><p class="stage-note">${h(note)}</p>`;
}

function allTemplates() { return [...BUILTIN_TEMPLATES, ...(store.templates || [])]; }

  const kids = draftIsKids();

}

/* Автоподбор упражнений под каркас: укладываемся в минуты блока, в основной части идём от корзины к живому мячу. */
function autoFill(tpl) {
  const kids = Boolean(tpl.kids);
  const all = allExercises();
  const used = new Set();
  const focus = draftFocusText();
  const prefStroke = suggestedStroke(focus);
  const prefGoals = suggestedGoal(focus);
  const adultBall = (e) => !['Разминка', 'Заминка', 'Дети'].includes(e.stroke);
  const fits = {
    warmup: (e) => kids ? e.stroke === 'Дети' && stageOf(e) !== 'game' && (e.goals || []).some((g) => g === 'Работа ног' || g === 'Реакция') : e.stroke === 'Разминка',
    main: (e) => (kids ? e.stroke === 'Дети' : adultBall(e)) && ['basket', 'live'].includes(stageOf(e)),
    points: (e) => (kids ? e.stroke === 'Дети' : adultBall(e)) && stageOf(e) === 'game',
    cooldown: (e) => e.stroke === 'Заминка' && (!kids || stageOf(e) !== 'basket')
  };
  let band = '';
  if (kids) {
    const ids = draftStudentIds();
    const ages = ids.map(getStudent).filter(Boolean).map((st) => parseInt(st.age, 10)).filter(Number.isFinite);
    const a = ages.length ? Math.min(...ages) : 0;
    band = a ? (a <= 7 ? '5–7' : a <= 10 ? '8–10' : '11–12') : '';
  }
  const score = (e) => (band && e.stroke === 'Дети' && String(e.brief || '').startsWith(band) ? 80 : 0) + (prefStroke && e.stroke === prefStroke ? 60 : 0) + prefGoals.filter((g) => (e.goals || []).includes(g)).length * 15 + (e.level === 'Любой' ? 4 : 0) + Math.random() * 25;
  const out = emptySections();
  for (const sec of sectionDefs) {
    const target = tpl.blocks[sec.id] || 0;
    if (!target) continue;
    const pool = all.filter((e) => fits[sec.id](e) && !used.has(e.id)).map((e) => [e, score(e)]).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
    const chosen = [];
    let total = 0;
    const take = (e) => { chosen.push(e); used.add(e.id); total += (+e.minutes || 0); };
    if (sec.id === 'main') {
      const b = pool.find((e) => stageOf(e) === 'basket' && (+e.minutes || 0) <= target);
      if (b) take(b);
      const l = pool.find((e) => stageOf(e) === 'live' && !used.has(e.id) && total + (+e.minutes || 0) <= target + 3);
      if (l) take(l);
    }
    for (const e of pool) {
      if (total >= target - 2) break;
      if (used.has(e.id)) continue;
      if (total + (+e.minutes || 0) <= target + 3) take(e);
    }
    if (!chosen.length && pool.length) take(pool.reduce((m, e) => (+e.minutes || 99) < (+m.minutes || 99) ? e : m, pool[0]));
    const order = { basket: 0, live: 1, game: 2, '': 3 };
    if (sec.id === 'main') chosen.sort((a, b) => order[stageOf(a)] - order[stageOf(b)]);
    out[sec.id] = chosen.map((e) => e.id);
  }
  return out;
}

function copyDraftSections(src) {
  return Object.fromEntries(sectionDefs.map((sec) => [sec.id, [ ...((src && src[sec.id]) || []) ]]));
}
function parseTemplateApplied(saved) {
  if (!saved || typeof saved !== 'object') return null;
  const out = {};
  let any = false;
  for (const sec of sectionDefs) {
    const ids = Array.isArray(saved[sec.id]) ? uniq(saved[sec.id].map(currentExId).filter(Boolean)) : [];
    out[sec.id] = ids;
    if (ids.length) any = true;
  }
  return any ? out : null;
}
function snapshotDraftPlan() {
  return {
    templateId: draft.templateId || '',
    sections: copyDraftSections(draft.sections),
    blockMinutes: draft.blockMinutes ? { ...draft.blockMinutes } : null,
    templateApplied: draft.templateApplied ? copyDraftSections(draft.templateApplied) : null,
    templateAppliedMinutes: draft.templateAppliedMinutes ? { ...draft.templateAppliedMinutes } : null
  };
}
function restoreDraftPlan(snap) {
  if (!snap) return;
  draft.templateId = snap.templateId || '';
  draft.sections = copyDraftSections(snap.sections);
  draft.blockMinutes = snap.blockMinutes ? { ...snap.blockMinutes } : null;
  draft.templateApplied = snap.templateApplied ? copyDraftSections(snap.templateApplied) : null;
  draft.templateAppliedMinutes = snap.templateAppliedMinutes ? { ...snap.templateAppliedMinutes } : null;
  for (const sec of sectionDefs) ui.folds['plan-sec-' + sec.id] = (draft.sections[sec.id] || []).length > 0;
  persistDraft();
  render();
}
function planDiffersFromApplied() {
  const applied = draft.templateApplied;
  if (!applied) return true;
  if (sectionDefs.some((sec) => JSON.stringify(draft.sections[sec.id] || []) !== JSON.stringify(applied[sec.id] || []))) return true;
  const a = draft.blockMinutes || {}, b = draft.templateAppliedMinutes || {};
  const keys = new Set([...Object.keys(a), ...Object.keys(b)]);
  for (const k of keys) {
    if (Number(a[k] || 0) !== Number(b[k] || 0)) return true;
  }
  return false;
}
function unapplyTemplate() {
  const before = snapshotDraftPlan();
  const applied = draft.templateApplied || (draft.templateId ? copyDraftSections(draft.sections) : null);
  const changed = planDiffersFromApplied();
  let removed = 0;
  if (applied) {
    for (const sec of sectionDefs) {
      const drop = new Set(applied[sec.id] || []);
      const was = draft.sections[sec.id] || [];
      draft.sections[sec.id] = was.filter((x) => !drop.has(x));
      removed += was.length - draft.sections[sec.id].length;
    }
  }
  if (draft.blockMinutes) {
    for (const sec of sectionDefs) {
      if (!(draft.sections[sec.id] || []).length) delete draft.blockMinutes[sec.id];
    }
    if (!sectionDefs.some((sec) => draft.blockMinutes[sec.id] != null)) draft.blockMinutes = null;
  }
  draft.templateId = '';
  draft.templateApplied = null;
  draft.templateAppliedMinutes = null;
  persistDraft();
  render();
  if (removed || changed) {
    toast('Шаблон снят', {
      label: 'Вернуть',
      onClick: () => restoreDraftPlan(before)
    });
  } else {
    toast('Шаблон снят');
  }
}
function applyTemplate(id) {
  if (draft.templateId === id) { unapplyTemplate(); return; }
  const tpl = getTemplate(id);
  if (!tpl) { draft.templateId = ''; draft.templateApplied = null; draft.templateAppliedMinutes = null; draft.blockMinutes = null; render(); return; }
  if (draftIds().length && !confirm('Заменить упражнения в текущем плане упражнениями из шаблона?')) { render(); return; }
  draft.templateId = tpl.id;
  draft.blockMinutes = { ...tpl.blocks };
  if (isUserTemplate(tpl.id)) {
    draft.sections = Object.fromEntries(sectionDefs.map((sec) => [sec.id, uniq((tpl.items[sec.id] || []).map(currentExId).filter(Boolean))]));
  } else {
    draft.sections = autoFill(tpl);
  }
  draft.templateApplied = copyDraftSections(draft.sections);
  draft.templateAppliedMinutes = { ...(draft.blockMinutes || {}) };
  for (const sec of sectionDefs) ui.folds['plan-sec-' + sec.id] = (draft.sections[sec.id] || []).length > 0;
  picker.open = false;
  persistDraft();
  render();
  toast(isUserTemplate(tpl.id) ? 'План собран из шаблона' : 'Упражнения подобраны — их можно менять');
}

function saveTemplateFrom(sectionsIds, minutesOf, kids, defaultTitle) {
  if (!sectionDefs.some((sec) => (sectionsIds[sec.id] || []).length)) { toast('Добавьте хотя бы одно упражнение'); return; }
  const title = (prompt('Название шаблона', defaultTitle || 'Мой шаблон') || '').trim();
  if (!title) return;
  const blocks = {}, items = {};
  for (const sec of sectionDefs) { items[sec.id] = [...(sectionsIds[sec.id] || [])]; blocks[sec.id] = minutesOf(sec.id); }
  const t = normalizeTemplate({ id: 'tpl_' + uid(), title, kids, blocks, items, createdBy: store.coachId, createdAt: nowISO(), updatedAt: nowISO() });
  store.templates = [...(store.templates || []), t];
  persist();
  return t;
}

function saveDraftAsTemplate() {
  const sum = (k) => (draft.sections[k] || []).map(getEx).filter(Boolean).reduce((a, e) => a + (+e.minutes || 0), 0);
  const t = saveTemplateFrom(draft.sections, (k) => (draft.blockMinutes && draft.blockMinutes[k]) || sum(k), draftIsKids(), draft.goal ? draft.goal.slice(0, 60) : '');
  if (!t) return;
  draft.templateId = t.id;
  render();
  toast('Шаблон сохранён');
}

function savePlanAsTemplate(id) {
  const p = getPlan(id);
  if (!p) return;
  const ids = Object.fromEntries(sectionDefs.map((sec) => [sec.id, (p.sections[sec.id] || []).map((i) => currentExId(i.id)).filter(Boolean)]));
  const mins = (k) => (p.blockMinutes && p.blockMinutes[k]) || (p.sections[k] || []).reduce((a, i) => a + (+i.minutes || 0), 0);
  const t = targetOfPlan(p);
  const kidsPlan = t.members.length > 0 && t.members.every((s) => { const n = parseInt(s.age, 10); return Number.isFinite(n) && n <= 12; });
  if (saveTemplateFrom(ids, mins, kidsPlan, p.goal ? p.goal.slice(0, 60) : '')) toast('Шаблон сохранён');
}

function deleteTemplate(id) {
  if (!isUserTemplate(id) || !confirm('Удалить этот шаблон? Сохранённые планы не изменятся.')) return;
  store.templates = store.templates.filter((t) => t.id !== id);
  if (draft.templateId === id) draft.templateId = '';
  persist();
  render();
  toast('Шаблон удалён');
}

function startPlanForStudent(id) {
  const s = getStudent(id);
  if (!s) return;
  draft = defaultDraft();
  draft.who = { coachIds: [], studentIds: [id], groupIds: [] };
  draft.goal = (s.priority || s.goals || '').trim();
  ui.folds['new-plan'] = true;
  persistDraft();
  navigate('training');
  toast('Выберите шаблон или добавьте упражнения');
}

function refreshOpenScheme() {
  const modal = el('overlay').querySelector('.modal');
  if (!modal) return;
  if (diagramEditor) return;
  if (schemeContext.source === 'plan' && schemeContext.planId) { openPlan(schemeContext.planId); return; }
  const editBtn = modal.querySelector('[data-action="edit-exercise"]');
  if (editBtn && editBtn.dataset.id) { openExercise(editBtn.dataset.id, schemeContext); return; }
}

document.addEventListener('click', (event) => {
  const btn = event.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action, id = btn.dataset.id;
  if (a === 'close-overlay' && btn.classList.contains('veil') && event.target !== btn) return;
  if (PUSH_ACTIONS.has(a) && btn.closest('#overlay') && overlayTop()) { pushNextModal = true; setTimeout(() => { pushNextModal = false; }, 0); }
  switch (a) {
    case 'navigate': navigate(btn.dataset.view); break;
    case 'close-overlay': diagramEditor = null; discardNoteFormDraft(); closeModal('top'); break;
    case 'info': settings(); break;
    case 'toggle-fold': onToggleFold(btn); break;
    case 'detail-ex': schemeHand = 'auto'; schemeContext = { source: 'library' }; openExercise(id, schemeContext); break;
    case 'toggle-ex': toggleEx(id, btn.dataset.section || 'main'); break;
    case 'new-exercise': openExerciseForm(); break;
    case 'edit-exercise': openExerciseForm(id); break;
    case 'reset-exercise': resetExercise(id); break;
    case 'delete-exercise': deleteCustomExercise(id); break;
    case 'diagram-edit': openDiagramEditor(id); break;
    case 'diagram-tap': diagramTap(event); break;
    case 'diagram-tool': if (diagramEditor) { diagramEditor.tool = id; diagramEditor.pending = null; renderDiagramEditor(); } break;
    case 'diagram-undo': if (diagramEditor && diagramEditor.history.length) { diagramEditor.shapes = diagramEditor.history.pop(); diagramEditor.pending = null; renderDiagramEditor(); } break;
    case 'diagram-clear-zones': if (diagramEditor && diagramEditor.shapes.some((s) => s.kind === 'zone' || s.kind === 'target')) { editorUndoCheckpoint(); diagramEditor.shapes = diagramEditor.shapes.filter((s) => s.kind !== 'zone' && s.kind !== 'target'); diagramEditor.pending = null; renderDiagramEditor(); } break;
    case 'diagram-clear': if (diagramEditor) { editorUndoCheckpoint(); diagramEditor.shapes = []; diagramEditor.pending = null; renderDiagramEditor(); } break;
    case 'diagram-default': if (diagramEditor) { editorUndoCheckpoint(); const e = getEx(diagramEditor.id); diagramEditor.shapes = seedDiagramShapes(e); diagramEditor.pending = null; renderDiagramEditor(); } break;
    case 'diagram-save': finishDiagramEdit(true); break;
    case 'diagram-cancel': finishDiagramEdit(false); break;
    case 'scheme-hand': schemeHand = id; refreshOpenScheme(); break;
    case 'new-student': openStudentForm(); break;
    case 'student-detail': openStudent(id); break;
    case 'edit-student': openStudentForm(id); break;
    case 'delete-student': personDelete('s', id); break;
    case 'new-group': openGroupForm(); break;
    case 'group-detail': openGroup(id); break;
    case 'edit-group': openGroupForm(id); break;
    case 'delete-group': personDelete('g', id); break;
    case 'toggle-plan-picker': {
      const sec = btn.dataset.section || 'main';
      setPlanPicker(sec, !(picker.open && picker.section === sec));
      break;
    }
    case 'picker-show-more': {
      picker.more = true;
      const fold = document.querySelector('.fold[data-fold="picker-' + picker.section + '"]');
      const inner = fold && fold.querySelector(':scope > .fold-panel > .fold-inner');
      if (inner) inner.innerHTML = renderPlanPicker();
      else render();
      el('plan-ex-search') && el('plan-ex-search').focus();
      break;
    }
    case 'picker-show-less': {
      picker.more = false; picker.query = ''; picker.stroke = 'Автоподбор';
      const fold = document.querySelector('.fold[data-fold="picker-' + picker.section + '"]');
      const inner = fold && fold.querySelector(':scope > .fold-panel > .fold-inner');
      if (inner) inner.innerHTML = renderPlanPicker();
      else render();
      break;
    }
    case 'picker-toggle-ex': {
      pickerToggleEx(id, btn.dataset.section || picker.section || 'main');
      break;
    }
    case 'picker-preview': {
      const next = picker.previewId === id ? null : id;
      const prevId = picker.previewId;
      picker.previewId = next;
      const body = btn.closest('.plan-suggestion') || btn;
      document.querySelectorAll('[data-action="picker-preview"]').forEach((b) => b.setAttribute('aria-expanded', b.dataset.id === next ? 'true' : 'false'));
      if (prevId && prevId !== id) {
        const oldFold = document.querySelector('.fold[data-fold="picker-preview-' + prevId + '"]');
        if (oldFold) animateFold(oldFold, false);
      }
      const fold = document.querySelector('.fold[data-fold="picker-preview-' + id + '"]');
      if (fold) animateFold(fold, next === id);
      else renderKeepScroll();
      break;
    }
    case 'apply-template': {
      if (id) applyTemplate(id);
      break;
    }
    case 'scroll-report': {
      const form = document.getElementById('finish-plan-form');
      if (form) form.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
      const ta = form && form.querySelector('textarea[name="success"]');
      if (ta) setTimeout(() => { try { ta.focus(); } catch (err) {} }, reduceMotion() ? 0 : 280);
      break;
    }
    case 'toast-undo': {
      runToastUndo();
      break;
    }
    case 'picker-done': {
      if (picker.open) setPlanPicker(picker.section, false);
      break;
    }
    case 'save-plan': savePlan(); break;
    case 'save-template': saveDraftAsTemplate(); break;
    case 'plan-to-template': savePlanAsTemplate(id); break;
    case 'delete-template': deleteTemplate(id); break;
    case 'student-plan': startPlanForStudent(id); break;
    case 'new-note': openNoteForm(); break;
    case 'student-note': openNoteForm({ studentId: id }); break;
    case 'group-note': openNoteForm({ groupId: id }); break;
    case 'edit-note': openNoteForm({ id }); break;
    case 'swipe-repeat': { const r = btn.closest('.swipe-row'); if (r) swipeClose(r, false); copyPlan(id); break; }
    case 'swipe-delete': swipeDelete(id); break;
    case 'person-edit': { const r = btn.closest('.swipe-row'); if (r) swipeClose(r, false); if (btn.dataset.kind === 'g') openGroupForm(id); else openStudentForm(id); break; }
    case 'person-delete': personDelete(btn.dataset.kind, id); break;
    case 'who-toggle': whoToggle(btn.dataset.scope || 'plan', btn.dataset.kind || 's', id); break;
    case 'who-add-coach': whoAddCoach(btn.dataset.scope || 'plan'); break;
    case 'remove-coach': removeCoach(id); break;
    case 'edit-who': openWhoEditor(id); break;
    case 'who-edit-save': saveWhoEditor(id); break;
    case 'clear-plan':
      if (confirm('Очистить текущий план?')) {
        draft = defaultDraft();
        clearDraftStorage();
        render();
        toast('План очищен');
      }
      break;
    case 'view-plan': schemeHand = 'auto'; openPlan(id); break;
    case 'copy-plan': copyPlan(id); break;
    case 'zoom-court': openCourtZoom(btn); break;
    case 'close-court-zoom':
      if (event.target.closest('.court-zoom-stage') && !event.target.closest('.court-zoom-close')) break;
      closeCourtZoom();
      break;
    case 'delete-plan':
      if (confirm('Удалить запись о тренировке?')) {
        store.plans = store.plans.filter((p) => p.id !== id);
        persist();
        clearReportDraft(id);
        clearNoteDraft(id);
        navigate('training');
        toast('Тренировка удалена');
      }
      break;
    case 'export-data': exportData(); break;
    case 'import-data': requestImport(); break;
  }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'search') { q = t.value; updateExerciseList(); }
  if (t.id === 'plan-goal') { draft.goal = t.value; persistDraft(); refreshPicker(); }
  if (t.tagName === 'TEXTAREA' && t.classList.contains('textarea-auto')) autosizeArea(t);
  if (t.id === 'plan-ex-search') { picker.query = t.value; refreshPicker(); }
  if (t.id === 'plan-notes') { draft.notes = t.value; persistDraft(); }
  if (t.closest && t.closest('#finish-plan-form') && (t.name === 'success' || t.name === 'difficulty' || t.name === 'next' || String(t.name || '').startsWith('snote:'))) {
    queueReportDraft(t.closest('#finish-plan-form'));
  }
  if (t.closest && t.closest('#note-form')) queueNoteDraft(t.closest('#note-form'));
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'import-file') { handleImportFile(t.files && t.files[0]); return; }
  if (t.name === 'studentIds' && t.closest && t.closest('#group-form') && t.checked) haptic();
  switch (t.id) {
    case 'stroke': stroke = t.value; updateExerciseList(); break;
    case 'goal': goal = t.value; updateExerciseList(); break;
    case 'format': format = t.value; updateExerciseList(); break;
    case 'level': level = t.value; updateExerciseList(); break;
    case 'stage': stageF = t.value; updateExerciseList(); break;
    case 'plan-template': applyTemplate(t.value); break;
    case 'plan-ex-stroke': picker.stroke = t.value; refreshPicker(); break;
    case 'plan-date': draft.date = t.value; persistDraft(); break;
    case 'sess-filter': sessFilter = t.value || ''; updateSessList(); break;
  }
  if (t.closest && t.closest('#note-form')) queueNoteDraft(t.closest('#note-form'));
});

document.addEventListener('submit', (e) => {
  const f = e.target;
  const id = f.getAttribute('id');
  if (!['exercise-form', 'student-form', 'group-form', 'finish-plan-form', 'note-form'].includes(id)) return;
  e.preventDefault();
  if (id === 'exercise-form') saveExerciseFromForm(f);
  if (id === 'student-form') saveStudentFromForm(f);
  if (id === 'group-form') saveGroupFromForm(f);
  if (id === 'finish-plan-form') finishPlanFromForm(f);
  if (id === 'note-form') saveNoteFromForm(f);
});


document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('sess-card')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape') {
    if (peekState) { peekClose(); return; }
    if (document.getElementById('court-zoom')) { closeCourtZoom(); return; }
    if (el('overlay').innerHTML) { diagramEditor = null; discardNoteFormDraft(); closeModal('top'); }
    else if (picker.open) { setPlanPicker(picker.section, false); }
  }
});

restoreDraft();
render();
if (view === 'exercises') updateExerciseList();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js?v=30').catch(() => {});
}

</script>
</body>
</html>
